<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Serpent's Workshop — Python from First Line to Advanced Bench</title>
<meta name="description" content="An interactive, fully offline Python learning workshop: 19 stations, voiced coaching with comprehension checks, runnable labs, spaced repetition, and a concept map.">
<style>
/* ══════════════════════════════════════════════════════════
   THE SERPENT'S WORKSHOP — artisan guild stylesheet
   Day shift (warm paper + brass) / Night shift (deep wood)
   ══════════════════════════════════════════════════════════ */
:root{
  --py-blue:#2d5f8f; --py-gold:#FFD43B; --brass:#75590f;
  --bg:#f3ead9; --bg-grain:#eadfc8; --panel:#fdf8ee; --panel2:#f1e6cf;
  --ink:#2b2417; --ink-soft:#584d33; --line:#c9b489;
  --accent:#8a4a12; --ember:#a4420a;
  --ok-bg:#e4efdd; --ok-ink:#2c4a1e; --no-bg:#f6dcd4; --no-ink:#7a2410;
  --mid-bg:#f2e7c6; --mid-ink:#6b5410;
  --code-bg:#2b2620; --code-ink:#f0e6cf;
  --btn-ink:#fdf8ee;
  --shadow:0 3px 14px rgba(60,44,12,.18);
}
[data-theme="night"]{
  --py-blue:#7fb2e0; --brass:#c9a744;
  --bg:#1d1811; --bg-grain:#241e14; --panel:#2a2318; --panel2:#352b1c;
  --ink:#efe4c8; --ink-soft:#c9bb96; --line:#5a4b2c;
  --accent:#e0a05c; --ember:#e07a3a;
  --ok-bg:#27351d; --ok-ink:#c4e0a8; --no-bg:#3d221a; --no-ink:#f0b8a4;
  --mid-bg:#37301a; --mid-ink:#e8d48a;
  --code-bg:#151209; --code-ink:#e8dcc0;
  --btn-ink:#1d1811;
  --shadow:0 3px 16px rgba(0,0,0,.5);
}

*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{
  margin:0; background:var(--bg); color:var(--ink);
  background-image:repeating-linear-gradient(90deg, var(--bg) 0 46px, var(--bg-grain) 46px 48px);
  font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  line-height:1.62; font-size:16.5px;
  padding-bottom:230px; /* room for the coach dock */
}
h1,h2,h3,.brand-title,.panel-title,.station-title{
  font-family:"Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
  letter-spacing:.01em;
}
a{ color:var(--accent); }
code{
  background:var(--panel2); border:1px solid var(--line); border-radius:4px;
  padding:.06em .32em; font-size:.92em;
  font-family:ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
}

/* ── progress bar ── */
#progressBar{ position:fixed; top:0; left:0; right:0; height:7px; background:var(--panel2); z-index:60; }
#progressFill{
  height:100%; width:0; transition:width .5s ease;
  background:linear-gradient(90deg, var(--ember), var(--py-gold));
  border-radius:0 4px 4px 0;
  box-shadow:0 0 8px var(--ember);
}
.progress-label{ text-align:center; color:var(--ink-soft); font-size:.86rem; margin:.4rem 0 0; }

/* ── topbar ── */
.topbar{
  display:flex; flex-wrap:wrap; gap:1rem; align-items:center; justify-content:space-between;
  padding:1.5rem 2rem .6rem;
}
.brand{ display:flex; align-items:baseline; gap:.7rem; flex-wrap:wrap; }
.brand-serpent{ font-size:1.9rem; }
.brand-title{ margin:0; font-size:2rem; }
.brand-sub{ color:var(--ink-soft); font-size:.95rem; font-style:italic; }
.topbar-tools{ display:flex; gap:.7rem; align-items:center; flex-wrap:wrap; }
#searchBox{
  background:var(--panel); color:var(--ink); border:1.5px solid var(--line);
  border-radius:20px; padding:.45rem 1rem; min-width:210px; font-size:.95rem;
}
#searchBox:focus{ outline:2px solid var(--py-blue); }

/* ── xp chip ── */
.xp-chip{
  display:flex; align-items:center; gap:.55rem;
  background:var(--panel); border:1.5px solid var(--brass); border-radius:20px;
  padding:.35rem .9rem; box-shadow:var(--shadow);
}
.xp-level{ font-weight:700; color:var(--accent); font-size:.9rem; }
.xp-amount{ color:var(--ink-soft); font-size:.85rem; }
.xp-track{ width:74px; height:8px; background:var(--panel2); border-radius:5px; overflow:hidden; border:1px solid var(--line); }
.xp-fill{ height:100%; width:0; background:linear-gradient(90deg, var(--py-blue), var(--py-gold)); transition:width .4s; }

/* ── buttons ── */
.btn{
  font:inherit; cursor:pointer; border-radius:8px; padding:.5rem 1.05rem;
  border:1.5px solid var(--brass); background:var(--panel2); color:var(--ink);
  transition:transform .06s, box-shadow .2s;
}
.btn:hover{ box-shadow:var(--shadow); }
.btn:active{ transform:translateY(1px); }
.btn:focus-visible{ outline:2.5px solid var(--py-blue); outline-offset:2px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn-run{ background:var(--accent); border-color:var(--accent); color:var(--btn-ink); font-weight:700; }
.btn-ghost{ background:transparent; }
.btn-coach{
  background:var(--py-blue); border-color:var(--py-blue); color:#fff; font-weight:700;
  border-radius:22px; padding:.55rem 1.3rem;
}
[data-theme="night"] .btn-coach{ color:#10131a; }
.btn-alt{
  font:inherit; cursor:pointer; background:none; border:none; color:var(--accent);
  text-decoration:underline dotted; padding:.2rem 0; margin-top:.5rem; font-size:.95rem;
}
.btn-alt:focus-visible{ outline:2.5px solid var(--py-blue); outline-offset:2px; }

/* ── panels ── */
.panel{
  background:var(--panel); border:1.5px solid var(--line); border-radius:14px;
  box-shadow:var(--shadow); margin:1.6rem auto; max-width:1120px; padding:1.6rem 2rem;
}
.panel-title{ margin:.1rem 0 .8rem; font-size:1.45rem; color:var(--accent); }
.intro-panel{ border-left:7px solid var(--py-gold); }

/* ── concept map ── */
.map-host svg{ width:100%; height:auto; display:block; }
.map-edge{ stroke:var(--line); stroke-width:2; }
.map-node{ cursor:pointer; }
.map-node rect{ fill:var(--panel2); stroke:var(--brass); stroke-width:2; transition:filter .2s; }
.map-node:hover rect, .map-node:focus rect{ filter:brightness(1.12); }
.map-node:focus{ outline:none; }
.map-node:focus rect{ stroke:var(--py-blue); stroke-width:3.5; }
.map-node.started rect{ fill:var(--py-blue); }
.map-node.started text{ fill:#fff; }
.map-node.mastered rect{ fill:var(--py-gold); stroke:var(--brass); }
.map-node.mastered text{ fill:#3a3005; }
.map-node.advanced rect{ stroke-dasharray:6 3; }
.map-num{ font-size:11px; font-weight:800; text-anchor:middle; fill:var(--ink-soft); font-family:ui-monospace, monospace; }
.map-label{ font-size:13px; text-anchor:middle; fill:var(--ink); font-weight:600; }

/* ── floor layout ── */
.floor{ display:grid; grid-template-columns:250px 1fr; gap:1.4rem; max-width:1240px; margin:0 auto; padding:0 1.2rem; }
@media (max-width:900px){ .floor{ grid-template-columns:1fr; } .station-nav{ position:static !important; max-height:none !important; } }
.station-nav{
  position:sticky; top:18px; align-self:start; max-height:calc(100vh - 260px); overflow:auto;
  background:var(--panel); border:1.5px solid var(--line); border-radius:12px; padding:.7rem; box-shadow:var(--shadow);
}
.nav-item{
  display:flex; gap:.55rem; align-items:center; padding:.42rem .6rem; border-radius:8px;
  text-decoration:none; color:var(--ink); font-size:.92rem;
}
.nav-item:hover{ background:var(--panel2); }
.nav-item.done .nav-title{ color:var(--ok-ink); }
[data-theme="night"] .nav-item.done .nav-title{ color:var(--ok-ink); }
.nav-item.advanced .nav-num{ border-style:dashed; }
.nav-num{
  font-family:ui-monospace, monospace; font-size:.78rem; font-weight:800; color:var(--brass);
  border:1.5px solid var(--brass); border-radius:6px; padding:.1rem .3rem; min-width:2rem; text-align:center;
}
.nav-mark{ margin-left:auto; color:var(--ok-ink); font-weight:800; }
[data-theme="night"] .nav-mark{ color:#9fd07a; }
.nav-empty{ color:var(--ink-soft); font-size:.9rem; padding:.5rem; }

/* ── stations ── */
.station{
  background:var(--panel); border:1.5px solid var(--line); border-radius:16px;
  box-shadow:var(--shadow); margin-bottom:2.3rem; padding:1.9rem 2.2rem; position:relative;
}
.station::before, .station::after{ /* rivets */
  content:"● ●"; position:absolute; left:1rem; right:1rem; color:var(--line);
  font-size:.55rem; letter-spacing:.4rem; display:flex; justify-content:space-between;
}
.station::before{ top:.55rem; }
.station::after{ bottom:.55rem; }
.station-head{ border-bottom:2px solid var(--line); padding-bottom:1rem; margin-bottom:1.2rem; }
.station-plate{ display:flex; gap:.8rem; align-items:center; }
.station-num{
  font-family:ui-monospace, monospace; font-weight:800; font-size:.82rem; letter-spacing:.14em;
  background:var(--brass); color:var(--panel); border-radius:6px; padding:.22rem .6rem;
}
[data-theme="night"] .station-num{ color:#1d1811; }
.advanced-flag{
  font-family:ui-monospace, monospace; font-weight:800; font-size:.74rem; letter-spacing:.12em;
  border:1.7px dashed var(--ember); color:var(--ember); border-radius:6px; padding:.18rem .55rem;
}
.station-title{ margin:.55rem 0 .3rem; font-size:1.75rem; }
.station-art{ float:right; width:150px; margin:0 0 .6rem 1.2rem; }
.station-art svg{ width:100%; height:auto; }
@media (max-width:640px){ .station-art{ float:none; margin:0 auto .6rem; display:block; } }

.section{ margin:1.35rem 0; }
.section-label{
  font-family:ui-monospace, monospace; font-size:.8rem; font-weight:800; letter-spacing:.16em;
  text-transform:uppercase; color:var(--brass); margin:0 0 .35rem;
  border-bottom:1px dotted var(--line); padding-bottom:.2rem;
}
.section-prose p{ margin:.5rem 0; }

/* code samples */
.code-sample{
  background:var(--code-bg); color:var(--code-ink); border-radius:10px;
  padding:1rem 1.2rem; overflow:auto; font-size:.92rem; line-height:1.55;
  border-left:6px solid var(--py-gold); box-shadow:inset 0 0 24px rgba(0,0,0,.35);
}
.code-sample code{ background:none; border:none; padding:0; color:inherit; font-size:inherit; }
.code-note{ font-size:.87rem; color:var(--ink-soft); font-style:italic; margin:.3rem 0 0; }

/* alt boxes */
.alt-box{ display:none; margin-top:.6rem; }
.alt-box.open{ display:block; }
.alt-box{
  background:var(--panel2); border:1.5px dashed var(--brass); border-radius:10px; padding: .9rem 1.1rem;
}
.alt-tag{
  font-family:ui-monospace, monospace; font-size:.72rem; font-weight:800; letter-spacing:.16em; color:var(--accent);
  margin-bottom:.3rem;
}

/* ── labs ── */
.lab{
  background:var(--panel2); border:1.5px solid var(--brass); border-radius:12px;
  padding:1.1rem 1.3rem; margin:1.5rem 0;
}
.lab-head{
  font-family:ui-monospace, monospace; font-weight:800; font-size:.78rem; letter-spacing:.16em; color:var(--accent);
  margin-bottom:.6rem;
}
.lab-editor{
  width:100%; min-height:190px; resize:vertical;
  background:var(--code-bg); color:var(--code-ink); border:none; border-radius:9px;
  font-family:ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; font-size:.92rem; line-height:1.5;
  padding:.9rem 1rem; tab-size:4;
}
.lab-editor:focus{ outline:2.5px solid var(--py-blue); }
.lab-buttons{ display:flex; gap:.6rem; margin:.7rem 0; flex-wrap:wrap; }
.lab-hint{ display:none; background:var(--mid-bg); color:var(--mid-ink); border-radius:8px; padding:.7rem 1rem; font-size:.92rem; margin-bottom:.6rem; }
.lab-hint.open{ display:block; }
.lab-output{
  background:var(--code-bg); color:var(--code-ink); border-radius:9px; padding:.8rem 1rem;
  min-height:52px; white-space:pre-wrap; font-size:.9rem; margin:0;
  font-family:ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
  border-left:6px solid var(--ok-ink);
}
.lab-output.has-error{ border-left-color:#d9482b; }

/* visualizers */
.viz-code{ background:var(--code-bg); color:var(--code-ink); border-radius:9px; padding:.7rem 1rem; font-size:.92rem; font-family:ui-monospace, monospace; margin:0 0 .7rem; }
.viz-line{ padding:.06rem .4rem; border-radius:5px; white-space:pre; }
.viz-line.hot{ background:var(--py-gold); color:#221b04; font-weight:700; }
.viz-state{ font-size:.94rem; margin:.5rem 0; color:var(--ink-soft); }
.viz-state b{ color:var(--ink); }
.viz-log{ margin-top:.6rem; }
.kitchen{ display:flex; flex-direction:column; gap:.55rem; margin:.6rem 0; }
.pot-row{ display:flex; align-items:center; gap:.8rem; }
.pot-name{ width:96px; font-family:ui-monospace, monospace; font-size:.88rem; }
.pot-bar{ flex:1; height:20px; background:var(--panel); border:1.5px solid var(--brass); border-radius:11px; overflow:hidden; }
.pot-fill{ height:100%; width:0; background:linear-gradient(90deg, var(--py-blue), var(--py-gold)); }
.pot-done{ width:1.4rem; color:var(--ok-ink); font-weight:800; }
[data-theme="night"] .pot-done{ color:#9fd07a; }

/* ── quizzes ── */
.quiz-block{ border-top:2px dotted var(--line); margin-top:1.6rem; padding-top:1rem; }
.quiz-q{ margin:1rem 0 1.3rem; }
.quiz-prompt{ font-weight:700; margin:.2rem 0 .55rem; }
.quiz-opts, .coach-quiz-opts{ display:grid; gap:.5rem; }
@media (min-width:760px){ .quiz-opts, .coach-quiz-opts{ grid-template-columns:1fr 1fr; } }
.quiz-opt{
  font:inherit; text-align:left; cursor:pointer; border-radius:9px; padding:.6rem .9rem;
  border:1.5px solid var(--line); background:var(--panel); color:var(--ink); transition:border-color .15s;
}
.quiz-opt:hover{ border-color:var(--py-blue); }
.quiz-opt:focus-visible{ outline:2.5px solid var(--py-blue); outline-offset:2px; }
.quiz-opt.right{ background:var(--ok-bg); color:var(--ok-ink); border-color:var(--ok-ink); font-weight:700; }
.quiz-opt.wrong{ background:var(--no-bg); color:var(--no-ink); border-color:var(--no-ink); }
.quiz-explain{ border-radius:9px; padding:.65rem 1rem; margin-top:.55rem; font-size:.94rem; }
.quiz-explain.ok{ background:var(--ok-bg); color:var(--ok-ink); }
.quiz-explain.no{ background:var(--no-bg); color:var(--no-ink); }
.quiz-retry{ margin-top:.3rem; }

/* ── coach dock ── */
.coach-dock{
  position:fixed; left:0; right:0; bottom:0; z-index:80;
  background:linear-gradient(180deg, var(--panel2), var(--panel));
  border-top:3px solid var(--brass); box-shadow:0 -6px 22px rgba(40,28,6,.28);
  transition:transform .25s ease;
}
.coach-dock.collapsed .coach-body{ display:none; }
.coach-bar{
  display:flex; align-items:center; gap:.9rem; padding:.5rem 1.2rem; flex-wrap:wrap;
}
.coach-toggle{
  font-family:ui-monospace, monospace; font-weight:800; letter-spacing:.14em; font-size:.8rem;
  display:flex; align-items:center; gap:.5rem; cursor:pointer;
  background:none; border:none; color:var(--accent); padding:.3rem .2rem;
}
.coach-toggle:focus-visible{ outline:2.5px solid var(--py-blue); outline-offset:2px; }
.coach-lamp{
  width:11px; height:11px; border-radius:50%; background:var(--ember);
  box-shadow:0 0 8px var(--ember); display:inline-block;
}
.coach-state{ color:var(--ink-soft); font-size:.85rem; font-style:italic; }
.coach-spacer{ flex:1; }
.coach-pref{ font-size:.82rem; color:var(--ink-soft); display:flex; align-items:center; gap:.35rem; }
.coach-pref input[type=range]{ width:90px; }
.coach-pref select{ max-width:150px; font-size:.82rem; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:.2rem; }
.coach-body{ padding:.4rem 1.4rem 1.1rem; max-width:1120px; margin:0 auto; max-height:190px; overflow:auto; }
.coach-seg-tag{
  font-family:ui-monospace, monospace; font-size:.74rem; font-weight:800; letter-spacing:.14em;
  color:var(--brass); text-transform:uppercase; margin-bottom:.25rem;
}
.coach-line{ margin:.25rem 0 .6rem; font-size:1.02rem; }
.coach-line.ok{ color:var(--ok-ink); } .coach-line.no{ color:var(--no-ink); }
.coach-controls{ display:flex; gap:.55rem; flex-wrap:wrap; }

/* ── deck ── */
.deck-meta{ color:var(--ink-soft); font-size:.92rem; }
.deck-done{ color:var(--ink-soft); }
.deck-card{
  background:var(--panel2); border:1.5px solid var(--brass); border-radius:12px;
  padding:1.1rem 1.3rem; margin:.7rem 0;
}
.deck-ch{ font-family:ui-monospace, monospace; font-size:.74rem; font-weight:800; letter-spacing:.13em; color:var(--brass); text-transform:uppercase; }
.deck-front{ font-weight:700; font-size:1.08rem; margin:.4rem 0; }
.deck-back{ display:none; border-top:1.5px dotted var(--line); padding-top:.6rem; margin-top:.4rem; }
.deck-card.revealed .deck-back{ display:block; }
.deck-grades{ display:none; gap:.55rem; margin-top:.7rem; }
.deck-grades.open{ display:flex; flex-wrap:wrap; }
.deck-grade.no{ background:var(--no-bg); color:var(--no-ink); border-color:var(--no-ink); }
.deck-grade.mid{ background:var(--mid-bg); color:var(--mid-ink); border-color:var(--mid-ink); }
.deck-grade.ok{ background:var(--ok-bg); color:var(--ok-ink); border-color:var(--ok-ink); }

/* ── weak spots ── */
.weak-row{
  display:flex; gap:.9rem; align-items:center; padding:.5rem .2rem;
  border-bottom:1px dotted var(--line); flex-wrap:wrap;
}
.weak-ch{ font-family:ui-monospace, monospace; font-size:.76rem; font-weight:800; color:var(--brass); min-width:150px; }
.weak-q{ flex:1; min-width:220px; }

/* ── badges ── */
.badge-shelf{ display:flex; gap:.8rem; flex-wrap:wrap; }
.badge{
  display:flex; flex-direction:column; align-items:center; gap:.2rem; width:104px;
  background:var(--panel2); border:1.5px solid var(--line); border-radius:11px; padding:.7rem .4rem;
  opacity:.42; filter:grayscale(.9); text-align:center;
}
.badge.earned{ opacity:1; filter:none; border-color:var(--brass); box-shadow:var(--shadow); }
.badge-icon{ font-size:1.5rem; }
.badge-name{ font-size:.74rem; font-weight:700; color:var(--ink-soft); }
.badge.earned .badge-name{ color:var(--ink); }

/* ── repl ── */
.repl-out{ max-height:230px; overflow:auto; margin-bottom:.6rem; }
.repl-row{ display:flex; gap:.55rem; flex-wrap:wrap; }
.repl-in{
  flex:1; min-width:220px; background:var(--code-bg); color:var(--code-ink); border:none; border-radius:8px;
  font-family:ui-monospace, monospace; font-size:.92rem; padding:.55rem .9rem;
}
.repl-in:focus{ outline:2.5px solid var(--py-blue); }

/* ── subset notes ── */
.subset-cols{ display:grid; gap:1.4rem; }
@media (min-width:760px){ .subset-cols{ grid-template-columns:1fr 1fr; } }
.subset-list{ margin:.3rem 0; padding-left:1.3rem; }
.subset-list.ok li::marker{ color:var(--ok-ink); }
.subset-list.no li::marker{ color:var(--no-ink); }
.subset-list li{ margin:.22rem 0; font-size:.94rem; }

/* ── toasts ── */
#toasts{ position:fixed; top:16px; right:16px; z-index:120; display:flex; flex-direction:column; gap:.5rem; }
.toast{
  background:var(--ink); color:var(--panel); border-radius:9px; padding:.6rem 1.1rem; font-size:.92rem;
  opacity:0; transform:translateX(14px); transition:all .35s ease; box-shadow:var(--shadow); max-width:320px;
}
[data-theme="night"] .toast{ background:var(--py-gold); color:#221b04; }
.toast.show{ opacity:1; transform:translateX(0); }
.toast.badge{ background:var(--py-gold); color:#221b04; font-weight:700; }

</style>
</head>
<body>
<main id="app"></main>
<noscript><p style="padding:2rem;font-family:serif">The Serpent's Workshop needs JavaScript — everything runs locally in your browser; nothing is sent anywhere.</p></noscript>
<script>
/* ============================================================
   THE SERPENT'S WORKSHOP — engine.js
   Pure logic layer. No DOM. Testable under Node.
   Contents:
     1. PyLite — a Python-subset interpreter (tokenizer/parser/evaluator)
     2. SM2   — spaced-repetition scheduler
     3. Coach — voiceover coach finite state machine (pure reducer)
     4. XP    — progression & badge rules
     5. Util  — seeded PRNG, deterministic answer shuffling
   ============================================================ */
'use strict';

/* ================= 1. PyLite ================= */

const PY_KEYWORDS = new Set(['if','elif','else','while','for','in','def','return','break','continue','pass',
  'True','False','None','and','or','not','try','except','finally','raise','class','import','from','as',
  'with','global','lambda','del']);

const SUBSET_NOTES = {
  supported: [
    'Numbers (int/float with Python semantics: / gives float, // floors, % follows divisor sign, ** right-assoc)',
    'Strings with escapes, f-strings with {expr} and {expr:.Nf}', 'Booleans, None, chained comparisons, and/or/not, in / not in',
    'Lists, tuples, dicts, sets (literals, indexing, negative indices, slicing a[i:j], unpacking a, b = ...)',
    'if/elif/else, while, for..in, break/continue/pass', 'Functions: def, return, default params, keyword args, closures, lambda',
    'List comprehensions [expr for x in xs if cond]', 'try/except TypeName as e/finally, raise',
    'Classes: __init__, methods, single inheritance, __str__, instance attributes',
    'Simple decorators (@name above def)', 'with open(...) as f on a built-in virtual file system',
    'global keyword', 'import math (pi, e, sqrt, floor, ceil, pow, fabs)',
    'Builtins: print (sep/end), len, range, str, int, float, bool, list, dict, set, tuple, sum, min, max, sorted, reversed, abs, round, type, enumerate, zip, input (from a preset script), isinstance, chr, ord, open'
  ],
  notSupported: [
    'yield / generators (taught via the step-through visualizer instead)', 'super() (call Base.method(self, ...) directly)',
    '*args / **kwargs', 'is / is not (use == and !=)', 'nonlocal', 'dict/set comprehensions', 'async/await (conceptual chapter only)',
    'Multiple inheritance, metaclasses, descriptors', 'Imports other than math', 'Format specs beyond :.Nf', 'match/case, walrus :='
  ]
};

class PyError extends Error {
  constructor(pyType, msg, line) { super(msg); this.pyType = pyType; this.pyMsg = msg; this.line = line; }
}
function perr(t, m, line) { throw new PyError(t, m, line); }

/* ---- values ---- */
function PyNum(v, isFloat) { return { t:'num', v, f: !!isFloat }; }
function isNum(x){ return x && x.t === 'num'; }
function pyBoolAsNum(x){ return x === true ? PyNum(1,false) : x === false ? PyNum(0,false) : x; }
function mkTuple(items){ return { t:'tuple', items }; }
function mkSet(){ return { t:'set', m: new Map() }; }
function mkDict(){ return { t:'dict', m: new Map() }; }
function mkRange(start, stop, step){ return { t:'range', start, stop, step }; }

function keyOf(v, line){
  if (typeof v === 'string') return 's:' + v;
  if (v === true || v === false) return 'i:' + (v?1:0);
  if (v === null) return 'n:';
  if (isNum(v)) return (v.f && !Number.isInteger(v.v) ? 'f:' : 'i:') + v.v;
  if (v.t === 'tuple') return 't:(' + v.items.map(x=>keyOf(x,line)).join(',') + ')';
  perr('TypeError', "unhashable type: '" + pyTypeName(v) + "'", line);
}

function pyTypeName(v){
  if (v === null) return 'NoneType';
  if (v === true || v === false) return 'bool';
  if (typeof v === 'string') return 'str';
  if (Array.isArray(v)) return 'list';
  if (isNum(v)) return v.f ? 'float' : 'int';
  switch(v.t){
    case 'tuple': return 'tuple'; case 'dict': return 'dict'; case 'set': return 'set';
    case 'range': return 'range'; case 'func': case 'builtin': case 'bound': case 'lambda': return 'function';
    case 'class': return 'type'; case 'inst': return v.cls.name; case 'file': return 'TextIOWrapper';
    case 'module': return 'module';
  }
  return 'object';
}

function floatRepr(n){
  if (Number.isInteger(n) && Math.abs(n) < 1e16) return n.toFixed(1);
  let s = String(n);
  return s;
}

function pyRepr(v){
  if (v === null) return 'None';
  if (v === true) return 'True';
  if (v === false) return 'False';
  if (typeof v === 'string') return "'" + v.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\t/g,'\\t') + "'";
  if (isNum(v)) return v.f ? floatRepr(v.v) : String(v.v);
  if (Array.isArray(v)) return '[' + v.map(pyRepr).join(', ') + ']';
  switch(v.t){
    case 'tuple': return '(' + v.items.map(pyRepr).join(', ') + (v.items.length===1?',':'') + ')';
    case 'dict': return '{' + [...v.m.values()].map(e => pyRepr(e.k) + ': ' + pyRepr(e.v)).join(', ') + '}';
    case 'set': return v.m.size ? '{' + [...v.m.values()].map(e => pyRepr(e.k)).join(', ') + '}' : 'set()';
    case 'range': return 'range(' + v.start + ', ' + v.stop + (v.step!==1 ? ', '+v.step : '') + ')';
    case 'func': return '<function ' + v.name + '>';
    case 'lambda': return '<function <lambda>>';
    case 'builtin': return '<built-in function ' + v.name + '>';
    case 'bound': return '<bound method ' + v.fn.name + '>';
    case 'class': return "<class '" + v.name + "'>";
    case 'inst': {
      const s = findMethod(v.cls, '__str__');
      return s ? null : '<' + v.cls.name + ' object>';
    }
    case 'file': return "<file '" + v.name + "'>";
    case 'module': return "<module '" + v.name + "'>";
  }
  return String(v);
}

/* ---- tokenizer ---- */
function tokenize(src){
  const tokens = [];
  const lines = src.replace(/\r\n?/g,'\n').split('\n');
  const indents = [0];
  let bracketDepth = 0;
  for (let li = 0; li < lines.length; li++){
    let line = lines[li].replace(/\t/g, '    ');
    const lineNo = li + 1;
    // blank / comment-only lines: skip entirely when not inside brackets
    if (bracketDepth === 0){
      const trimmed = line.trim();
      if (trimmed === '' || trimmed.startsWith('#')) continue;
      let ind = 0; while (ind < line.length && line[ind] === ' ') ind++;
      const cur = indents[indents.length-1];
      if (ind > cur){ indents.push(ind); tokens.push({type:'INDENT', line: lineNo}); }
      else if (ind < cur){
        while (indents.length && indents[indents.length-1] > ind){ indents.pop(); tokens.push({type:'DEDENT', line: lineNo}); }
        if (indents[indents.length-1] !== ind) perr('IndentationError', 'unindent does not match any outer indentation level', lineNo);
      }
    }
    let i = bracketDepth === 0 ? line.search(/\S/) : 0;
    if (i < 0) i = 0;
    while (i < line.length){
      const c = line[i];
      if (c === ' '){ i++; continue; }
      if (c === '#'){ i = line.length; break; }
      // strings (with optional f prefix)
      if ((c === 'f' || c === 'F') && (line[i+1] === '"' || line[i+1] === "'")){
        const r = readString(line, i+1, lineNo); tokens.push({type:'STRING', value:r.value, isF:true, line:lineNo}); i = r.end; continue;
      }
      if (c === '"' || c === "'"){
        const r = readString(line, i, lineNo); tokens.push({type:'STRING', value:r.value, isF:false, line:lineNo}); i = r.end; continue;
      }
      if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(line[i+1]||''))){
        let j = i, seenDot = false;
        while (j < line.length && (/[0-9_]/.test(line[j]) || (line[j]==='.' && !seenDot))){ if(line[j]==='.') seenDot = true; j++; }
        const raw = line.slice(i,j).replace(/_/g,'');
        tokens.push({type:'NUMBER', value: parseFloat(raw), isFloat: seenDot, line:lineNo});
        i = j; continue;
      }
      if (/[A-Za-z_]/.test(c)){
        let j = i; while (j < line.length && /[A-Za-z0-9_]/.test(line[j])) j++;
        const word = line.slice(i,j);
        tokens.push({type: PY_KEYWORDS.has(word) ? 'KW' : 'NAME', value: word, line: lineNo});
        i = j; continue;
      }
      const three = line.slice(i,i+3), two = line.slice(i,i+2);
      if (two === '//' && line[i+2] === '='){ tokens.push({type:'OP', value:'//=', line:lineNo}); i+=3; continue; }
      if (three === '**='){ tokens.push({type:'OP', value:'**=', line:lineNo}); i+=3; continue; }
      if (['==','!=','<=','>=','//','**','+=','-=','*=','/=','%=','->'].includes(two)){ tokens.push({type:'OP', value:two, line:lineNo}); i+=2; continue; }
      if ('+-*/%<>=(),[]{}:.;@'.includes(c)){
        if ('([{'.includes(c)) bracketDepth++;
        if (')]}'.includes(c)) bracketDepth = Math.max(0, bracketDepth-1);
        tokens.push({type:'OP', value:c, line:lineNo}); i++; continue;
      }
      perr('SyntaxError', "invalid character '" + c + "'", lineNo);
    }
    if (bracketDepth === 0) tokens.push({type:'NEWLINE', line: lineNo});
  }
  while (indents.length > 1){ indents.pop(); tokens.push({type:'DEDENT', line: lines.length}); }
  tokens.push({type:'EOF', line: lines.length});
  return tokens;
}

function readString(line, start, lineNo){
  const q = line[start]; let i = start+1, out = '';
  while (i < line.length){
    const c = line[i];
    if (c === '\\'){
      const n = line[i+1];
      out += n === 'n' ? '\n' : n === 't' ? '\t' : n === '\\' ? '\\' : n === "'" ? "'" : n === '"' ? '"' : ('\\'+n);
      i += 2; continue;
    }
    if (c === q) return { value: out, end: i+1 };
    out += c; i++;
  }
  perr('SyntaxError', 'unterminated string literal', lineNo);
}

/* ---- parser ---- */
function parse(tokens){
  let pos = 0;
  const peek = (k=0) => tokens[pos+k];
  const next = () => tokens[pos++];
  const at = (type, value) => { const t = peek(); return t.type === type && (value === undefined || t.value === value); };
  const atKW = (w) => at('KW', w);
  const expect = (type, value) => {
    const t = peek();
    if (t.type !== type || (value !== undefined && t.value !== value))

    return next();
  };
  const skipNewlines = () => { while (at('NEWLINE')) next(); };

  function parseProgram(){
    const body = [];
    skipNewlines();
    while (!at('EOF')){ body.push(parseStatement()); skipNewlines(); }
    return { type:'Program', body };
  }

  function parseBlock(){
    expect('OP', ':');
    if (!at('NEWLINE')){ // single-line suite: if x: print(x)
      const stmt = parseSimpleStatement();
      return [stmt];
    }
    expect('NEWLINE'); skipNewlines();
    expect('INDENT');
    const body = [];
    skipNewlines();
    while (!at('DEDENT') && !at('EOF')){ body.push(parseStatement()); skipNewlines(); }
    if (at('DEDENT')) next();
    return body;
  }

  function parseStatement(){
    const t = peek();
    if (t.type === 'KW'){
      switch(t.value){
        case 'if': return parseIf();
        case 'while': return parseWhile();
        case 'for': return parseFor();
        case 'def': return parseDef([]);
        case 'class': return parseClass();
        case 'try': return parseTry();
        case 'with': return parseWith();
      }
    }
    if (at('OP','@')) perr('SyntaxError','decorator syntax error', t.line);
    if (t.type === 'OP' && t.value === '.') perr('SyntaxError', "unexpected '.'", t.line);
    if (t.type === 'OP' && t.value === '@'){ }
    return parseSimpleStatementLine();
  }

  function parseSimpleStatementLine(){
    // handle decorators: OP '.'? we tokenize '@'? -> '@' not in op list; add support:
    const s = parseSimpleStatement();
    if (at('NEWLINE')) next();
    return s;
  }

  function parseSimpleStatement(){
    const t = peek();
    if (t.type === 'KW'){
      switch(t.value){
        case 'return': { next(); let arg = null; if (!at('NEWLINE') && !at('EOF')) arg = parseExprList(); return {type:'Return', arg, line:t.line}; }

        case 'continue': next(); return {type:'Continue', line:t.line};
        case 'pass': next(); return {type:'Pass', line:t.line};
        case 'global': { next(); const names=[expect('NAME').value]; while(at('OP',',')){next(); names.push(expect('NAME').value);} return {type:'Global', names, line:t.line}; }
        case 'raise': { next(); let e = null; if (!at('NEWLINE')) e = parseExpr(); return {type:'Raise', exc:e, line:t.line}; }

      const value = targets.pop();

      return {type:'Assign', target: targets[0], value, line:t.line};

    const aug = ['+=','-=','*=','/=','//=','%=','**='];
    if (peek().type==='OP' && aug.includes(peek().value)){

      const value = parseExpr();
      return {type:'AugAssign', target: expr, op, value, line:t.line};
    }
    return {type:'ExprStmt', expr, line:t.line};
  }

  function parseExprList(){
    const first = parseExpr();
    if (!at('OP',',')) return first;
    const items=[first];
    while (at('OP',',')){ next(); if (at('OP','=')||at('NEWLINE')||at('OP',')')) break; items.push(parseExpr()); }
    return {type:'TupleExpr', items, line: first.line};
  }

  function parseIf(){
    const t0 = peek();
    if (!atKW('if') && !atKW('elif')) expect('KW','if');
    const line = next().line;
    const test = parseExpr();
    const body = parseBlock();
    let orelse = [];
    skipNewlines();
    if (atKW('elif')){ orelse = [parseIf()]; }
    else if (atKW('else')){ next(); orelse = parseBlock(); }
    return {type:'If', test, body, orelse, line};
  }
  function parseWhile(){
    const line = expect('KW','while').line;
    const test = parseExpr(); const body = parseBlock();
    return {type:'While', test, body, line};
  }
  function parseFor(){
    const line = expect('KW','for').line;
    const targets = [expect('NAME').value];
    while (at('OP',',')){ next(); targets.push(expect('NAME').value); }
    expect('KW','in');
    const iter = parseExprList();
    const body = parseBlock();
    return {type:'For', targets, iter, body, line};
  }
  function parseDef(decorators){
    const line = expect('KW','def').line;
    const name = expect('NAME').value;
    expect('OP','(');
    const params = [], defaults = [];
    while (!at('OP',')')){
      const p = expect('NAME').value;
      params.push(p);
      if (at('OP','=')){ next(); defaults.push({name:p, expr: parseExpr()}); }

      if (at('OP',',')) next();

    const body = parseBlock();
    return {type:'Def', name, params, defaults, body, decorators, line};
  }
  function parseClass(){
    const line = expect('KW','class').line;
    const name = expect('NAME').value;
    let base = null;
    if (at('OP','(')){ next(); if (!at('OP',')')) base = expect('NAME').value; expect('OP',')'); }
    const body = parseBlock();
    return {type:'ClassDef', name, base, body, line};
  }
  function parseTry(){
    const line = expect('KW','try').line;
    const body = parseBlock();
    const handlers = []; let finallyBody = null;
    skipNewlines();
    while (atKW('except')){
      next();
      let exType = null, varName = null;
      if (!at('OP',':')){
        exType = expect('NAME').value;
        if (atKW('as')){ next(); varName = expect('NAME').value; }
      }
      handlers.push({exType, varName, body: parseBlock()});
      skipNewlines();

    if (atKW('finally')){ next(); finallyBody = parseBlock(); }
    if (!handlers.length && !finallyBody) perr('SyntaxError',"expected 'except' or 'finally' block", line);
    return {type:'Try', body, handlers, finallyBody, line};
  }
  function parseWith(){
    const line = expect('KW','with').line;
    const ctx = parseExpr();
    let varName = null;
    if (atKW('as')){ next(); varName = expect('NAME').value; }
    const body = parseBlock();
    return {type:'With', ctx, varName, body, line};
  }

  /* expressions */
  function parseExpr(){ return parseTernary(); }
  function parseTernary(){
    const val = parseOr();
    if (atKW('if')){
      const line = next().line;
      const test = parseOr();
      expect('KW','else');
      const alt = parseExpr();
      return {type:'IfExp', test, body: val, orelse: alt, line};
    }
    return val;
  }
  function parseOr(){
    let left = parseAnd();
    while (atKW('or')){ const line = next().line; const right = parseAnd(); left = {type:'BoolOp', op:'or', left, right, line}; }
    return left;
  }
  function parseAnd(){
    let left = parseNot();
    while (atKW('and')){ const line = next().line; const right = parseNot(); left = {type:'BoolOp', op:'and', left, right, line}; }
    return left;
  }
  function parseNot(){
    if (atKW('not')){ const line = next().line; return {type:'UnaryOp', op:'not', operand: parseNot(), line}; }
    return parseComparison();
  }
  function parseComparison(){
    let left = parseArith();
    const ops = [], rights = [];
    while (true){
      let op = null;
      if (peek().type==='OP' && ['==','!=','<','>','<=','>='].includes(peek().value)) op = next().value;
      else if (atKW('in')) { next(); op = 'in'; }

  function parseArith(){

  function parseTerm(){
    let left = parseUnary();
    while (at('OP','*') || at('OP','/') || at('OP','//') || at('OP','%')){ const op = next(); left = {type:'BinOp', op:op.value, left, right: parseUnary(), line: op.line}; }
    return left;
  }
  function parseUnary(){
    if (at('OP','-')){ const line = next().line; return {type:'UnaryOp', op:'-', operand: parseUnary(), line}; }

  function parsePostfix(node){
    while (true){

        if (at('OP',':')){ isSlice = true; next(); if (!at('OP',']')) hi = parseExpr(); }

    if (t.type === 'NAME'){ next(); return {type:'Name', name:t.value, line:t.line}; }

      if (t.value==='False'){ next(); return {type:'Const', v:false, line:t.line}; }
      if (t.value==='None'){ next(); return {type:'Const', v:null, line:t.line}; }
      if (t.value==='lambda'){

        while (!at('OP',':')){ params.push(expect('NAME').value); if (at('OP',',')) next(); }
        expect('OP',':');

        return {type:'Lambda', params, body, line:t.line};

      if (t.value==='not'){ next(); return {type:'UnaryOp', op:'not', operand: parseNot(), line:t.line}; }
    }
    if (at('OP','(')){
      next();
      if (at('OP',')')){ next(); return {type:'Tuple', items:[], line:t.line}; }
      const first = parseExpr();
      if (at('OP',',')){
        const items=[first];
        while (at('OP',',')){ next(); if (at('OP',')')) break; items.push(parseExpr()); }

      expect('OP',')');

    }
    if (at('OP','[')){

      if (atKW('for')){

        const targets=[expect('NAME').value];
        while (at('OP',',')){ next(); targets.push(expect('NAME').value); }
        expect('KW','in');
        const iter = parseOr(); // or-level: the trailing 'if' belongs to the comprehension filter, not a ternary
        let cond = null;
        if (atKW('if')){ next(); cond = parseExpr(); }
        expect('OP',']');
        return {type:'ListComp', expr:first, targets, iter, cond, line:t.line};
      }
      const items=[first];
      while (at('OP',',')){ next(); if (at('OP',']')) break; items.push(parseExpr()); }
      expect('OP',']');
      return {type:'List', items, line:t.line};
    }
    if (at('OP','{')){
      next();
