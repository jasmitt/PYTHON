lab:{type:'pylite',
 starter:'# Name badge maker\nfirst = "ada"\nlast = "lovelace"\n# 1. Build full = first + " " + last\n# 2. Print it in Title-ish case using .upper() on first letters is hard —\n#    instead just print full.upper() and len(full).\n# 3. Print a badge line with an f-string: f"BADGE: {full}"\nprint(first, last)\n',
 hint:'full = first + " " + last, then print(full.upper()), print(len(full)), print(f"BADGE: {full}").'},
deck:[
 {id:'strings-c1', front:'What does immutable mean for strings?', back:'The string can never change after creation. Methods like .upper() return a new string; the original is untouched.'},
 {id:'strings-c2', front:'What does the slice  s[2:5]  include?', back:'Characters at positions 2, 3, 4. Start is included, stop is excluded.'},
 {id:'strings-c3', front:'What is an f-string?', back:'f"text {variable}" — a string that fills {braces} with the value of expressions, ideal for building messages.'}]},

/* ── Station 4 ───────────────────────────────────────────── */
{ id:'numbers', station:4, title:'Numbers — Whole & Sliced Apples', advanced:false,
svg:'<svg viewBox="0 0 120 90" role="img" aria-label="Whole and sliced apple emblem"><circle cx="38" cy="48" r="20" fill="var(--py-gold)" stroke="var(--brass)" stroke-width="2"/><rect x="36" y="24" width="4" height="8" fill="var(--brass)"/><path d="M78 30 A20 20 0 0 1 98 66 L 78 48 Z" fill="var(--py-blue)" stroke="var(--brass)" stroke-width="2"/><text x="30" y="53" font-family="monospace" font-size="12" fill="#333">int</text><text x="80" y="58" font-family="monospace" font-size="10" fill="var(--panel)">float</text></svg>',
sections:[
 {id:'analogy', label:'The Analogy', kind:'analogy',
  html:'<p>Python keeps two kinds of numbers on the bench. An <strong>int</strong> is a <strong>whole apple</strong>: 3 apples, -2 apples, exact counts. A <strong>float</strong> is a <strong>sliced apple</strong>: 2.5, 0.1 — quantities with a decimal point, useful for measuring, but slightly approximate at the edges (slicing always leaves a little juice on the knife).</p>',
  voice:'Python keeps two kinds of numbers on the bench. An int is a whole apple: exact counts like three, or minus two. A float is a sliced apple: two point five, useful for measurements, but slightly approximate at the extreme edges — slicing always leaves a little juice on the knife.',
  alt:{html:'<p>Different picture: <strong>cash vs. a weighing scale</strong>. Ints are cash notes — exact, countable, no fractions of a note. Floats are readings off a scale — 2.47 kg — great for measurement, but the last digit wobbles. Use counts for counting, readings for measuring.</p>',
       voice:'Try money instead. Ints are cash notes: exact and countable. Floats are readings from a weighing scale: two point four seven kilos, perfect for measuring, but the last digit can wobble. Count with ints. Measure with floats.'}},
 {id:'definition', label:'The Definition', kind:'definition',
  html:'<p><strong>int:</strong> a whole number of any size. <strong>float:</strong> a number with a decimal point.</p><p>Operators: <code>+ - *</code> as expected; <code>/</code> is <strong>true division and always yields a float</strong> (<code>6 / 2</code> is <code>3.0</code>); <code>//</code> is floor division (chops down); <code>%</code> is the remainder; <code>**</code> is power. Mixing an int with a float yields a float.</p>',
  voice:'Formally: int for whole numbers, float when there is a decimal point. Plus, minus, and star behave as expected. The big surprise: single slash division always yields a float — six divided by two is three point zero. Double slash chops down to a whole result, percent gives the remainder, and double star is power.',
  alt:{html:'<p>The <code>/ vs //</code> rule as sharing: <code>7 / 2</code> = 3.5 (slice the last apple). <code>7 // 2</code> = 3 (whole apples each, keep the rest), and <code>7 % 2</code> = 1 (the leftover). Floor-and-remainder always pair up: <code>7 == 2*3 + 1</code>.</p>',
       voice:'Think of dividing seven apples between two people. True division says three point five each: slice the last apple. Floor division says three whole apples each. And the remainder operator reports the one apple left over. Floor and remainder always pair up perfectly.'}},
 {id:'syntax', label:'The Syntax', kind:'syntax',
  code:'apples = 7\npeople = 2\nprint(apples / people)    # 3.5  (always float)\nprint(apples // people)   # 3    (floor)\nprint(apples % people)    # 1    (remainder)\nprint(2 ** 10)            # 1024 (power)\nprice = 19.99\ntotal = price * 3\nprint(round(total, 2))\nprint(int("42") + 1)      # text -> number',
  html:'<p>Note <code>round(x, 2)</code> for tidy money-style output, and <code>int("42")</code> which converts text to a number — essential later when <code>input()</code> hands you text. <code>float("2.5")</code> works the same way.</p>',
  voice:'Two workhorses to notice. Round with a second argument tidies decimals for money style output. And int of a quoted forty two converts text into a real number — essential later, because keyboard input always arrives as text.',
  alt:{html:'<p>Why does <code>int("42")</code> matter? Because <code>"42" + 1</code> is an error — you can\u2019t couple a train carriage to an apple. Convert first, then do arithmetic. Types must match the operation.</p>',
       voice:'Why does converting matter? Because quoted forty two plus one is an error. You cannot couple a text carriage to an apple. Convert the text to a number first, then do arithmetic.'}},
 {id:'realworld', label:'In the Real World', kind:'realworld',
  html:'<p>Ints count: cart items, likes, retries. Floats measure: prices after tax, GPS coordinates, sensor temperatures. The <code>%</code> remainder runs the world\u2019s "every Nth" logic — every 4th year is a leap year, every 10th customer gets a voucher.</p>',
  voice:'Ints count things: items, likes, retries. Floats measure things: taxed prices, coordinates, temperatures. And the remainder operator quietly runs every Nth logic everywhere: every fourth year is a leap year, every tenth customer wins a voucher.',
  alt:{html:'<p>Odd/even in one stroke: <code>n % 2</code> is 0 for even, 1 for odd. That single trick powers alternating table-row colors on nearly every website you visit.</p>',
       voice:'Here is the classic. N remainder two is zero for even numbers and one for odd. That single trick paints the alternating row colors on nearly every table on the web.'}}],
quiz:[
 {id:'numbers-q1', prompt:'What does  6 / 2  evaluate to in Python?', options:[
   '3, an int, since it divides evenly',
   '3.0, a float — / always gives floats',
   '2.0, rounding toward the divisor',
   'An error unless you write 6.0 / 2'], correct:1,
  explain:'True division (/) always produces a float, even when the division is exact.'},
 {id:'numbers-q2', prompt:'What are  17 // 5  and  17 % 5 ?', options:[
   '3 and 2 — floor, then remainder',
   '3.4 and 0 — division, no leftover',
   '2 and 3 — remainder comes first',
   '4 and 3 — round up, then leftover'], correct:0,
  explain:'17 // 5 chops down to 3; the remainder 17 - 5*3 = 2 comes from %.'},
 {id:'numbers-q3', prompt:'Why is  int("7")  useful?', options:[
   'It rounds 7 to the nearest ten',
   'It checks whether 7 is an integer',
   'It converts text "7" into a number',
   'It formats 7 with quotation marks'], correct:2,
  explain:'Keyboard input arrives as text; int() (or float()) converts it so arithmetic becomes possible.'}],
lab:{type:'pylite',
 starter:'# Chai stand accounting\ncups_sold = 47\nprice = 15.50\n# 1. Compute revenue = cups_sold * price and print it rounded to 2 places.\n# 2. Cups come in trays of 6: print full trays (//) and loose cups (%).\nprint(cups_sold, price)\n',
 hint:'print(round(cups_sold * price, 2)), then print(cups_sold // 6) and print(cups_sold % 6).'},
deck:[
 {id:'numbers-c1', front:'Difference between  /  and  //  ?', back:'/ is true division, always a float (7/2 = 3.5). // floors to a whole result (7//2 = 3).'},
 {id:'numbers-c2', front:'What does  n % 2  tell you?', back:'The remainder after dividing by 2: 0 means n is even, 1 means odd. % is the general "leftover" operator.'}]},

/* ── Station 5 ───────────────────────────────────────────── */
{ id:'booleans', station:5, title:'Booleans & If — The Gate Guard', advanced:false,
svg:'<svg viewBox="0 0 120 90" role="img" aria-label="Gate with guard emblem"><rect x="20" y="26" width="10" height="48" fill="var(--brass)"/><rect x="90" y="26" width="10" height="48" fill="var(--brass)"/><rect x="30" y="30" width="60" height="8" fill="var(--py-blue)"/><path d="M40 74 L60 44 L80 74" fill="none" stroke="var(--py-gold)" stroke-width="3"/><circle cx="60" cy="38" r="7" fill="var(--py-gold)" stroke="var(--brass)" stroke-width="2"/><text x="46" y="86" font-family="monospace" font-size="9" fill="var(--ink)">if / else</text></svg>',
sections:[
 {id:'analogy', label:'The Analogy', kind:'analogy',
  html:'<p>A boolean is the answer a <strong>gate guard</strong> gives: <code>True</code> or <code>False</code>, nothing else. An <code>if</code> statement posts that guard at a fork in your recipe: "<em>if</em> the ticket is valid, take the left path; <em>else</em>, take the right." The chef asks the guard, gets one word back, and walks exactly one path.</p>',
  voice:'A boolean is a gate guard\u2019s answer: true or false, nothing in between. An if statement posts that guard at a fork in your recipe. If the ticket is valid, take the left path; otherwise, the right. The chef asks once, gets one word, and walks exactly one path.',
  alt:{html:'<p>Different picture: a <strong>railway switch</strong>. The condition is the lever; the train (your program) reaches the junction and is steered onto exactly one track. <code>elif</code> adds more junctions in a row; the first lever that\u2019s set wins.</p>',
       voice:'Or picture a railway switch. The condition is the lever. Your program is the train: it reaches the junction and gets steered onto exactly one track. E l i f adds more junctions in sequence, and the first lever that is set wins.'}},
 {id:'definition', label:'The Definition', kind:'definition',
  html:'<p><strong>bool:</strong> a type with exactly two values, <code>True</code> and <code>False</code>.</p><p>Comparisons produce booleans: <code>==</code> equal, <code>!=</code> not equal, <code>&lt; &lt;= &gt; &gt;=</code>. Combine with <code>and</code>, <code>or</code>, <code>not</code>. An <code>if / elif / else</code> chain runs the <strong>first</strong> branch whose condition is True — at most one branch runs. Indentation (4 spaces) marks which lines belong to each branch.</p>',
  voice:'Formally: bool has exactly two values, true and false. Comparisons produce them: double equals for equality, exclamation equals for not equal, and the angle brackets. Combine with and, or, and not. In an if, e l i f, else chain, the first true condition wins and only that branch runs. Indentation shows which lines belong inside.',
  alt:{html:'<p>Watch the classic trap: <code>=</code> pours into a jar; <code>==</code> asks a question. <code>if x = 5</code> is a syntax error; <code>if x == 5</code> asks the guard "is x five?"</p>',
       voice:'One classic trap. A single equals sign pours a value into a jar. Double equals asks a question. If x single equals five is an error. If x double equals five asks the guard: is x five?'}},
 {id:'syntax', label:'The Syntax', kind:'syntax',
  code:'age = 17\nhas_ticket = True\nif age >= 18:\n    print("Enter freely")\nelif age >= 16 and has_ticket:\n    print("Enter with guardian")\nelse:\n    print("Not today")\nprint("Guard checked:", age >= 18)',
  html:'<p>The colon opens a branch; the indented lines are that branch\u2019s body. Here the first condition is False, the second is True, so exactly one line prints. The last line shows a comparison is just a value — you can print it, store it, or hand it to the guard.</p>',
  voice:'Colons open each branch, and the indented lines form its body. Trace it: seventeen is not at least eighteen, so the guard says false and we fall to the next junction. Sixteen or over AND has a ticket: true, so that branch runs. The final line shows a comparison is itself a value you can print or store.',
  alt:{html:'<p>Trace like the chef: read top down, ask each guard in turn, take the <em>first</em> yes, skip everything after. If every guard says no, <code>else</code> is the door that\u2019s always open.</p>',
       voice:'Trace it like the chef. Read top down. Ask each guard in turn. Take the first yes and skip everything after it. If every guard says no, else is the door that is always open.'}},
 {id:'realworld', label:'In the Real World', kind:'realworld',
  html:'<p>Every login screen is an if: <em>if password matches, show inbox, else show error</em>. Discount rules, spam filters, thermostat logic ("if temp &gt; 24, start cooling") — programs make thousands of these guarded decisions per second.</p>',
  voice:'Every login screen is an if statement: if the password matches, show the inbox, otherwise show an error. Discounts, spam filters, thermostats — software makes thousands of these guarded decisions every second.',
  alt:{html:'<p>Your phone\u2019s battery saver: <code>if battery &lt;= 20 and not charging: dim_screen()</code>. You can now read that logic fluently — it\u2019s the same guard-at-the-gate pattern.</p>',
       voice:'Your phone\u2019s battery saver is literally: if battery is at most twenty and not charging, dim the screen. You can now read that fluently. Same guard, same gate.'}}],
quiz:[
 {id:'booleans-q1', prompt:'In an if / elif / else chain, how many branches run?', options:[
   'Every single branch whose test evaluates to True',
   'Always the if and the else both',
   'None, unless you call run() after',
   'Exactly one — the first True (or else)'], correct:3,
  explain:'The chain is a series of junctions: the first True condition claims the train; everything after is skipped.'},
 {id:'booleans-q2', prompt:'What is the difference between  =  and  == ?', options:[
   'They are interchangeable in Python',
   '= compares numbers, == compares text',
   '== is only allowed inside functions',
   '= assigns a value; == tests equality'], correct:3,
  explain:'Single = pours into the jar (assignment); double == asks the guard a yes/no question (comparison).'},
 {id:'booleans-q3', prompt:'What does  not (3 > 5)  evaluate to?', options:[
   'True — the inner test is False, flipped',
   'False — not never changes anything',
   '3, because not picks the smaller one',
   'An error: not needs two operands'], correct:0,
  explain:'3 > 5 is False; not flips it to True. not takes one boolean and inverts it.'}],
lab:{type:'pylite',
 starter:'# Workshop entry gate\ntemperature = 31\nraining = False\n# 1. If temperature > 35, print "Too hot to forge"\n# 2. elif raining, print "Indoor work today"\n# 3. else print "Perfect forging weather"\n# 4. Bonus: add an  and  to combine two conditions somewhere.\nprint(temperature, raining)\n',
 hint:'if temperature > 35: / elif raining: / else: — remember the colons and 4-space indents.'},
deck:[
 {id:'booleans-c1', front:'How many values does bool have, and what are they?', back:'Exactly two: True and False. Every comparison (==, <, >=, ...) produces one.'},
 {id:'booleans-c2', front:'In if/elif/else, which branch runs?', back:'Only the first branch whose condition is True; if none are, the else branch. At most one runs.'},
 {id:'booleans-c3', front:'= versus == ?', back:'= assigns (pours into the jar). == compares and returns True/False (asks the guard).'}]},

/* ── Station 6 ───────────────────────────────────────────── */
{ id:'lists', station:6, title:'Lists — The Shopping List', advanced:false,
svg:'<svg viewBox="0 0 120 90" role="img" aria-label="Numbered list emblem"><rect x="28" y="10" width="64" height="70" rx="6" fill="var(--panel2)" stroke="var(--brass)" stroke-width="2"/><text x="36" y="30" font-family="monospace" font-size="10" fill="var(--py-blue)">0</text><rect x="48" y="22" width="36" height="6" rx="3" fill="var(--ink)" opacity="0.5"/><text x="36" y="48" font-family="monospace" font-size="10" fill="var(--py-blue)">1</text><rect x="48" y="40" width="30" height="6" rx="3" fill="var(--ink)" opacity="0.5"/><text x="36" y="66" font-family="monospace" font-size="10" fill="var(--py-blue)">2</text><rect x="48" y="58" width="34" height="6" rx="3" fill="var(--py-gold)"/></svg>',
sections:[
 {id:'analogy', label:'The Analogy', kind:'analogy',
  html:'<p>A list is a <strong>shopping list on a clipboard</strong>: items in order, numbered from 0, written in pencil. Unlike a sealed string, this clipboard is editable — cross an item out, squeeze a new one in, rewrite line 2. One variable, many values, order preserved.</p>',
  voice:'A list is a shopping list on a clipboard. Items in order, numbered from zero, and written in pencil. Unlike the sealed string thread, this clipboard is editable: cross items out, squeeze new ones in, rewrite any line. One variable, many values, in order.',
  alt:{html:'<p>Different picture: an <strong>egg carton with numbered slots</strong>. Slot 0, slot 1, slot 2\u2026 each holds one value, you can swap any egg, and <code>.append()</code> glues an extra slot on the end. <code>len()</code> counts the slots.</p>',
       voice:'Or picture an egg carton with numbered slots, starting at slot zero. Each slot holds one value, you can swap any egg, and append glues an extra slot onto the end. Len counts the slots.'}},
 {id:'definition', label:'The Definition', kind:'definition',
  html:'<p><strong>List:</strong> a mutable ordered sequence, written with square brackets: <code>[10, 20, 30]</code>.</p><p><strong>Mutable</strong> means changeable in place: <code>nums[1] = 99</code> rewrites slot 1. Key tools: <code>.append(x)</code> add to end, <code>.remove(x)</code> delete first match, <code>len()</code>, indexing and slicing exactly like strings (including negatives).</p>',
  voice:'Formally: a list is a mutable ordered sequence in square brackets. Mutable is the key word — changeable in place. Assigning to slot one rewrites slot one. Append adds to the end, remove deletes the first match, and indexing and slicing work exactly as they did for strings, negatives included.',
  alt:{html:'<p>List vs string in one line: same numbered-slots idea, but a string is <em>laminated</em> and a list is <em>pencil</em>. That\u2019s the entire difference between immutable and mutable.</p>',
       voice:'Here is the whole contrast in one line. Strings and lists share the numbered slots idea. But a string is laminated, and a list is pencil. That is the entire difference between immutable and mutable.'}},
 {id:'syntax', label:'The Syntax', kind:'syntax',
  code:'basket = ["bread", "milk", "eggs"]\nbasket.append("chai")\nbasket[1] = "butter"          # rewrite slot 1\nprint(basket)\nprint(basket[0], basket[-1])\nprint(len(basket))\nbasket.remove("eggs")\nprint("eggs" in basket)\nprint(basket[0:2])',
  html:'<p>Watch the printed list: <code>append</code> grew it, slot 1 was rewritten in place, <code>remove</code> shrank it. <code>in</code> asks the guard whether an item is present. Slicing hands you a copy of part of the clipboard.</p>',
  voice:'Run this and watch the clipboard evolve. Append grows it to four items. Slot one is rewritten from milk to butter, in place. Remove deletes eggs. The in operator asks whether an item is present, and slicing copies part of the list, just like it did for strings.',
  alt:{html:'<p>Note which operations <em>return nothing</em>: <code>append</code> and <code>remove</code> edit the clipboard itself and return <code>None</code>. So never write <code>basket = basket.append("x")</code> — you\u2019d overwrite your list with nothing.</p>',
       voice:'A subtle but important note. Append and remove edit the clipboard itself and hand back nothing. So never write basket equals basket dot append. You would replace your whole list with nothing.'}},
 {id:'realworld', label:'In the Real World', kind:'realworld',
  html:'<p>Your inbox is a list of emails. A playlist is a list of songs. A browser\u2019s back button walks a list of visited pages. Almost every "feed", "queue", or "history" you\u2019ve ever scrolled is a list being appended to at one end.</p>',
  voice:'Your inbox is a list of emails. A playlist is a list of songs. The back button walks a list of visited pages. Nearly every feed, queue, or history you have ever scrolled is a list being appended to at one end.',
  alt:{html:'<p>When a ticketing site says "You are number 3,412 in the queue", you are literally an element in someone\u2019s list, and they printed your index (plus one).</p>',
       voice:'When a ticketing site says you are number three thousand four hundred twelve in the queue, you are literally an element in someone\u2019s list. They printed your index, plus one.'}}],
quiz:[
 {id:'lists-q1', prompt:'What is the key difference between a list and a string?', options:[
   'Lists are mutable; strings are not',
   'Lists cannot be indexed with [ ]',
   'Strings can be longer than lists',
   'Lists may only contain numbers'], correct:0,
  explain:'Both are ordered sequences, but lists can be edited in place (pencil), strings cannot (laminated).'},
 {id:'lists-q2', prompt:'After  a = [1, 2, 3]; a.append(4) , what is a?', options:[
   '[1, 2, 3] — append made a copy',
   '[1, 2, 3, 4] — grown at the end',
   '[4, 1, 2, 3] — grown at the front',
   '[1, 2, 3, [4]] — a nested list'], correct:1,
  explain:'.append(x) adds x as one new element at the end of the same list.'},
 {id:'lists-q3', prompt:'Why is  a = a.append(9)  a mistake?', options:[
   'append only accepts even numbers',
   'You must write a.append(9).save()',
   'append returns None, wiping your list',
   'Lists forbid the number nine'], correct:2,
  explain:'append edits the list in place and returns None; assigning that None replaces your list.'}],
lab:{type:'pylite',
 starter:'# Workshop tool rack\ntools = ["hammer", "chisel", "file"]\n# 1. Append "vise".\n# 2. Replace "chisel" (slot 1) with "gouge".\n# 3. Print the list, its length, and whether "hammer" is in it.\nprint(tools)\n',
 hint:'tools.append("vise"); tools[1] = "gouge"; print(tools, len(tools), "hammer" in tools).'},
deck:[
 {id:'lists-c1', front:'Mutable vs immutable — which is a list?', back:'Lists are mutable (editable in place: pencil). Strings are immutable (laminated).'},
 {id:'lists-c2', front:'What does  .append(x)  return?', back:'None — it edits the list in place. Never assign its result back to your variable.'},
 {id:'lists-c3', front:'How do you test membership in a list?', back:'The  in  operator: "eggs" in basket  → True or False.'}]},

/* ── Station 7 ───────────────────────────────────────────── */
{ id:'dicts', station:7, title:'Dictionaries — The Contacts App', advanced:false,
svg:'<svg viewBox="0 0 120 90" role="img" aria-label="Key and value pairs emblem"><rect x="14" y="18" width="40" height="14" rx="7" fill="var(--py-blue)"/><rect x="64" y="18" width="42" height="14" rx="4" fill="var(--panel2)" stroke="var(--brass)" stroke-width="2"/><rect x="14" y="40" width="40" height="14" rx="7" fill="var(--py-blue)"/><rect x="64" y="40" width="42" height="14" rx="4" fill="var(--panel2)" stroke="var(--brass)" stroke-width="2"/><rect x="14" y="62" width="40" height="14" rx="7" fill="var(--py-gold)"/><rect x="64" y="62" width="42" height="14" rx="4" fill="var(--panel2)" stroke="var(--brass)" stroke-width="2"/><path d="M54 25 L64 25 M54 47 L64 47 M54 69 L64 69" stroke="var(--brass)" stroke-width="2"/></svg>',
sections:[
 {id:'analogy', label:'The Analogy', kind:'analogy',
  html:'<p>A dictionary is your <strong>phone\u2019s contacts app</strong>. You never say "give me contact number 37" — you look up by <strong>name</strong>: "Ana" → 555-1234. Each entry pairs a <strong>key</strong> (the name) with a <strong>value</strong> (the number). Keys must be unique; saving "Ana" again overwrites her old number.</p>',
  voice:'A dictionary is your contacts app. You never ask for contact number thirty seven. You look up by name: Ana gives you her number. Each entry pairs a key with a value. Keys are unique: save Ana again and you overwrite her old number.',
  alt:{html:'<p>Different picture: a <strong>coat check</strong>. You hand over a coat, get ticket "K7"; later you present K7 and receive exactly that coat. Ticket = key, coat = value. Nobody searches the rack in order — the ticket goes straight to the hook.</p>',
       voice:'Or think of a coat check. You hand in a coat and receive ticket K seven. Later you present the ticket and get exactly that coat back. The ticket is the key, the coat is the value, and nobody ever searches the rack in order.'}},
 {id:'definition', label:'The Definition', kind:'definition',
  html:'<p><strong>Dictionary (<code>dict</code>):</strong> a mutable mapping of unique keys to values, written with braces: <code>{"Ana": "555-1234"}</code>.</p><p>Read with <code>d[key]</code> (error if missing) or <code>d.get(key, fallback)</code> (safe). Write with <code>d[key] = value</code> — this adds <em>or</em> overwrites. Loop pairs with <code>.items()</code>; <code>in</code> tests keys.</p>',
  voice:'Formally: a dict maps unique keys to values, written in curly braces. Read with square brackets, which errors if the key is missing, or with dot get, which returns a fallback instead. Writing with square brackets adds a new pair or overwrites an existing one. Dot items loops over the pairs, and in tests the keys.',
  alt:{html:'<p>List vs dict in one line: a list answers "what\u2019s at <em>position</em> 3?"; a dict answers "what\u2019s filed under <em>this name</em>?" Choose by how you\u2019ll look things up.</p>',
       voice:'One line to separate them. A list answers: what is at position three. A dict answers: what is filed under this name. Choose the container by how you plan to look things up.'}},
 {id:'syntax', label:'The Syntax', kind:'syntax',
  code:'contacts = {"Ana": "555-1234", "Bo": "555-9876"}\nprint(contacts["Ana"])\ncontacts["Chi"] = "555-4444"     # add\ncontacts["Bo"] = "555-0000"      # overwrite\nprint(contacts.get("Zed", "not saved"))\nprint("Ana" in contacts)\nfor name, number in contacts.items():\n    print(name + " -> " + number)\nprint(len(contacts))',
  html:'<p>Note <code>.get("Zed", "not saved")</code>: asking for a missing contact politely, with a fallback instead of a crash. The <code>for ... in ... .items()</code> loop hands you each name-number pair in turn (loops get their own station next).</p>',
  voice:'Watch dot get on the missing key: instead of crashing, it hands back your fallback text. And the items loop visits every name and number pair in turn. Loops get their own full station next door, so just read that part for now.',
  alt:{html:'<p>The two read styles are a trust decision: <code>d[k]</code> says "this key <em>must</em> exist — crash loudly if not." <code>d.get(k, fb)</code> says "it might not — here\u2019s plan B." Both are correct; pick per situation.</p>',
       voice:'The two read styles express trust. Square brackets say: this key must exist, crash loudly if it does not. Dot get says: it might not exist, here is plan B. Both are correct. Choose per situation.'}},
 {id:'realworld', label:'In the Real World', kind:'realworld',
  html:'<p>Nearly all structured data travels as dictionaries. A weather API returns <code>{"city": "Mumbai", "temp": 31.2}</code>. User profiles, game save files, and config settings are dicts (often written as JSON, which maps one-to-one onto Python dicts).</p>',
  voice:'Nearly all structured data on the internet travels as dictionaries. A weather service replies with city Mumbai, temp thirty one point two. Profiles, save files, settings — dicts everywhere, usually written down as JSON, which maps directly onto Python.',
  alt:{html:'<p>When an app "syncs your settings", it\u2019s uploading a dict: <code>{"theme": "dark", "font_size": 14}</code>. You can now read the wire format of half the internet.</p>',
       voice:'When an app syncs your settings, it uploads a dict: theme dark, font size fourteen. You can now read the wire format of half the internet.'}}],
quiz:[
 {id:'dicts-q1', prompt:'How do you look up a value in a dict?', options:[
   'By its position: d[0], d[1], d[2]',
   'With d.find(value) on the values',
   'Dicts can only ever be read out in full at once',
   'By its key: d["name"] or d.get("name")'], correct:3,
  explain:'Dicts are keyed, not positional: you present the key (the ticket) and receive its value (the coat).'},
 {id:'dicts-q2', prompt:'What happens on  d["Ana"] = "new"  if "Ana" already exists?', options:[
   'Her old value is overwritten',
   'A second "Ana" entry is added',
   'Python raises a DuplicateKey error',
   'The new value is silently ignored'], correct:0,
  explain:'Keys are unique. Assigning to an existing key replaces its value — like re-saving a contact.'},
 {id:'dicts-q3', prompt:'When is  d.get(k, fallback)  better than  d[k] ?', options:[
   'When you need the lookup to be faster',
   'When the key is a number, not text',
   'When the key might be absent and you want no crash',
   'Never — get() is an older form kept only for compatibility'], correct:2,
  explain:'d[k] raises KeyError on a missing key; .get returns your fallback instead. Choose by whether absence is expected.'}],
lab:{type:'pylite',
 starter:'# Workshop inventory ledger\nstock = {"nails": 120, "planks": 14}\n# 1. Add "varnish" with count 3.\n# 2. Sell 4 planks: subtract from stock["planks"].\n# 3. Print each item with a loop over stock.items().\n# 4. Print stock.get("hinges", 0).\nprint(stock)\n',
 hint:'stock["varnish"] = 3; stock["planks"] = stock["planks"] - 4; then for item, count in stock.items(): print(item, count).'},
deck:[
 {id:'dicts-c1', front:'What are the two halves of a dict entry?', back:'A unique key and its value — the contact name and the phone number. Look up by key, never by position.'},
 {id:'dicts-c2', front:'d[k]  vs  d.get(k, fb)?', back:'d[k] crashes (KeyError) if k is missing. .get returns the fallback fb instead. Choose by whether absence is expected.'},
 {id:'dicts-c3', front:'How do you loop over a dict\u2019s pairs?', back:'for key, value in d.items(): — hands you each pair in turn.'}]},

{ id:'tuples_sets', station:8, title:'Tuples & Sets — Envelope & Marble Bag', advanced:false,
svg:'<svg viewBox="0 0 120 90" role="img" aria-label="Sealed envelope and marble bag emblem"><rect x="10" y="30" width="46" height="32" rx="4" fill="var(--panel2)" stroke="var(--brass)" stroke-width="2"/><path d="M10 32 L33 50 L56 32" fill="none" stroke="var(--brass)" stroke-width="2"/><circle cx="33" cy="46" r="5" fill="var(--py-gold)"/><path d="M70 36 Q66 66 88 70 Q112 66 106 36 Q88 26 70 36 Z" fill="var(--panel2)" stroke="var(--brass)" stroke-width="2"/><circle cx="82" cy="52" r="6" fill="var(--py-blue)"/><circle cx="96" cy="56" r="6" fill="var(--py-gold)"/><circle cx="89" cy="42" r="6" fill="var(--ink)" opacity="0.6"/></svg>',
sections:[
 {id:'analogy', label:'The Analogy', kind:'analogy',
  html:'<p>Two specialist containers. A <strong>tuple</strong> is a <strong>sealed envelope</strong>: items in a fixed order, wax-sealed at creation — you can read through the window but never edit. Perfect for things that belong together and must not change: a GPS point <code>(19.07, 72.87)</code>.</p><p>A <strong>set</strong> is a <strong>bag of unique marbles</strong>: no order, no duplicates. Drop the same marble in twice and the bag still holds one.</p>',
  voice:'Two specialist containers at this bench. A tuple is a sealed envelope: items in fixed order, sealed at creation. Read them, never edit them. Perfect for a G P S point. A set is a bag of unique marbles: no order, and no duplicates. Drop the same marble in twice, and the bag still holds one.',
  alt:{html:'<p>Different pictures: a tuple is a <strong>museum display case</strong> — arranged, labeled, look-don\u2019t-touch. A set is a <strong>guest list</strong> — either your name is on it or it isn\u2019t; writing it twice changes nothing, and nobody cares what order names were added.</p>',
       voice:'Try these instead. A tuple is a museum display case: arranged, labeled, look but do not touch. A set is a guest list: your name is on it or it is not. Writing it twice changes nothing, and the order never mattered.'}},
 {id:'definition', label:'The Definition', kind:'definition',
  html:'<p><strong>Tuple:</strong> an immutable ordered sequence, written with parentheses: <code>(19.07, 72.87)</code>. Index and slice like a list; assignment to a slot is an error.</p><p><strong>Set:</strong> an unordered collection of unique values, written with braces: <code>{1, 2, 3}</code>. No indexing (no order!), instant membership tests with <code>in</code>, duplicates silently collapse.</p>',
  voice:'Formally: a tuple is an immutable ordered sequence in parentheses. You can index and slice it, but assigning to a slot is an error. A set is an unordered collection of unique values in braces. No indexing, because there is no order. Membership tests are instant, and duplicates silently collapse.',
  alt:{html:'<p>Choosing among the four containers: <em>ordered + editable</em> → list. <em>Ordered + sealed</em> → tuple. <em>Lookup by name</em> → dict. <em>Just "have I seen this?"</em> → set.</p>',
       voice:'Here is the full choosing guide. Ordered and editable: list. Ordered and sealed: tuple. Look up by name: dict. Just answering, have I seen this before: set.'}},
 {id:'syntax', label:'The Syntax', kind:'syntax',
  code:'point = (19.07, 72.87)\nprint(point[0])\nlat, lon = point            # unpack the envelope\nprint(lat, lon)\nseen = {"ana", "bo"}\nseen.add("ana")             # duplicate: no effect\nseen.add("chi")\nprint(len(seen))\nprint("bo" in seen)\nvotes = ["y", "n", "y", "y", "n"]\nprint(len(set(votes)))      # distinct answers',
  html:'<p><strong>Unpacking</strong> (<code>lat, lon = point</code>) opens the envelope into named jars — extremely common. And <code>set(votes)</code> is the classic de-duplication move: pour a list into a bag, duplicates vanish, count what remains.</p>',
  voice:'Two power moves here. Unpacking: lat comma lon equals point opens the envelope straight into named jars. And the last line is the classic de duplication trick: pour a list into a set, duplicates vanish, then count what remains. Run it and check the set\u2019s length is three, not four.',
  alt:{html:'<p>Why does <code>seen.add("ana")</code> do nothing the second time? The guest list already has her. That silence is the feature: sets make "only once" logic effortless — no checking needed before adding.</p>',
       voice:'Why did adding ana a second time do nothing? Because the guest list already had her. That silence is the whole feature. Sets make only-once logic effortless: you never need to check before adding.'}},
 {id:'realworld', label:'In the Real World', kind:'realworld',
  html:'<p>Tuples carry things that travel together: an (x, y) screen coordinate, an (r, g, b) color. Sets answer "seen before?": unique visitors to a site, tags on a post, "which words appear in this document?" — all sets under the hood.</p>',
  voice:'Tuples carry values that travel together: a screen coordinate, an R G B color. Sets answer, seen before: unique site visitors, tags on a post, distinct words in a document. All sets under the hood.',
  alt:{html:'<p>"1.2M unique listeners this month" — the word <em>unique</em> is your clue: somewhere, listener IDs were poured into a set and <code>len()</code> was called.</p>',
       voice:'When a dashboard says one point two million unique listeners, the word unique is your clue. Somewhere, I Ds were poured into a set, and len was called on the bag.'}}],
quiz:[
 {id:'tuples_sets-q1', prompt:'What happens on  point = (3, 4); point[0] = 9 ?', options:[
   'point becomes (9, 4) as expected',
   'An error — tuples cannot be edited',
   'A new tuple (9,) is created instead',
   'point[0] is 9 only until printing'], correct:1,
  explain:'Tuples are sealed envelopes: reading is fine, assignment to a slot raises an error.'},
 {id:'tuples_sets-q2', prompt:'What is  len({2, 2, 3, 3, 3}) ?', options:[
   '5 — sets faithfully count every item you added',
   '1 — sets keep only the last item',
   '2 — duplicates collapse to unique values',
   '0 — duplicate entries empty the set'], correct:2,
  explain:'A set holds unique values only: {2, 3} remains, so the length is 2.'},
 {id:'tuples_sets-q3', prompt:'You must record which badge IDs have ever been scanned (no repeats matter). Best container?', options:[
   'A tuple, since scans never change',
   'A string of all IDs joined together',
   'Two lists, one for odd and one even',
   'A set — uniqueness and fast "in" tests'], correct:3,
  explain:'"Have I seen this before?" with no order and no duplicates is exactly the set\u2019s specialty.'}],
lab:{type:'pylite',
 starter:'# Visitor de-duplication\nscans = ["a12", "b07", "a12", "c33", "b07", "a12"]\n# 1. Build unique = set(scans) and print how many distinct visitors came.\n# 2. Check membership: print whether "c33" is in unique.\n# 3. Bonus: store a coordinate home = (19.07, 72.87), unpack it, print both.\nprint(scans)\n',
 hint:'unique = set(scans); print(len(unique)); print("c33" in unique); lat, lon = home; print(lat, lon).'},
deck:[
 {id:'tuples_sets-c1', front:'Tuple vs list?', back:'Both ordered; a tuple is sealed (immutable), a list is pencil (mutable). Use tuples for values that travel together unchanged.'},
 {id:'tuples_sets-c2', front:'Two defining properties of a set?', back:'No duplicates, no order. Perfect for "have I seen this?" and de-duplication via set(my_list).'}]},
