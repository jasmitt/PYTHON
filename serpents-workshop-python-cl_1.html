<script>
/* ============================================================
   THE SERPENT'S WORKSHOP — ui.js
   App shell, chapter rendering, labs, coach dock, deck review,
   weak spots, XP/badges, concept map. Expects engine.js and
   content.js in the same page (top-level declarations).
   ============================================================ */
'use strict';

/* ---------- guarded persistent storage ---------- */
const store = (() => {
  const mem = {};
  let ok = false;
  try {
    window.localStorage.setItem('__sw_probe', '1');
    window.localStorage.removeItem('__sw_probe');
    ok = true;
  } catch (e) { ok = false; }
  return {
    get(key, fallback){
      try {
        const raw = ok ? window.localStorage.getItem('sw1:' + key) : mem[key];
        return raw == null ? fallback : JSON.parse(raw);
      } catch (e) { return fallback; }
    },
    set(key, value){
      try {
        const raw = JSON.stringify(value);
        if (ok) window.localStorage.setItem('sw1:' + key, raw); else mem[key] = raw;
      } catch (e) {}
    },
    persistent: ok
  };
})();

/* ---------- global app state ---------- */
const S = {
  xp: store.get('xp', 0),
  badges: store.get('badges', []),
  chapterDone: store.get('chapterDone', {}),      // id -> true (quiz fully correct)
  narrated: store.get('narrated', {}),            // id -> true (coach tour finished)
  quizStats: store.get('quizStats', {}),          // qid -> {right, wrong}
  deck: store.get('deck', {}),                    // cardId -> sm2 card
  labXp: store.get('labXp', {}),                  // chapterId -> true (labRun XP granted)
  reviews: store.get('reviews', 0),
  altGotIt: store.get('altGotIt', 0),
  coach: coachInit(),
  coachChapter: null,
  quizPick: store.get('quizPick', {})             // chapterId -> rotating dock-quiz index
};
function persist(){
  store.set('xp', S.xp); store.set('badges', S.badges);
  store.set('chapterDone', S.chapterDone); store.set('narrated', S.narrated);
  store.set('quizStats', S.quizStats); store.set('deck', S.deck);
  store.set('labXp', S.labXp); store.set('reviews', S.reviews);
  store.set('altGotIt', S.altGotIt); store.set('quizPick', S.quizPick);
}

/* ---------- tiny DOM helpers ---------- */
function el(tag, attrs, ...kids){
  const node = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)){
    if (k === 'html') node.innerHTML = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) node.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids) if (kid != null) node.append(kid);
  return node;
}
function esc(t){ const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

/* ---------- XP, levels, badges ---------- */
function grantXp(amount, why){
  if (amount <= 0) return;
  S.xp += amount;
  toast(`+${amount} XP — ${why}`, 'xp');
  refreshXpChip();
  checkBadges();
  persist();
}
function refreshXpChip(){
  const chip = document.getElementById('xpChip');
  if (!chip) return;
  const lv = levelFor(S.xp);
  chip.querySelector('.xp-level').textContent = lv.title;
  chip.querySelector('.xp-amount').textContent = S.xp + ' XP';
  chip.querySelector('.xp-fill').style.width = Math.round(lv.progress * 100) + '%';
  chip.title = lv.next ? `${lv.next.xp - S.xp} XP to ${lv.next.title}` : 'Highest rank reached';
}
function hasBadge(id){ return S.badges.includes(id); }
function awardBadge(id){
  if (hasBadge(id)) return;
  const meta = BADGES.find(b => b.id === id);
  if (!meta) return;
  S.badges.push(id);
  toast(`🏅 Badge earned: ${meta.name}`, 'badge');
  renderBadgeShelf();
  persist();
}
function completedCount(){ return Object.keys(S.chapterDone).length; }
function checkBadges(){
  if (Object.keys(S.labXp).length >= 1) awardBadge('first_run');
  if (completedCount() >= 1) awardBadge('first_chapter');
  if (S.chapterDone['loops']) awardBadge('loop_wrangler');
  if (S.chapterDone['errors']) awardBadge('bug_catcher');
  if (S.chapterDone['oop']) awardBadge('object_maker');
  if (S.altGotIt >= 1) awardBadge('alt_thinker');
  if (S.reviews >= 10) awardBadge('deck_10');
  if (completedCount() >= 10) awardBadge('half_floor');
  if (completedCount() >= 19) awardBadge('full_floor');
}
function renderBadgeShelf(){
  const shelf = document.getElementById('badgeShelf');
  if (!shelf) return;
  shelf.innerHTML = '';
  for (const b of BADGES){
    shelf.append(el('div', { class: 'badge' + (hasBadge(b.id) ? ' earned' : ''), title: b.desc },
      el('span', { class: 'badge-icon', text: b.icon }),
      el('span', { class: 'badge-name', text: b.name })));
  }
}

/* ---------- toasts ---------- */
function toast(msg, kind){
  const holder = document.getElementById('toasts');
  if (!holder) return;
  const t = el('div', { class: 'toast ' + (kind || '') , text: msg });
  holder.append(t);
  setTimeout(() => t.classList.add('show'), 20);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 3200);
}

/* ---------- progress ---------- */
function refreshProgress(){
  const bar = document.getElementById('progressFill');
  if (!bar) return;
  bar.style.width = Math.round(completedCount() / CONTENT.chapters.length * 100) + '%';
  const label = document.getElementById('progressLabel');
  if (label) label.textContent = `${completedCount()}/${CONTENT.chapters.length} stations mastered`;
  renderMap();
  renderNav();
}

/* ---------- theme ---------- */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  store.set('theme', theme);
  const btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = theme === 'night' ? '☀ Day shift' : '🌙 Night shift';
}

/* ---------- navigation ---------- */
function renderNav(){
  const nav = document.getElementById('stationNav');
  if (!nav) return;
  const filter = (document.getElementById('searchBox')?.value || '').trim().toLowerCase();
  nav.innerHTML = '';
  for (const ch of CONTENT.chapters){
    const hay = (ch.title + ' ' + ch.sections.map(s => s.html).join(' ')).toLowerCase();
    if (filter && !hay.includes(filter)) continue;
    const done = !!S.chapterDone[ch.id];
    nav.append(el('a', {
      class: 'nav-item' + (done ? ' done' : '') + (ch.advanced ? ' advanced' : ''),
      href: '#station-' + ch.id },
      el('span', { class: 'nav-num', text: String(ch.station).padStart(2, '0') }),
      el('span', { class: 'nav-title', text: ch.title }),
      el('span', { class: 'nav-mark', text: done ? '✓' : '' })));
  }
  if (!nav.children.length) nav.append(el('div', { class: 'nav-empty', text: 'No station matches that search.' }));
}

/* ---------- lab: PyLite runner ---------- */
function renderPyliteLab(ch){
  const ta = el('textarea', { class: 'lab-editor', spellcheck: 'false', 'aria-label': 'Code editor for ' + ch.title });
  ta.value = ch.lab.starter;
  const out = el('pre', { class: 'lab-output', text: '· output appears here ·' });
  const runBtn = el('button', { class: 'btn btn-run', text: '▶ Run', onclick: () => {
    const r = runPython(ta.value, {});
    out.textContent = r.output || '(no output)';
    out.classList.toggle('has-error', /Traceback/.test(r.output));
    if (!/Traceback/.test(r.output) && !S.labXp[ch.id]){
      S.labXp[ch.id] = true;
      grantXp(XP_RULES.labRun, 'lab run at ' + ch.title);
    }
    persist();
  }});
  const resetBtn = el('button', { class: 'btn btn-ghost', text: '↺ Reset', onclick: () => {
    ta.value = ch.lab.starter; out.textContent = '· output appears here ·'; out.classList.remove('has-error');
  }});
  const hintBtn = el('button', { class: 'btn btn-ghost', text: '💡 Hint', onclick: (e) => {
    e.target.closest('.lab').querySelector('.lab-hint').classList.toggle('open');
  }});
  return el('div', { class: 'lab', 'data-lab': ch.id },
    el('div', { class: 'lab-head', text: 'WORKBENCH LAB' }),
    ta,
    el('div', { class: 'lab-buttons' }, runBtn, resetBtn, hintBtn),
    el('div', { class: 'lab-hint', text: ch.lab.hint }),
    out);
}

/* ---------- lab: generator step-visualizer (station 17) ---------- */
function renderGeneratorViz(ch){
  const lines = ch.lab.starter.split('\n');
  const codeBox = el('pre', { class: 'viz-code' });
  lines.forEach((ln, i) => codeBox.append(el('div', { class: 'viz-line', 'data-line': i, text: ln || ' ' })));
  const stateBox = el('div', { class: 'viz-state', html:
    'generator: <b id="gvStatus">not created</b> &nbsp;|&nbsp; batch = <b id="gvBatch">–</b>' });
  const log = el('pre', { class: 'lab-output viz-log', text: '· press create, then pump next() ·' });
  let gen = null; // {batch, n, finished}
  const N = 3;
  function highlight(i){
    codeBox.querySelectorAll('.viz-line').forEach(l => l.classList.remove('hot'));
    if (i >= 0) codeBox.querySelector(`[data-line="${i}"]`)?.classList.add('hot');
  }
  const createBtn = el('button', { class: 'btn btn-run', text: 'g = fresh_loaves(3)', onclick: () => {
    gen = { batch: null, finished: false };
    document.getElementById('gvStatus').textContent = 'created · paused at top (no code has run!)';
    document.getElementById('gvBatch').textContent = '–';
    highlight(0);
    log.textContent = 'generator object created — the body has NOT run.\n';
  }});
  const nextBtn = el('button', { class: 'btn', text: 'next(g) ▸', onclick: () => {
    if (!gen){ log.textContent += 'NameError: create the generator first.\n'; return; }
    if (gen.finished){ log.textContent += 'StopIteration (again) — the bakery stays closed.\n'; return; }
    if (gen.batch === null) gen.batch = 1; else gen.batch += 1;
    if (gen.batch <= N){
      highlight(3); // the yield line
      document.getElementById('gvStatus').textContent = `frozen ON the yield line (call #${gen.batch})`;
      document.getElementById('gvBatch').textContent = String(gen.batch);
      log.textContent += `→ yielded "loaf #${gen.batch}"  · locals frozen: batch=${gen.batch}\n`;
    } else {
      gen.finished = true;
      highlight(2);
      document.getElementById('gvStatus').textContent = 'exhausted';
      log.textContent += `→ while ${gen.batch} <= ${N} is False → StopIteration raised.\n  (this is exactly how a for-loop knows to stop)\n`;
    }
  }});
  const resetBtn = el('button', { class: 'btn btn-ghost', text: '↺ Reset', onclick: () => {
    gen = null; highlight(-1);
    document.getElementById('gvStatus').textContent = 'not created';
    document.getElementById('gvBatch').textContent = '–';
    log.textContent = '· press create, then pump next() ·';
  }});
  return el('div', { class: 'lab viz', 'data-lab': ch.id },
    el('div', { class: 'lab-head', text: 'STEP VISUALIZER — pump the generator by hand' }),
    codeBox, stateBox,
    el('div', { class: 'lab-buttons' }, createBtn, nextBtn, resetBtn,
      el('button', { class: 'btn btn-ghost', text: '💡 Hint', onclick: (e) =>
        e.target.closest('.lab').querySelector('.lab-hint').classList.toggle('open') })),
    el('div', { class: 'lab-hint', text: ch.lab.hint }),
    log);
}

/* ---------- lab: async kitchen animation (station 19) ---------- */
function renderAsyncViz(ch){
  const tasks = [ { name: 'chai', secs: 2 }, { name: 'coffee', secs: 3 }, { name: 'soup', secs: 1 } ];
  const rows = el('div', { class: 'kitchen' });
  const bars = {};
  for (const t of tasks){
    const fill = el('div', { class: 'pot-fill' });
    bars[t.name] = fill;
    rows.append(el('div', { class: 'pot-row' },
      el('span', { class: 'pot-name', text: `${t.name} (${t.secs}s)` }),
      el('div', { class: 'pot-bar' }, fill),
      el('span', { class: 'pot-done', 'data-pot': t.name, text: '' })));
  }
  const clock = el('div', { class: 'viz-state', html: 'mode: <b id="kMode">async</b> · elapsed: <b id="kClock">0.0s</b>' });
  const log = el('pre', { class: 'lab-output viz-log', text: '· press Run and watch one chef work three pots ·' });
  let timer = null, syncMode = false;
  function reset(){
    if (timer) { clearInterval(timer); timer = null; }
    for (const t of tasks){ bars[t.name].style.width = '0%'; rows.querySelector(`[data-pot="${t.name}"]`).textContent = ''; }
    document.getElementById('kClock').textContent = '0.0s';
  }
  function run(){
    reset();
    log.textContent = syncMode
      ? 'SYNC: the chef stares at each pot until it finishes...\n'
      : 'ASYNC: all pots started; the chef hops to whichever is ready.\n';
    for (const t of tasks) log.textContent += `start ${t.name}\n`;
    const t0 = Date.now(), SPEED = 4; // 4x so 3s plays in 0.75s
    timer = setInterval(() => {
      const elapsed = (Date.now() - t0) / 1000 * SPEED;
      document.getElementById('kClock').textContent = elapsed.toFixed(1) + 's';
      let allDone = true;
      let offset = 0;
      for (const t of tasks){
        const start = syncMode ? offset : 0;
        offset += t.secs;
        const frac = Math.max(0, Math.min(1, (elapsed - start) / t.secs));
        bars[t.name].style.width = (frac * 100) + '%';
        const doneMark = rows.querySelector(`[data-pot="${t.name}"]`);
        if (frac >= 1 && !doneMark.textContent){ doneMark.textContent = '✓'; log.textContent += `done  ${t.name}\n`; }
        if (frac < 1) allDone = false;
      }
      if (allDone){
        clearInterval(timer); timer = null;
        const total = syncMode ? tasks.reduce((a, t) => a + t.secs, 0) : Math.max(...tasks.map(t => t.secs));
        log.textContent += `— all pots done in ~${total}s ${syncMode ? '(waits ADDED UP)' : '(the LONGEST wait set the clock)'}\n`;
      }
    }, 50);
  }
  const modeBtn = el('button', { class: 'btn btn-ghost', text: '⇄ Toggle synchronous', onclick: () => {
    syncMode = !syncMode;
    document.getElementById('kMode').textContent = syncMode ? 'synchronous' : 'async';
    reset();
  }});
  return el('div', { class: 'lab viz', 'data-lab': ch.id },
    el('div', { class: 'lab-head', text: 'ANIMATED KITCHEN — async vs synchronous' }),
    clock, rows,
    el('div', { class: 'lab-buttons' },
      el('button', { class: 'btn btn-run', text: '▶ Run kitchen', onclick: run }),
      modeBtn,
      el('button', { class: 'btn btn-ghost', text: '💡 Hint', onclick: (e) =>
        e.target.closest('.lab').querySelector('.lab-hint').classList.toggle('open') })),
    el('div', { class: 'lab-hint', text: ch.lab.hint }),
    log);
}

/* ---------- chapter quiz (main content, 3 questions) ---------- */
function renderChapterQuiz(ch){
  const box = el('div', { class: 'quiz-block', 'data-quiz': ch.id },
    el('h3', { class: 'section-label', text: 'Station Check — 3 questions' }));
  const states = {}; // qid -> correct?
  ch.quiz.forEach((q, qi) => {
    const sh = shuffleQuestion(q, hashCode(q.id) + (S.quizStats[q.id]?.wrong || 0));
    const qEl = el('div', { class: 'quiz-q' },
      el('p', { class: 'quiz-prompt', text: `${qi + 1}. ${q.prompt}` }));
    const opts = el('div', { class: 'quiz-opts', role: 'group', 'aria-label': 'Answer options' });
    sh.options.forEach((optText, oi) => {
      opts.append(el('button', { class: 'quiz-opt', text: optText, onclick: (e) => {
        if (qEl.classList.contains('answered')) return;
        qEl.classList.add('answered');
        const stats = S.quizStats[q.id] || (S.quizStats[q.id] = { right: 0, wrong: 0 });
        const correct = oi === sh.correctIndex;
        states[q.id] = correct;
        e.target.classList.add(correct ? 'right' : 'wrong');
        if (!correct) opts.children[sh.correctIndex].classList.add('right');
        if (correct){ stats.right++; grantXp(XP_RULES.quizCorrect, 'correct answer'); }
        else { stats.wrong++; grantXp(XP_RULES.quizWrongRetry, 'reviewed the explanation'); }
        qEl.append(el('div', { class: 'quiz-explain ' + (correct ? 'ok' : 'no'),
          text: (correct ? '✓ ' : '✗ ') + q.explain }));
        // chapter complete when all three answered correctly (this pass)
        if (Object.keys(states).length === 3 && Object.values(states).every(Boolean) && !S.chapterDone[ch.id]){
          S.chapterDone[ch.id] = true;
          grantXp(XP_RULES.chapterComplete, `station mastered: ${ch.title}`);
          refreshProgress();
        }
        persist();
      }}));
    });
    qEl.append(opts);
    box.append(qEl);
  });
  box.append(el('button', { class: 'btn btn-ghost quiz-retry', text: '↺ Fresh attempt (reshuffles)', onclick: (e) => {
    const fresh = renderChapterQuiz(ch);
    e.target.closest('.quiz-block').replaceWith(fresh);
  }}));
  return box;
}
function hashCode(str){
  let h = 0;
  for (let i = 0; i < str.length; i++){ h = (h * 31 + str.charCodeAt(i)) | 0; }
  return Math.abs(h);
}

/* ---------- chapter rendering ---------- */
function renderChapter(ch){
  const art = el('div', { class: 'station-art', html: ch.svg });
  const head = el('header', { class: 'station-head' },
    el('div', { class: 'station-plate' },
      el('span', { class: 'station-num', text: 'STATION ' + String(ch.station).padStart(2, '0') }),
      ch.advanced ? el('span', { class: 'advanced-flag', text: 'ADVANCED BENCH' }) : null),
    el('h2', { id: 'station-' + ch.id, class: 'station-title', text: ch.title }),
    art,
    el('button', { class: 'btn btn-coach', text: '🔔 Coach me through this station',
      onclick: () => startCoach(ch.id) }));
  const sec = el('div', { class: 'station-body' });
  for (const s of ch.sections){
    const block = el('section', { class: 'section section-' + s.kind, 'data-section': ch.id + ':' + s.id },
      el('h3', { class: 'section-label', text: s.label }),
      el('div', { class: 'section-prose', html: s.html }));
    if (s.id === 'syntax' && s.code){
      block.append(el('pre', { class: 'code-sample' }, el('code', { text: s.code })));
      if (s.codeStatic) block.append(el('p', { class: 'code-note',
        text: 'ℹ This sample uses features beyond the built-in mini-interpreter — see Simulator Notes. The lab below visualizes it instead.' }));
    }
    const altBox = el('div', { class: 'alt-box' },
      el('div', { class: 'alt-tag', text: 'ANOTHER ANGLE' }),
      el('div', { class: 'alt-prose', html: s.alt.html }));
    block.append(el('button', { class: 'btn-alt', text: '↺ Explain differently', onclick: (e) => {
      altBox.classList.toggle('open');
      e.target.textContent = altBox.classList.contains('open') ? '↑ Hide the second angle' : '↺ Explain differently';
    }}), altBox);
    sec.append(block);
  }
  const labEl = ch.lab.type === 'generator_viz' ? renderGeneratorViz(ch)
              : ch.lab.type === 'async_viz' ? renderAsyncViz(ch)
              : renderPyliteLab(ch);
  return el('article', { class: 'station', 'data-chapter': ch.id }, head, sec, labEl, renderChapterQuiz(ch));
}

/* ============================================================
   COACH DOCK — brass workshop intercom
   Non-blocking (fixed bottom, collapsible). Speech is optional:
   every voice line also appears as text, and "Continue" always
   works, so the coach is fully usable silently (and in tests).
   ============================================================ */
const synth = (typeof window !== 'undefined' && 'speechSynthesis' in window) ? window.speechSynthesis : null;
const coachPrefs = { rate: store.get('coachRate', 1), muted: store.get('coachMuted', false), voiceURI: store.get('coachVoice', null) };

function coachChapterObj(){ return CONTENT.chapters.find(c => c.id === S.coachChapter) || null; }
function coachSeg(){
  const ch = coachChapterObj();
  return ch ? ch.sections[S.coach.seg] : null;
}
function dispatchCoach(ev){
  S.coach = coachReduce(S.coach, ev);
  renderCoach();
}
function speak(text, onend){
  if (!synth || coachPrefs.muted){ return; } // silent mode: Continue button advances
  try {
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = coachPrefs.rate;
    if (coachPrefs.voiceURI){
      const v = synth.getVoices().find(v => v.voiceURI === coachPrefs.voiceURI);
      if (v) u.voice = v;
    }
    if (onend) u.onend = onend;
    synth.speak(u);
  } catch (e) {}
}
function stopSpeech(){ if (synth) try { synth.cancel(); } catch (e) {} }

function startCoach(chapterId){
  S.coachChapter = chapterId;
  dispatchCoach({ type: 'PLAY', chapter: chapterId });
  const dock = document.getElementById('coachDock');
  dock.classList.remove('collapsed');
  document.getElementById('station-' + chapterId)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function coachVoiceLine(){
  const seg = coachSeg();
  if (!seg) return '';
  return (S.coach.state === 'altNarrating') ? seg.alt.voice : seg.voice;
}

function renderCoach(){
  const body = document.getElementById('coachBody');
  const stateTag = document.getElementById('coachState');
  if (!body) return;
  body.innerHTML = '';
  const ch = coachChapterObj();
  const c = S.coach;
  stateTag.textContent = c.state === 'idle' ? 'standing by'
    : `${ch ? ch.title : ''} · ${c.state}${c.paused ? ' (paused)' : ''}`;

  if (c.state === 'idle' || !ch){
    body.append(el('p', { class: 'coach-line', text:
      'Pick any station and press “Coach me through this station”. I narrate each section, check in with you after every one, and re-explain from a different angle whenever you ask.' }));
    return;
  }

  const seg = coachSeg();

  if (c.state === 'narrating' || c.state === 'altNarrating'){
    const line = coachVoiceLine();
    body.append(
      el('div', { class: 'coach-seg-tag', text:
        `${seg.label}${c.state === 'altNarrating' ? ' — second angle' : ''} · section ${c.seg + 1}/4` }),
      el('p', { class: 'coach-line', text: line }));
    const doneEv = c.state === 'altNarrating' ? { type: 'ALT_DONE' } : { type: 'SEG_DONE' };
    const controls = el('div', { class: 'coach-controls' });
    controls.append(el('button', { class: 'btn btn-run', 'data-coach': 'continue', text: 'Continue ▸',
      onclick: () => { stopSpeech(); dispatchCoach(doneEv); } }));
    if (!c.paused) controls.append(el('button', { class: 'btn btn-ghost', 'data-coach': 'pause', text: '⏸ Pause',
      onclick: () => { if (synth) try { synth.pause(); } catch(e){}; dispatchCoach({ type: 'PAUSE' }); } }));
    else controls.append(el('button', { class: 'btn btn-ghost', 'data-coach': 'resume', text: '▶ Resume',
      onclick: () => { if (synth) try { synth.resume(); } catch(e){}; dispatchCoach({ type: 'RESUME' }); } }));
    controls.append(el('button', { class: 'btn btn-ghost', 'data-coach': 'repeat', text: '↻ Repeat',
      onclick: () => { stopSpeech(); dispatchCoach({ type: 'REPEAT' }); } }));
    controls.append(el('button', { class: 'btn btn-ghost', 'data-coach': 'stop', text: '■ Stop',
      onclick: () => { stopSpeech(); S.coachChapter = null; dispatchCoach({ type: 'STOP' }); } }));
    body.append(controls);
    if (!c.paused) speak(line, () => { if (S.coach.state === c.state) dispatchCoach(doneEv); });
  }

  else if (c.state === 'checkpoint'){
    stopSpeech();
    body.append(
      el('div', { class: 'coach-seg-tag', text: `${seg.label} · comprehension check` }),
      el('p', { class: 'coach-line', text: `Did “${seg.label}” make sense before we move on?` }),
      el('div', { class: 'coach-controls' },
        el('button', { class: 'btn btn-run', 'data-coach': 'gotit', text: '✓ Got it', onclick: () => {
          grantXp(XP_RULES.checkpointPass, 'checkpoint passed');
          if (S.coach.usedAlt){ S.altGotIt++; grantXp(XP_RULES.altUsedBonus, 'second angle paid off'); checkBadges(); }
          dispatchCoach({ type: 'GOT_IT', hasMoreSegs: S.coach.seg < 3 });
        }}),
        el('button', { class: 'btn btn-ghost', 'data-coach': 'confused', text: '↺ Explain differently',
          disabled: S.coach.usedAlt,
          title: S.coach.usedAlt ? 'Already re-explained — read the section text, then continue.' : '',
          onclick: () => dispatchCoach({ type: 'CONFUSED' }) }),
        el('button', { class: 'btn btn-ghost', 'data-coach': 'stop', text: '■ Stop',
          onclick: () => { S.coachChapter = null; dispatchCoach({ type: 'STOP' }); } })));
  }

  else if (c.state === 'quiz'){
    const pick = (S.quizPick[ch.id] || 0) % ch.quiz.length;
    const q = ch.quiz[pick];
    const sh = shuffleQuestion(q, hashCode(q.id) + pick * 7);
    body.append(
      el('div', { class: 'coach-seg-tag', text: 'station tour · exit question' }),
      el('p', { class: 'coach-line', text: q.prompt }));
    const opts = el('div', { class: 'coach-quiz-opts' });
    sh.options.forEach((optText, oi) => {
      opts.append(el('button', { class: 'quiz-opt', text: optText, onclick: () => {
        const correct = oi === sh.correctIndex;
        S.quizPick[ch.id] = pick + 1;
        const stats = S.quizStats[q.id] || (S.quizStats[q.id] = { right: 0, wrong: 0 });
        if (correct){ stats.right++; grantXp(XP_RULES.quizCorrect, 'exit question'); }
        else { stats.wrong++; grantXp(XP_RULES.quizWrongRetry, 'reviewed the explanation'); }
        S.lastCoachExplain = (correct ? '✓ ' : '✗ ') + q.explain;
        persist();
        dispatchCoach({ type: 'ANSWER', correct });
      }}));
    });
    body.append(opts);
  }

  else if (c.state === 'result'){
    body.append(
      el('p', { class: 'coach-line ' + (c.lastAnswerCorrect ? 'ok' : 'no'), text: S.lastCoachExplain || '' }),
      el('div', { class: 'coach-controls' },
        el('button', { class: 'btn btn-run', 'data-coach': 'finish', text: 'Finish tour ✓', onclick: () => {
          S.narrated[ch.id] = true;
          persist();
          toast(`Tour complete: ${ch.title}. Try the lab and the Station Check!`, '');
          S.coachChapter = null;
          dispatchCoach({ type: 'NEXT', hasMoreSegs: false });
        }})));
  }
}

/* ---------- coach dock chrome ---------- */
function buildCoachDock(){
  const dock = el('div', { id: 'coachDock', class: 'coach-dock collapsed', role: 'complementary', 'aria-label': 'Voiceover coach' },
    el('div', { class: 'coach-bar' },
      el('button', { id: 'coachToggle', class: 'coach-toggle', 'aria-label': 'Expand or collapse the coach',
        onclick: () => document.getElementById('coachDock').classList.toggle('collapsed') },
        el('span', { class: 'coach-lamp' }), 'MASTER\u2019S INTERCOM'),
      el('span', { id: 'coachState', class: 'coach-state', text: 'standing by' }),
      el('span', { class: 'coach-spacer' }),
      el('label', { class: 'coach-pref', text: 'speed ' },
        el('input', { type: 'range', min: '0.6', max: '1.6', step: '0.1', value: String(coachPrefs.rate),
          'aria-label': 'Narration speed',
          oninput: (e) => { coachPrefs.rate = parseFloat(e.target.value); store.set('coachRate', coachPrefs.rate); } })),
      el('select', { id: 'voiceSelect', class: 'coach-pref', 'aria-label': 'Narration voice',
        onchange: (e) => { coachPrefs.voiceURI = e.target.value || null; store.set('coachVoice', coachPrefs.voiceURI); } }),
      el('button', { id: 'muteBtn', class: 'btn btn-ghost coach-pref', text: coachPrefs.muted ? '🔇 Voice off' : '🔊 Voice on',
        onclick: (e) => {
          coachPrefs.muted = !coachPrefs.muted; store.set('coachMuted', coachPrefs.muted);
          e.target.textContent = coachPrefs.muted ? '🔇 Voice off' : '🔊 Voice on';
          if (coachPrefs.muted) stopSpeech();
        }})),
    el('div', { id: 'coachBody', class: 'coach-body' }));
  document.body.append(dock);
  populateVoices();
  if (synth && typeof synth.addEventListener === 'function') synth.addEventListener('voiceschanged', populateVoices);
  renderCoach();
}
function populateVoices(){
  const sel = document.getElementById('voiceSelect');
  if (!sel) return;
  sel.innerHTML = '';
  sel.append(el('option', { value: '', text: synth ? 'default voice' : 'no speech on this device' }));
  if (!synth) { sel.disabled = true; return; }
  try {
    for (const v of synth.getVoices()){
      const o = el('option', { value: v.voiceURI, text: v.name });
      if (v.voiceURI === coachPrefs.voiceURI) o.selected = true;
      sel.append(o);
    }
  } catch (e) {}
}

/* ============================================================
   RECALL DECK (SM-2), WEAK SPOTS, CONCEPT MAP, SCRATCH BENCH
   ============================================================ */
function allCards(){
  return CONTENT.chapters.flatMap(ch => ch.deck.map(card => ({ ...card, chapter: ch.id, chTitle: ch.title })));
}
function dueCards(now){
  const t = now ?? Date.now();
  return allCards().filter(card => {
    const st = S.deck[card.id];
    return !st || st.due <= t;
  });
}
function renderDeck(){
  const host = document.getElementById('deckHost');
  if (!host) return;
  host.innerHTML = '';
  const due = dueCards();
  host.append(el('p', { class: 'deck-meta', text:
    `${allCards().length} cards in the drawer · ${due.length} due now · reviews so far: ${S.reviews}` }));
  if (!due.length){
    host.append(el('p', { class: 'deck-done', text: '🗃 Drawer clear — spaced repetition will surface cards when they are due.' }));
    return;
  }
  const card = due[0];
  const face = el('div', { class: 'deck-card' },
    el('div', { class: 'deck-ch', text: card.chTitle }),
    el('div', { class: 'deck-front', text: card.front }),
    el('div', { class: 'deck-back', text: card.back }));
  const reveal = el('button', { class: 'btn btn-run', text: 'Reveal ▾', onclick: () => {
    face.classList.add('revealed'); reveal.remove(); grades.classList.add('open');
  }});
  const grades = el('div', { class: 'deck-grades' });
  [[1, 'Again', 'no'], [3, 'Hard', 'mid'], [4, 'Good', 'ok'], [5, 'Easy', 'ok']].forEach(([q, label, cls]) => {
    grades.append(el('button', { class: 'btn deck-grade ' + cls, text: label, onclick: () => {
      const prev = S.deck[card.id] || sm2Init(card.id);
      S.deck[card.id] = sm2Review(prev, q, Date.now());
      S.reviews++;
      grantXp(XP_RULES.reviewCard, 'card reviewed');
      checkBadges();
      persist();
      renderDeck();
    }}));
  });
  host.append(face, reveal, grades);
}

/* ---------- weak spots ---------- */
function weakQuestions(){
  const out = [];
  for (const ch of CONTENT.chapters)
    for (const q of ch.quiz){
      const st = S.quizStats[q.id];
      if (st && st.wrong > 0 && st.wrong >= st.right) out.push({ q, ch });
    }
  return out;
}
function weakCards(){
  return allCards().filter(card => { const st = S.deck[card.id]; return st && st.ef < 2.0; });
}
function renderWeakSpots(){
  const host = document.getElementById('weakHost');
  if (!host) return;
  host.innerHTML = '';
  const wq = weakQuestions(), wc = weakCards();
  if (!wq.length && !wc.length){
    host.append(el('p', { class: 'deck-done', text: '🧭 No weak spots on record. Miss a question or struggle with a card, and it lands here for focused review.' }));
    return;
  }
  if (wq.length){
    host.append(el('h3', { class: 'section-label', text: `Questions to retake (${wq.length})` }));
    for (const { q, ch } of wq){
      const row = el('div', { class: 'weak-row' },
        el('span', { class: 'weak-ch', text: ch.title }),
        el('span', { class: 'weak-q', text: q.prompt }),
        el('a', { class: 'btn btn-ghost', href: '#station-' + ch.id, text: 'Go to station →' }));
      host.append(row);
    }
  }
  if (wc.length){
    host.append(el('h3', { class: 'section-label', text: `Struggling cards (${wc.length})` }));
    for (const card of wc)
      host.append(el('div', { class: 'weak-row' },
        el('span', { class: 'weak-ch', text: card.chTitle }),
        el('span', { class: 'weak-q', text: card.front })));
  }
}

/* ---------- concept map: the shop floor plan ---------- */
function renderMap(){
  const host = document.getElementById('mapHost');
  if (!host) return;
  const W = 1360, H = 400, ns = 'http://www.w3.org/2000/svg';
  host.innerHTML = '';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Concept map of all nineteen stations and their prerequisites');
  const pos = {};
  for (const n of CONTENT.conceptMap.nodes) pos[n.id] = n;
  for (const [a, b] of CONTENT.conceptMap.edges){
    const ln = document.createElementNS(ns, 'line');
    ln.setAttribute('x1', pos[a].x); ln.setAttribute('y1', pos[a].y);
    ln.setAttribute('x2', pos[b].x); ln.setAttribute('y2', pos[b].y);
    ln.setAttribute('class', 'map-edge');
    svg.append(ln);
  }
  for (const n of CONTENT.conceptMap.nodes){
    const ch = CONTENT.chapters.find(c => c.id === n.id);
    const g = document.createElementNS(ns, 'g');
    g.setAttribute('class', 'map-node'
      + (S.chapterDone[n.id] ? ' mastered' : S.narrated[n.id] || S.labXp[n.id] ? ' started' : '')
      + (ch.advanced ? ' advanced' : ''));
    g.setAttribute('tabindex', '0');
    g.setAttribute('role', 'link');
    g.setAttribute('aria-label', `Go to station ${ch.station}: ${ch.title}`);
    const open = () => { window.location.hash = 'station-' + n.id; };
    g.addEventListener('click', open);
    g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') open(); });
    const rect = document.createElementNS(ns, 'rect');
    rect.setAttribute('x', n.x - 52); rect.setAttribute('y', n.y - 20);
    rect.setAttribute('width', 104); rect.setAttribute('height', 40);
    rect.setAttribute('rx', 9);
    const num = document.createElementNS(ns, 'text');
    num.setAttribute('x', n.x); num.setAttribute('y', n.y - 5);
    num.setAttribute('class', 'map-num'); num.textContent = String(ch.station).padStart(2, '0');
    const label = document.createElementNS(ns, 'text');
    label.setAttribute('x', n.x); label.setAttribute('y', n.y + 12);
    label.setAttribute('class', 'map-label'); label.textContent = n.label;
    g.append(rect, num, label);
    svg.append(g);
  }
  host.append(svg);
}

/* ---------- scratch bench REPL ---------- */
function buildRepl(){
  const host = document.getElementById('replHost');
  if (!host) return;
  let history = [];
  const out = el('pre', { class: 'lab-output repl-out', text: '>>> the Scratch Bench remembers your lines (it re-runs them each time — see Simulator Notes)' });
  const input = el('input', { class: 'repl-in', type: 'text', 'aria-label': 'Python line to run', placeholder: '>>> try 2 ** 10, or name = "Ada"' });
  function runLine(){
    const line = input.value;
    if (!line.trim()) return;
    history.push(line);
    const r = runPython(history.join('\n'), { repl: true });
    out.textContent = '>>> ' + history.join('\n>>> ') + '\n' + (r.output || '');
    if (/Traceback/.test(r.output)) history.pop(); // bad line doesn't poison the session
    input.value = '';
    out.scrollTop = out.scrollHeight;
  }
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') runLine(); });
  host.append(out, el('div', { class: 'repl-row' }, input,
    el('button', { class: 'btn btn-run', text: 'Run ⏎', onclick: runLine }),
    el('button', { class: 'btn btn-ghost', text: '↺ Clear bench', onclick: () => {
      history = []; out.textContent = '>>> bench cleared'; } })));
}

/* ---------- simulator notes ---------- */
function buildSubsetNotes(){
  const host = document.getElementById('subsetHost');
  if (!host) return;
  host.append(
    el('p', { class: 'section-prose', html: 'Labs run on <strong>PyLite</strong>, a mini Python interpreter built into this file so everything works offline. It follows real Python semantics for everything it supports (validated line-for-line against CPython), but it is honestly a subset:' }),
    el('div', { class: 'subset-cols' },
      el('div', null, el('h3', { class: 'section-label', text: 'Supported' }),
        el('ul', { class: 'subset-list ok' }, ...SUBSET_NOTES.supported.map(x => el('li', { text: x })))),
      el('div', null, el('h3', { class: 'section-label', text: 'Not supported (use real Python)' }),
        el('ul', { class: 'subset-list no' }, ...SUBSET_NOTES.notSupported.map(x => el('li', { text: x }))))),
    el('p', { class: 'section-prose', html: 'Stations 17 and 19 (generators, async) therefore teach with <strong>visualizers</strong> rather than live execution — the concepts are real; the animation stands in for the runtime. The Scratch Bench “remembers” lines by re-running the whole session each time, so slow lines get slower as the session grows.' }));
}

   BOOT
   ============================================================ */

  const root = document.getElementById('app');
  applyTheme(store.get('theme', 'day'));

  // top bar
  root.append(
    el('div', { id: 'progressBar' }, el('div', { id: 'progressFill' })),

      el('div', { class: 'brand' },
        el('span', { class: 'brand-serpent', 'aria-hidden': 'true', text: '🐍' }),
        el('h1', { class: 'brand-title', text: 'The Serpent\u2019s Workshop' }),
        el('span', { class: 'brand-sub', text: 'Python, from first line to advanced bench' })),
      el('div', { class: 'topbar-tools' },
        el('input', { id: 'searchBox', type: 'search', placeholder: 'Search stations…', 'aria-label': 'Search stations',
          oninput: () => renderNav() }),
        el('button', { id: 'themeBtn', class: 'btn btn-ghost', onclick: () => {
          applyTheme(document.documentElement.getAttribute('data-theme') === 'night' ? 'day' : 'night');
        }}),
        el('div', { id: 'xpChip', class: 'xp-chip', title: '' },
          el('span', { class: 'xp-level' }), el('span', { class: 'xp-amount' }),
          el('div', { class: 'xp-track' }, el('div', { class: 'xp-fill' }))))),
    el('p', { id: 'progressLabel', class: 'progress-label' }));

  // orientation
  root.append(el('section', { class: 'panel intro-panel' },
    el('h2', { class: 'panel-title', text: 'Welcome to the shop floor' }),
    el('div', { class: 'section-prose', html:
      '<p>Nineteen workbench stations take you from your very first line of Python to generators, decorators, and async. Each station has an analogy, a plain definition, runnable code, a real-world tie-in, a hands-on lab, and a three-question check.</p><p>The <strong>Master\u2019s Intercom</strong> at the bottom of the screen narrates any station aloud, checks in after every section, and — if something didn\u2019t land — re-explains it with a completely different analogy. It never blocks the page: read ahead freely while it talks.</p>' })));

  // concept map
  root.append(el('section', { class: 'panel' },
    el('h2', { class: 'panel-title', text: 'Shop floor plan — the concept map' }),
    el('p', { class: 'section-prose', text: 'Every station, and which benches feed which. Click any plate to jump there. Gold = mastered, blue = started.' }),
    el('div', { id: 'mapHost', class: 'map-host' })));

  // stations
  const nav = el('nav', { id: 'stationNav', class: 'station-nav', 'aria-label': 'Stations' });
  root.append(el('div', { class: 'floor' }, nav,
    el('div', { class: 'stations' }, ...CONTENT.chapters.map(renderChapter))));

  // deck / weak spots / badges / repl / notes
  root.append(
    el('section', { class: 'panel', id: 'deckPanel' },
      el('h2', { class: 'panel-title', text: 'Recall drawer — spaced repetition' }),
      el('div', { id: 'deckHost' })),
    el('section', { class: 'panel', id: 'weakPanel' },
      el('h2', { class: 'panel-title', text: 'Weak spots — focused review' }),
      el('div', { id: 'weakHost' })),
    el('section', { class: 'panel' },
      el('h2', { class: 'panel-title', text: 'Guild honors' }),
      el('div', { id: 'badgeShelf', class: 'badge-shelf' })),
    el('section', { class: 'panel' },
      el('h2', { class: 'panel-title', text: 'Scratch bench — free REPL' }),
      el('div', { id: 'replHost' })),
    el('section', { class: 'panel' },
      el('h2', { class: 'panel-title', text: 'Simulator notes — what PyLite honestly covers' }),
      el('div', { id: 'subsetHost' })),
    el('div', { id: 'toasts', 'aria-live': 'polite' }));

  buildCoachDock();
  buildRepl();
  buildSubsetNotes();
  renderNav();
  renderDeck();
  renderWeakSpots();
  renderBadgeShelf();
  refreshXpChip();
  refreshProgress();

  // re-render weak spots when quiz stats change (piggyback on persist via observer-lite)
  document.addEventListener('click', (e) => {
    if (e.target.classList && e.target.classList.contains('quiz-opt')) setTimeout(renderWeakSpots, 50);
  });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', buildApp);
else buildApp();
