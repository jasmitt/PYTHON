{ id:'loops', station:9, title:'Loops — The Assembly Line', advanced:false,
svg:'<svg viewBox="0 0 120 90" role="img" aria-label="Assembly line loop emblem"><rect x="12" y="56" width="96" height="8" rx="4" fill="var(--brass)"/><circle cx="24" cy="70" r="6" fill="var(--ink)" opacity="0.5"/><circle cx="60" cy="70" r="6" fill="var(--ink)" opacity="0.5"/><circle cx="96" cy="70" r="6" fill="var(--ink)" opacity="0.5"/><rect x="24" y="40" width="14" height="14" rx="3" fill="var(--py-blue)"/><rect x="53" y="40" width="14" height="14" rx="3" fill="var(--py-gold)"/><rect x="82" y="40" width="14" height="14" rx="3" fill="var(--py-blue)"/><path d="M100 30 Q60 8 20 30" fill="none" stroke="var(--py-gold)" stroke-width="2" stroke-dasharray="4 3"/><path d="M24 26 L20 30 L26 33" fill="none" stroke="var(--py-gold)" stroke-width="2"/></svg>',
sections:[
 {id:'analogy', label:'The Analogy', kind:'analogy',
  html:'<p>A loop is an <strong>assembly line</strong>. The same work-station (your indented block) processes each item that rolls past. A <code>for</code> loop is a line with a <em>known batch</em>: "for each mug on this tray, glaze it." A <code>while</code> loop is a line with a <em>stopping condition</em>: "keep polishing while the surface is rough."</p>',
  voice:'A loop is an assembly line. One work station — your indented block — processes each item that rolls past. A for loop runs a known batch: for each mug on the tray, glaze it. A while loop runs on a condition: keep polishing while the surface is rough.',
  alt:{html:'<p>Different picture: <strong>laps on a running track</strong>. <code>for i in range(5)</code> is "run exactly 5 laps, and the lap counter <code>i</code> shows 0,1,2,3,4." A <code>while</code> loop is "keep lapping until the coach\u2019s whistle" — powerful, but if the whistle never blows, you run forever.</p>',
       voice:'Or think of laps on a track. For i in range five means run exactly five laps, with the counter showing zero through four. While is: keep lapping until the whistle. Powerful — but if the whistle never blows, you run forever.'}},
 {id:'definition', label:'The Definition', kind:'definition',
  html:'<p><strong>for x in sequence:</strong> runs the body once per item, with <code>x</code> holding the current item. <code>range(5)</code> generates 0–4; <code>range(2, 8)</code> generates 2–7.</p><p><strong>while condition:</strong> re-checks the condition before every pass; runs while True. <strong>break</strong> exits the loop immediately; <strong>continue</strong> skips to the next item. Something in a while body must move toward False, or the loop is infinite.</p>',
  voice:'Formally. For x in a sequence runs the body once per item, with x holding the current one. Range five counts zero through four. While re checks its condition before every pass and runs as long as it is true. Break exits immediately. Continue skips to the next item. And something inside a while body must push the condition toward false, or it never ends.',
  alt:{html:'<p>Choosing: know <em>what</em> you\u2019re processing (a list, a string, a range)? Use <code>for</code>. Know only <em>when to stop</em> ("until guess is correct")? Use <code>while</code>. In practice, <code>for</code> covers ~90% of loops.</p>',
       voice:'Choosing between them is simple. If you know what you are processing — a list, a string, a range — use for. If you only know when to stop, use while. In practice, for covers about ninety percent of real loops.'}},
 {id:'syntax', label:'The Syntax', kind:'syntax',
  code:'for mug in ["red", "blue", "green"]:\n    print("Glazing the " + mug + " mug")\ntotal = 0\nfor n in range(1, 6):\n    total = total + n\nprint("Sum 1..5:", total)\ncountdown = 3\nwhile countdown > 0:\n    print(countdown)\n    countdown = countdown - 1\nprint("Lift off!")\nfor n in range(10):\n    if n == 4:\n        break\n    print(n)',
  html:'<p>Four mini-programs: a batch over a list, a running total with <code>range</code>, a <code>while</code> countdown (note the line that moves it toward 0), and a <code>break</code> that stops early at 4. Trace each before running — predict the output, then check.</p>',
  voice:'Four small machines here. A batch over a list. A running total using range. A while countdown — find the line that pushes it toward zero, that line is what prevents an infinite loop. And a break that abandons the line early at four. Predict all the output first, then run and compare.',
  alt:{html:'<p>The running-total pattern deserves a name: start an <strong>accumulator</strong> at 0 before the loop, add to it inside, use it after. Sum, count, longest-so-far, total price — all the same shape. You\u2019ll write it hundreds of times.</p>',
       voice:'One pattern here deserves its own name: the accumulator. Start a total at zero before the loop, add to it inside the loop, use it after. Sums, counts, longest so far, cart totals — all the same shape. You will write it hundreds of times.'}},
 {id:'realworld', label:'In the Real World', kind:'realworld',
  html:'<p>Loops are why computers beat humans at drudgery: "for each of 80,000 rows, check the total"; "for each photo, make a thumbnail"; "while the server runs, wait for the next request." Every game runs one giant while loop, sixty times a second.</p>',
  voice:'Loops are why computers beat humans at drudgery. For each of eighty thousand rows, check the total. For each photo, make a thumbnail. While the server is up, wait for the next request. Every video game is one giant while loop, running sixty times a second.',
  alt:{html:'<p>"Batch rename 500 files" is a for loop with your naming rule as the body. What takes an intern an afternoon takes the loop 40 milliseconds — same station, different scale.</p>',
       voice:'Batch renaming five hundred files is a for loop with your naming rule as its body. What takes an intern an afternoon takes the loop forty milliseconds. Same station. Different scale.'}}],
quiz:[
 {id:'loops-q1', prompt:'What does  for i in range(3):  print with  print(i)  inside?', options:[
   '0, 1, 2 — three passes from zero',
   '1, 2, 3 — three passes from one',
   '0, 1, 2, 3 — four passes total',
   '3, 3, 3 — the same value thrice'], correct:0,
  explain:'range(3) generates 0, 1, 2: three values, starting at zero, stopping before 3.'},
 {id:'loops-q2', prompt:'A while loop\u2019s body never changes its condition. What happens?', options:[
   'Python auto-stops it after 1000 passes',
   'It loops forever — an infinite loop',
   'It runs exactly once, then exits',
   'It skips the body and moves along'], correct:1,
  explain:'while re-checks before each pass; if nothing pushes the condition toward False, it never ends.'},
 {id:'loops-q3', prompt:'Inside a loop,  break  and  continue  do what?', options:[
   'break pauses the loop mid-pass; continue resumes it afterwards',
   'break restarts the loop; continue ends it',
   'break exits the loop; continue skips to the next item',
   'Both stop the loop, at different speeds'], correct:2,
  explain:'break abandons the whole loop immediately; continue abandons only the current pass.'}],
lab:{type:'pylite',
 starter:'# Quality control line\nweights = [102, 98, 251, 100, 97, 340, 99]\n# Grams. Anything over 200 is a defect.\n# 1. Loop over weights; print "DEFECT" for heavy ones, "ok" otherwise.\n# 2. Count defects with an accumulator and print the count after the loop.\n# 3. Bonus: use continue to skip printing "ok" lines entirely.\nprint(weights)\n',
 hint:'defects = 0 before the loop; inside: if w > 200: print("DEFECT", w); defects = defects + 1.'},
deck:[
 {id:'loops-c1', front:'for vs while — how to choose?', back:'for: you know WHAT to process (a sequence). while: you only know WHEN to stop (a condition).'},
 {id:'loops-c2', front:'What is the accumulator pattern?', back:'Initialize before the loop (total = 0), update inside (total += n), use after. The shape of sums, counts, and running bests.'},
 {id:'loops-c3', front:'break vs continue?', back:'break exits the entire loop now. continue skips the rest of THIS pass and moves to the next item.'}]},

/* ── Station 10 ──────────────────────────────────────────── */
{ id:'functions', station:10, title:'Functions — The Vending Machine', advanced:false,
svg:'<svg viewBox="0 0 120 90" role="img" aria-label="Vending machine emblem"><rect x="34" y="10" width="52" height="70" rx="6" fill="var(--panel2)" stroke="var(--brass)" stroke-width="2"/><rect x="42" y="18" width="36" height="26" rx="3" fill="var(--py-blue)" opacity="0.7"/><rect x="42" y="50" width="16" height="8" rx="2" fill="var(--py-gold)"/><rect x="42" y="64" width="36" height="10" rx="3" fill="var(--ink)" opacity="0.4"/><path d="M20 30 L34 30" stroke="var(--py-gold)" stroke-width="3"/><path d="M30 26 L34 30 L30 34" fill="none" stroke="var(--py-gold)" stroke-width="2"/><path d="M86 70 L102 70" stroke="var(--py-blue)" stroke-width="3"/><path d="M98 66 L102 70 L98 74" fill="none" stroke="var(--py-blue)" stroke-width="2"/></svg>',
sections:[
 {id:'analogy', label:'The Analogy', kind:'analogy',
  html:'<p>A function is a <strong>vending machine you build yourself</strong>. You design it once: what goes in the coin slot (<strong>parameters</strong>), what happens inside (the body), and what drops into the tray (<strong>return value</strong>). After that, anyone — including future-you — just inserts inputs and collects the output, without knowing the machinery.</p>',
  voice:'A function is a vending machine that you build yourself. Design it once: what goes in the coin slot — the parameters. What happens inside — the body. And what drops into the tray — the return value. From then on, anyone just inserts inputs and collects the output, without ever seeing the machinery.',
  alt:{html:'<p>Different picture: a <strong>kitchen appliance</strong>. A blender doesn\u2019t care whose fruit goes in; it applies the same process and hands back a smoothie. <code>def</code> builds the appliance; calling it presses the button. Build once, press often.</p>',
       voice:'Or think of a kitchen appliance. A blender does not care whose fruit goes in. Same process, smoothie out. Def builds the appliance. Calling it presses the button. Build once. Press often.'}},
 {id:'definition', label:'The Definition', kind:'definition',
  html:'<p><strong>def name(parameters):</strong> defines a function; the indented body runs only when <em>called</em>: <code>name(arguments)</code>.</p><p><strong>Parameter:</strong> the slot\u2019s label. <strong>Argument:</strong> the actual coin you insert. <strong>return</strong> sends a value back and ends the call; a function with no return hands back <code>None</code>. Defaults (<code>def greet(name="friend")</code>) make a slot optional.</p>',
  voice:'Formally. Def, a name, parameters in parentheses, a colon, and an indented body that runs only when the function is called. Parameters are the slot labels; arguments are the actual coins you insert. Return sends a value back and ends the call. No return means the machine hands back None. And a default value makes a slot optional.',
  alt:{html:'<p><code>print</code> vs <code>return</code> trips everyone: <code>print</code> is the machine\u2019s <em>loudspeaker</em> (a human hears it, the program can\u2019t use it); <code>return</code> is the <em>delivery tray</em> (the program receives it, can store it, pass it on). Machines that only print can\u2019t feed other machines.</p>',
       voice:'Print versus return trips up everyone. Print is the machine\u2019s loudspeaker: a human hears it, but the program cannot use it. Return is the delivery tray: the program receives the value, stores it, passes it on. A machine that only prints cannot feed another machine.'}},
 {id:'syntax', label:'The Syntax', kind:'syntax',
  code:'def price_with_tax(price, rate=0.18):\n    tax = price * rate\n    return round(price + tax, 2)\n\ndef greet(name):\n    return f"Welcome to the workshop, {name}!"\n\nprint(price_with_tax(100))\nprint(price_with_tax(100, 0.05))\nmsg = greet("Ada")\nprint(msg)\nprint(greet("Lin").upper())',
  html:'<p>Two machines. Note <code>rate=0.18</code>: call with one argument to accept the default, or two to override. Because <code>greet</code> <em>returns</em> its text, the caller can store it (<code>msg</code>) or keep working on it (<code>.upper()</code>) — that\u2019s the delivery-tray payoff.</p>',
  voice:'Two machines here. Price with tax has a default rate: call it with one argument to accept eighteen percent, or two to override. And because greet returns its text instead of printing, the caller can store it, or chain dot upper onto it. That is the delivery tray paying off.',
  alt:{html:'<p>Follow one call like the chef: <code>price_with_tax(100)</code> → the parameter <code>price</code> becomes 100, <code>rate</code> takes its default, the body computes 118.0, <code>return</code> ships it back, and the call <em>is replaced by</em> 118.0 right where it stood.</p>',
       voice:'Trace one call like the chef. Price with tax of one hundred: the parameter price becomes one hundred, rate takes its default. The body computes one hundred eighteen. Return ships it back — and the call is replaced by that value, right where it stood in your code.'}},
 {id:'realworld', label:'In the Real World', kind:'realworld',
  html:'<p>All serious software is functions calling functions: <code>login()</code>, <code>send_email()</code>, <code>resize_image()</code>. Functions are how teams divide work ("you build the payment machine, I\u2019ll build the receipt machine") and how bugs get contained to one machine instead of the whole factory.</p>',
  voice:'All serious software is functions calling functions. Log in. Send email. Resize image. Functions are how teams divide work: you build the payment machine, I build the receipt machine. And they are how a bug stays contained inside one machine, instead of spreading through the factory.',
  alt:{html:'<p>The DRY rule — <em>Don\u2019t Repeat Yourself</em>: pasted the same 4 lines three times? That\u2019s a machine begging to be built. One <code>def</code>, three short calls, one place to fix bugs forever after.</p>',
       voice:'Here is the professional habit called DRY: don\u2019t repeat yourself. If you have pasted the same four lines three times, that is a machine begging to be built. One def, three short calls, and forever after, one single place to fix bugs.'}}],
quiz:[
 {id:'functions-q1', prompt:'When does a function\u2019s body actually run?', options:[
   'The moment Python reads the def line',
   'Only when the function is called',
   'Continuously, in the background',
   'Once at the very end of the file'], correct:1,
  explain:'def only builds the machine. The body runs each time you call it: name(arguments).'},
 {id:'functions-q2', prompt:'What is the difference between print and return in a function?', options:[
   'They are interchangeable spellings of one same action',
   'return shows text on the screen; print hands values back to the caller',
   'print works only outside function definitions',
   'print shows text; return hands a value back to the caller'], correct:3,
  explain:'print is the loudspeaker (for humans); return is the delivery tray (for the program). Only returned values can be stored or reused.'},
 {id:'functions-q3', prompt:'Given  def f(x, y=10): return x + y , what is  f(5) ?', options:[
   'An error — y was never provided',
   '5, since missing y counts as zero',
   '15 — y falls back to its default 10',
   '50 — the two values get multiplied'], correct:2,
  explain:'y=10 makes the slot optional: omit it and the default 10 is used, so 5 + 10 = 15.'}],
lab:{type:'pylite',
 starter:'# Build your own machines\n# 1. Write  def area(width, height):  that RETURNS width * height.\n# 2. Write  def label(item, qty=1):  returning f"{qty} x {item}".\n# 3. Call both, print the results, and try label with and without qty.\nprint("build your machines above this line")\n',
 hint:'def area(width, height): return width * height  — then print(area(3, 4)) and print(label("chisel")), print(label("nail", 50)).'},
deck:[
 {id:'functions-c1', front:'Parameter vs argument?', back:'Parameter: the labeled slot in the def line. Argument: the actual value inserted at call time.'},
 {id:'functions-c2', front:'What does a function without return give back?', back:'None. print is for humans; only return delivers a usable value to the program.'},
 {id:'functions-c3', front:'What does a default value like  rate=0.18  do?', back:'Makes the parameter optional: omit the argument and the default is used; pass one to override.'}]},

/* ── Station 11 ──────────────────────────────────────────── */
{ id:'scope', station:11, title:'Scope — Rooms in a House', advanced:false,
svg:'<svg viewBox="0 0 120 90" role="img" aria-label="House with rooms emblem"><path d="M20 42 L60 14 L100 42" fill="none" stroke="var(--brass)" stroke-width="3"/><rect x="26" y="42" width="68" height="38" fill="var(--panel2)" stroke="var(--brass)" stroke-width="2"/><rect x="34" y="52" width="22" height="28" fill="var(--py-blue)" opacity="0.5"/><rect x="64" y="52" width="22" height="18" rx="2" fill="var(--py-gold)" opacity="0.7"/><text x="38" y="68" font-family="monospace" font-size="8" fill="var(--ink)">local</text><text x="52" y="38" font-family="monospace" font-size="8" fill="var(--ink)">global</text></svg>',
sections:[
 {id:'analogy', label:'The Analogy', kind:'analogy',
  html:'<p>Variables live in <strong>rooms</strong>. The main hallway of your program is the <strong>global</strong> room. Every function call opens a <strong>private workroom</strong>: jars created inside (parameters included) exist only there, and the room is demolished when the function returns.</p><p>From inside a workroom you can <em>see</em> the hallway\u2019s jars, but two different workrooms never see each other\u2019s.</p>',
  voice:'Variables live in rooms. Your program\u2019s main hallway is the global room. Every function call opens a private workroom: jars created inside, including parameters, exist only there, and the room is demolished the moment the function returns. From inside, you can see the hallway\u2019s jars. But two workrooms never see each other.',
  alt:{html:'<p>Different picture: <strong>stage vs. backstage</strong>. Global variables stand on stage, visible to all. Each function call gets its own backstage area with private props. When the scene ends (return), backstage is cleared. Naming a backstage prop the same as a stage prop? Backstage wins <em>while you\u2019re back there</em> — that\u2019s shadowing.</p>',
       voice:'Or think stage versus backstage. Globals stand on stage, visible to everyone. Each function call gets its own backstage with private props, cleared when the scene ends. And if a backstage prop shares a name with a stage prop, backstage wins while you are back there. That is called shadowing.'}},
 {id:'definition', label:'The Definition', kind:'definition',
  html:'<p><strong>Scope:</strong> the region of code where a name is visible.</p><p><strong>Local scope:</strong> names assigned inside a function — born at the call, gone at return. <strong>Global scope:</strong> names assigned at the top level. Lookup order: local first, then global (then built-ins). Assigning inside a function always creates a <em>local</em>, unless you declare <code>global name</code> — which is rarely a good idea.</p>',
  voice:'Formally. Scope is the region of code where a name is visible. Locals are names assigned inside a function: born at the call, gone at the return. Globals live at the top level. Python looks up names local first, then global, then built ins. And here is the rule that surprises people: assigning inside a function always creates a local — unless you explicitly declare it global, which is rarely a good idea.',
  alt:{html:'<p>Why demolish the workroom at all? So machines can\u2019t interfere: a thousand calls to <code>area()</code> each get fresh, private jars. Without scope, every function would be rummaging through one shared drawer — chaos.</p>',
       voice:'Why demolish the workroom at all? Isolation. A thousand calls to the same function each get fresh, private jars that cannot collide. Without scope, every function in a program would rummage through one shared drawer. Chaos.'}},
 {id:'syntax', label:'The Syntax', kind:'syntax',
  code:'shop_name = "The Serpent\'s Workshop"   # hallway (global)\n\ndef stamp(order):\n    tag = "APPROVED"                    # workroom (local)\n    return order + " [" + tag + "] @ " + shop_name\n\nprint(stamp("Order 17"))\ncounter = 0\ndef visit():\n    global counter                      # opt in to editing the hallway jar\n    counter = counter + 1\nvisit()\nvisit()\nprint(counter)',
  html:'<p><code>stamp</code> <em>reads</em> the global <code>shop_name</code> freely — reading up the hierarchy is always allowed. But <code>visit</code> must declare <code>global counter</code> to <em>rewrite</em> a hallway jar. Try removing that line mentally: assignment would create a local <code>counter</code> and the hallway one would stay 0.</p>',
  voice:'Stamp reads the global shop name freely — reading up the hierarchy is always allowed. But visit wants to rewrite a hallway jar, so it must declare global counter first. Imagine deleting that declaration: the assignment would quietly create a brand new local counter, and the hallway jar would stay at zero.',
  alt:{html:'<p>After <code>stamp</code> returns, ask: where is <code>tag</code>? Gone — the workroom was demolished. Ask for <code>tag</code> in the hallway and Python says <em>NameError: name \'tag\' is not defined</em>. Locals don\u2019t leak out; that\u2019s the contract.</p>',
       voice:'After stamp returns, where is tag? Gone. The workroom was demolished. Ask for tag out in the hallway and Python raises a Name Error. Locals never leak out. That is the contract.'}},
 {id:'realworld', label:'In the Real World', kind:'realworld',
  html:'<p>Scope is why a 5-million-line codebase doesn\u2019t collapse: thousands of programmers can all use the name <code>total</code> inside their own functions without collision. It\u2019s also why overusing <code>global</code> is frowned upon — shared jars that anyone can rewrite are where mystery bugs breed.</p>',
  voice:'Scope is why a five million line codebase does not collapse. Thousands of programmers all use the name total inside their own functions, with zero collisions. It is also why global is frowned upon: a shared jar that anyone can rewrite is exactly where mystery bugs breed.',
  alt:{html:'<p>Rule of thumb for beginners: functions should receive what they need through <strong>parameters</strong> and hand results back through <strong>return</strong> — the coin slot and tray — rather than grabbing global jars. Machines with clear slots are testable machines.</p>',
       voice:'A rule of thumb worth adopting early. Let functions receive what they need through parameters, and hand results back through return. The coin slot and the tray. Machines with clear slots are machines you can test.'}}],
quiz:[
 {id:'scope-q1', prompt:'A variable created inside a function exists...', options:[
   'Everywhere in the program, once the function has run',
   'Until the file is closed by the user',
   'In every other function that runs later',
   'Only during that call, inside that function'], correct:3,
  explain:'Locals are born when the call starts and demolished when it returns — private workroom jars.'},
 {id:'scope-q2', prompt:'Inside a function, x = 5 runs while a global x exists. With no global declaration, what happens?', options:[
   'A new local x is created; the global is untouched',
   'The global x is silently updated to 5 behind the scenes',
   'Python raises a duplicate-name error',
   'Both x jars are updated to 5 together'], correct:0,
  explain:'Assignment inside a function creates a local unless you declared  global x . The hallway jar is untouched.'},
 {id:'scope-q3', prompt:'Why is heavy use of  global  discouraged?', options:[
   'It makes every program run dramatically slower overall',
   'It is removed in newer Python versions',
   'Globals cannot store numbers, only text',
   'Shared, anywhere-editable state breeds hidden bugs'], correct:3,
  explain:'When any function can rewrite a shared jar, tracing who changed what becomes a nightmare. Prefer parameters and return.'}],
lab:{type:'pylite',
 starter:'# Room inspection\nworkshop = "open"\n\ndef craft(item):\n    status = "polished"\n    return item + " is " + status + ", shop is " + workshop\n\nprint(craft("chair"))\n# 1. Predict, then check: add  print(status)  at top level. What happens?\n#    (Run it, read the error, then remove or comment it.)\n# 2. Write a function close_shop() that uses  global workshop  to set it\n#    to "closed". Call it, then print workshop.\n',
 hint:'print(status) at top level raises NameError — locals are demolished. Then: def close_shop(): global workshop; workshop = "closed" (on two indented lines).'},
deck:[
 {id:'scope-c1', front:'Where do function-local variables live, and how long?', back:'In a private workroom created at the call and demolished at return. They never leak to the hallway (global scope).'},
 {id:'scope-c2', front:'What does assignment inside a function do to a same-named global?', back:'Nothing — it creates a new local (shadowing), unless you declared  global name  first.'}]},

/* ── Station 12 ──────────────────────────────────────────── */
{ id:'errors', station:12, title:'Errors — The Smoke Alarm', advanced:false,
svg:'<svg viewBox="0 0 120 90" role="img" aria-label="Smoke alarm and safety net emblem"><circle cx="60" cy="30" r="16" fill="var(--panel2)" stroke="var(--brass)" stroke-width="2"/><circle cx="60" cy="30" r="6" fill="var(--py-gold)"/><path d="M40 20 Q36 14 40 8 M60 16 Q56 10 60 4 M80 20 Q84 14 80 8" fill="none" stroke="var(--ink)" opacity="0.5" stroke-width="2"/><path d="M20 66 Q60 86 100 66" fill="none" stroke="var(--py-blue)" stroke-width="2"/><path d="M28 62 L36 74 M44 58 L50 76 M60 56 L60 78 M76 58 L70 76 M92 62 L84 74" stroke="var(--py-blue)" stroke-width="1.5" opacity="0.7"/></svg>',
sections:[
 {id:'analogy', label:'The Analogy', kind:'analogy',
  html:'<p>An error (an <strong>exception</strong>) is a <strong>smoke alarm</strong>: loud, alarming, and genuinely useful. It tells you <em>what</em> went wrong (the error type), <em>where</em> (the line number), and it stops the program before a small fire spreads.</p><p><code>try/except</code> is the <strong>safety net</strong> you rig under risky work: if the acrobat slips, the show doesn\u2019t end — the net catches, and your chosen recovery runs.</p>',
  voice:'An error, formally an exception, is a smoke alarm. Loud, alarming, and genuinely useful: it names what went wrong, points at the line, and stops the program before a small fire spreads. Try and except is the safety net you rig under risky work. If the acrobat slips, the show does not end. The net catches, and your recovery code runs.',
  alt:{html:'<p>Different picture: a <strong>circuit breaker</strong>. A fault anywhere cuts power instantly rather than letting wires melt. <code>try</code> marks the circuit you\u2019re protecting; <code>except</code> is the breaker panel where you decide what happens after the trip — log it, retry, use a fallback.</p>',
       voice:'Or think of a circuit breaker. A fault cuts the power instantly, rather than letting the wires melt. Try marks the circuit you are protecting. Except is the breaker panel, where you decide what happens after the trip: log it, retry, or fall back.'}},
 {id:'definition', label:'The Definition', kind:'definition',
  html:'<p><strong>Exception:</strong> a runtime error object that stops normal flow. Common species: <code>ValueError</code> (right type, bad value: <code>int("hi")</code>), <code>TypeError</code> (wrong type: <code>"a" + 1</code>), <code>KeyError</code> (missing dict key), <code>IndexError</code> (slot number too big), <code>ZeroDivisionError</code>, <code>NameError</code> (unknown jar).</p><p><strong>try:</strong> the guarded block. <strong>except SomeError:</strong> runs only if that species fired. <strong>finally:</strong> runs no matter what. <strong>raise</strong> triggers your own alarm.</p>',
  voice:'Formally, an exception is a runtime error object that stops normal flow. Learn the common species. Value error: right type, bad value, like int of the word hi. Type error: wrong types combined. Key error: missing dict key. Index error: slot number too big. Zero division. Name error: unknown jar. Try guards a block. Except catches one species. Finally runs no matter what. And raise sounds your own alarm.',
  alt:{html:'<p>Read a traceback bottom-up: the <strong>last line</strong> names the species and the message; the line above points at your code. It\u2019s not the program scolding you — it\u2019s a precise incident report, and reading it calmly is a superpower.</p>',
       voice:'Learn to read the traceback bottom up. The last line names the species and the message. Just above it, the exact line of your code. It is not the program scolding you. It is a precise incident report, and reading it calmly is a genuine superpower.'}},
 {id:'syntax', label:'The Syntax', kind:'syntax',
  code:'def safe_divide(a, b):\n    try:\n        return a / b\n    except ZeroDivisionError:\n        return 0.0\n\nprint(safe_divide(10, 4))\nprint(safe_divide(10, 0))\n\ndef read_age(text):\n    try:\n        age = int(text)\n    except ValueError:\n        print("Not a number:", text)\n        return None\n    return age\n\nprint(read_age("42"))\nprint(read_age("forty-two"))',
  html:'<p>Catch the <em>narrowest</em> species you expect: <code>except ZeroDivisionError</code>, not a bare <code>except</code> that swallows every alarm (including ones you\u2019d want to hear). <code>read_age</code> shows the standard convert-or-recover pattern for user input.</p>',
  voice:'The craft here is catching the narrowest species you expect. Except zero division error — not a bare except that swallows every alarm, including ones you would want to hear. And read age shows the standard pattern for user input: try to convert, recover with a message if it fails.',
  alt:{html:'<p>When to net, when to alarm? Net the failures you <em>expect and can handle</em> (bad input, missing file). Let genuine bugs ring — a typo\u2019d variable name <em>should</em> crash loudly in development, so you find it. Nets over everything hide fires.</p>',
       voice:'A judgment call worth naming. Net the failures you expect and can handle: bad input, a missing file. But let genuine bugs ring. A typo in a variable name should crash loudly while you are developing, so you actually find it. Nets over everything just hide fires.'}},
 {id:'realworld', label:'In the Real World', kind:'realworld',
  html:'<p>Type letters into a "quantity" box and the site says "please enter a number" instead of dying — that\u2019s a caught <code>ValueError</code>. Payment gateways wrap bank calls in try/except with retries; spacecraft software famously guards everything. Graceful failure is a feature users never see but always feel.</p>',
  voice:'Type letters into a quantity box, and the site says please enter a number, instead of dying. That is a caught value error. Payment systems wrap bank calls in try and except with retries. Spacecraft software guards everything. Graceful failure is a feature users never see, but always feel.',
  alt:{html:'<p>"The app crashed" vs "The app showed \u2018Couldn\u2019t save — retry?\u2019" is exactly one try/except of difference. You now know which line of code separates those two products.</p>',
       voice:'The app crashed, versus, the app said couldn\u2019t save, retry. Those two products differ by exactly one try and except. You now know which line of code separates them.'}}],
quiz:[
 {id:'errors-q1', prompt:'What does  int("hello")  raise?', options:[
   'TypeError — int cannot accept strings',
   'NameError — hello was never defined',
   'Nothing happens; it simply returns the number zero',
   'ValueError — right type, unconvertible value'], correct:3,
  explain:'int() accepts strings fine ("42" works); "hello" is the right type but a bad value → ValueError.'},
 {id:'errors-q2', prompt:'When does the code in an  except ValueError:  block run?', options:[
   'Only if the try block raised a ValueError',
   'Always, immediately after the try block',
   'Whenever any error of any kind occurs',
   'Before the try block, as preparation'], correct:0,
  explain:'except blocks are species-specific nets: they run only when the try block raises that matching error.'},
 {id:'errors-q3', prompt:'Why is a bare  except:  (catching everything) usually bad?', options:[
   'It only works inside functions',
   'Python forbids more than one of them',
   'It silences bugs you needed to hear about',
   'It makes all caught errors fatal anyway'], correct:2,
  explain:'A net over everything catches genuine bugs (typos, logic errors) too, hiding fires. Catch the narrow species you expect.'}],
lab:{type:'pylite',
 starter:'# Rig the safety nets\norders = ["12", "7", "oops", "30"]\n# 1. Loop over orders; convert each with int() inside try/except ValueError.\n# 2. Keep a running total of valid orders; print a warning for bad ones.\n# 3. Print the final total after the loop.\ntotal = 0\nprint(orders)\n',
 hint:'for o in orders: / try: total = total + int(o) / except ValueError: print("skipping", o) — then print(total) (should be 49).'},
deck:[
 {id:'errors-c1', front:'ValueError vs TypeError?', back:'ValueError: right type, bad value — int("hi"). TypeError: incompatible types — "a" + 1.'},
 {id:'errors-c2', front:'What do try / except / finally each do?', back:'try guards risky code; except <Species> runs only if that error fired; finally runs no matter what.'},
 {id:'errors-c3', front:'Should you catch every error with a bare except?', back:'No — catch the narrowest expected species. Nets over everything hide real bugs (fires) you needed to hear.'}]},

/* ── Station 13 ──────────────────────────────────────────── */
{ id:'files', station:13, title:'Files & with — The Library Loan', advanced:false,
svg:'<svg viewBox="0 0 120 90" role="img" aria-label="Open book with bookmark emblem"><path d="M60 22 Q38 14 18 22 L18 68 Q38 60 60 68 Q82 60 102 68 L102 22 Q82 14 60 22 Z" fill="var(--panel2)" stroke="var(--brass)" stroke-width="2"/><path d="M60 22 L60 68" stroke="var(--brass)" stroke-width="2"/><path d="M26 32 L52 30 M26 42 L52 40 M26 52 L52 50 M68 30 L94 32 M68 40 L94 42" stroke="var(--ink)" opacity="0.5" stroke-width="2"/><rect x="84" y="14" width="8" height="22" fill="var(--py-gold)"/></svg>',
sections:[
 {id:'analogy', label:'The Analogy', kind:'analogy',
  html:'<p>Working with a file is <strong>borrowing a library book</strong>. You check it out (<code>open</code>), read or write, and you <em>must</em> return it (<code>close</code>) — hog it and others can\u2019t use it, and unsaved scribbles may be lost.</p><p>The <code>with</code> statement is the <strong>librarian who takes returns automatically</strong>: however you leave the block — finished or mid-error — the book goes back. Borrowing without <code>with</code> is how books get lost.</p>',
  voice:'Working with a file is borrowing a library book. You check it out with open, you read or write, and you must return it — hog the book and others cannot use it, and unsaved scribbles may be lost. The with statement is a librarian who takes returns automatically. However you leave the block, even mid error, the book goes back. Always borrow through the librarian.',
  alt:{html:'<p>Different picture: a <strong>hotel key card</strong>. Check-in issues the card (<code>open</code>); check-out invalidates it. <code>with</code> is express checkout: walk out however you like — the room is released. Modes are your booking type: <code>"r"</code> read-only visit, <code>"w"</code> gut-renovate (erases what was there!), <code>"a"</code> add a note to the guestbook.</p>',
       voice:'Or a hotel key card. Check in issues the card, check out invalidates it, and with is express checkout: however you leave, the room is released. The mode is your booking type. R is a read only visit. W renovates — it erases what was there. A appends a note to the guest book.'}},
 {id:'definition', label:'The Definition', kind:'definition',
  html:'<p><strong>open(path, mode)</strong> returns a file object. Modes: <code>"r"</code> read (default), <code>"w"</code> write (<em>truncates existing content!</em>), <code>"a"</code> append.</p><p><strong>with open(...) as f:</strong> binds the file to <code>f</code> for the block and guarantees closing — it\u2019s a <em>context manager</em>. Reading: <code>f.read()</code> everything, <code>f.readlines()</code> a list of lines. Writing: <code>f.write(text)</code> — add <code>"\\n"</code> yourself.</p>',
  voice:'Formally. Open takes a path and a mode and returns a file object. R reads. W writes — and truncates whatever was there, so be careful. A appends. With open as f binds the file for the block and guarantees closing; the mechanism is called a context manager. Read everything with f dot read, or line by line with readlines. Write with f dot write, and remember: you add the newline characters yourself.',
  alt:{html:'<p>The sharp edge, twice for emphasis: <strong><code>"w"</code> erases the file the instant it opens</strong> — before you write anything. Meant to add to a log but opened with <code>"w"</code>? The log is already gone. Adding = <code>"a"</code>, always.</p>',
       voice:'One sharp edge, stated twice on purpose. Mode w erases the file the instant it opens, before you write a single character. If you meant to add to a log but opened with w, the log is already gone. Adding means mode a. Always.'}},
 {id:'syntax', label:'The Syntax', kind:'syntax',
  code:'with open("log.txt", "w") as f:\n    f.write("kiln fired\\n")\n    f.write("glaze mixed\\n")\n\nwith open("log.txt", "a") as f:\n    f.write("mugs shipped\\n")\n\nwith open("log.txt") as f:\n    for line in f.readlines():\n        print("LOG:", line.strip())',
  html:'<p>Three visits: write two lines (creating the file), append a third, then read all three back. <code>.strip()</code> trims the trailing <code>\\n</code> so <code>print</code> doesn\u2019t double-space. This lab runs on the workshop\u2019s sandboxed in-memory files — experiment freely.</p>',
  voice:'Three library visits. First, write two lines, creating the file. Second, append a third — note the mode a. Third, read all of them back, stripping each trailing newline so print does not double space. In this workshop the files live in a safe in memory sandbox, so experiment freely.',
  alt:{html:'<p>Why does the librarian matter so much? Delete the <code>with</code> and imagine an error between <code>open</code> and <code>close</code>: the function exits, <code>close</code> never runs, the book is stranded. <code>with</code> is <code>try/finally</code> wearing a cardigan — the return <em>always</em> happens.</p>',
       voice:'Why does the librarian matter so much? Imagine opening without with, and an error striking before your close line. The function exits. Close never runs. The book is stranded. With is simply try finally wearing a cardigan: the return always happens.'}},
 {id:'realworld', label:'In the Real World', kind:'realworld',
  html:'<p>Files are software\u2019s long-term memory: settings that survive reboots, CSV exports for spreadsheets, server logs that let engineers replay last night\u2019s outage. "Export", "Save as", "Download" — each is an <code>open</code>-write-close ceremony behind a button.</p>',
  voice:'Files are software\u2019s long term memory. Settings that survive a reboot. C S V exports for spreadsheets. Server logs that let engineers replay last night\u2019s outage. Every export, save as, and download button hides this same open, write, close ceremony.',
  alt:{html:'<p>The context-manager pattern outgrows files: database connections, network sockets, locks — anything that must be <em>returned</em> gets a <code>with</code>. Learn the librarian here, and you\u2019ve learned the professional idiom for all of them.</p>',
       voice:'And the librarian pattern outgrows files. Database connections, network sockets, locks — anything that must be returned gets a with statement. Learn it here, and you have learned the professional idiom for all of them.'}}],
quiz:[
 {id:'files-q1', prompt:'What is the main job of  with open(...) as f: ?', options:[
   'It makes file reads three times faster',
   'It guarantees the file closes, even on error',
   'It backs the whole file up before any changes are made',
   'It locks the file forever afterwards'], correct:1,
  explain:'with is the auto-returning librarian: however the block exits, the file is closed.'},
 {id:'files-q2', prompt:'You open an existing diary with mode "w". What just happened?', options:[
   'Nothing at all happens until the very first write call',
   'New text will append to the end',
   'Python refused: the file exists',
   'Its contents were erased immediately'], correct:3,
  explain:'"w" truncates on open — the file is emptied before you write anything. To add, use "a".'},
 {id:'files-q3', prompt:'Which mode adds lines to the end of an existing log?', options:[
   '"r" — read mode with writing enabled',
   '"w" — write mode, keeping old content',
   '"a" — append mode',
   '"end" — the dedicated ending mode'], correct:2,
  explain:'"a" appends. "r" is read-only and "w" erases; there is no "end" mode.'}],
lab:{type:'pylite',
 starter:'# Kiln logbook (sandboxed files)\n# 1. Open "kiln.txt" with "w" and write two firing entries (end each with \\n).\n# 2. Re-open with "a" and add one more entry.\n# 3. Read it back and print each line numbered:  1: entry...\n#    (Hint: keep a counter, or loop over readlines with an index.)\nprint("start your logbook")\n',
 hint:'with open("kiln.txt", "w") as f: f.write("bisque 900C\\n")... then "a"... then n = 1 and for line in f.readlines(): print(f"{n}: {line.strip()}"); n = n + 1.'},
deck:[
 {id:'files-c1', front:'What do modes "r", "w", "a" do?', back:'"r" read-only. "w" write — truncates the file the moment it opens. "a" append to the end.'},
 {id:'files-c2', front:'Why prefer  with open(...)  over bare open()?', back:'with guarantees the file is closed however the block exits (even mid-error) — the auto-returning librarian.'},
 {id:'files-c3', front:'What is a context manager?', back:'An object usable in a with-block that sets up on entry and cleans up on exit, guaranteed. Files are the classic example.'}]},
