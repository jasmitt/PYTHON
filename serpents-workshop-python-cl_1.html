      const firstKey = parseExpr();
      if (at('OP',':')){
        next();
        const pairs=[{k:firstKey, v: parseExpr()}];
        while (at('OP',',')){ next(); if (at('OP','}')) break; const k = parseExpr(); expect('OP',':'); pairs.push({k, v: parseExpr()}); }
        expect('OP','}');
        return {type:'Dict', pairs, line:t.line};
      }
      const items=[firstKey];
      while (at('OP',',')){ next(); if (at('OP','}')) break; items.push(parseExpr()); }
      expect('OP','}');
      return {type:'SetLit', items, line:t.line};
    }
    perr('SyntaxError', 'invalid syntax' + (t.value!==undefined? " near '"+t.value+"'":''), t.line);
  }

  // decorator pre-pass: transform '@name\ndef f...' — we handle at statement level:
  const origParseStatement = parseStatement;
  return parseProgramWithDecorators();

  function parseProgramWithDecorators(){
    // We re-implement top loop to catch '@'
    const body = [];
    skipNewlines();
    while (!at('EOF')) { body.push(parseStatementD()); skipNewlines(); }
    return {type:'Program', body};
  }
  function parseStatementD(){
    if (peek().type==='OP' && peek().value==='@') return parseDecorated();
    return parseStatement();
  }
  function parseDecorated(){
    const decorators=[];
    while (peek().type==='OP' && peek().value==='@'){
      next();
      let d = {type:'Name', name: expect('NAME').value, line: peek().line};
      d = parsePostfix(d);
      decorators.push(d);
      if (at('NEWLINE')) next();
      skipNewlines();
    }
    if (!atKW('def')) perr('SyntaxError','decorator must be followed by def', peek().line);
    return parseDef(decorators);
  }
}

/* '@' needs tokenizing — patch: include in op chars */
// (handled below by re-defining tokenize op set via wrapper)
const _origTokenize = tokenize;

/* ---- evaluator ---- */
const BREAK = {signal:'break'}, CONTINUE = {signal:'continue'};
class ReturnSignal { constructor(v){ this.v = v; } }

function Env(parent){ this.vars = new Map(); this.parent = parent; this.globals = parent ? parent.globals : this; }
Env.prototype.get = function(name, line){
  let e = this;
  while (e){ if (e.vars.has(name)) return e.vars.get(name); e = e.parent; }
  perr('NameError', "name '" + name + "' is not defined", line);
};
Env.prototype.has = function(name){ let e=this; while(e){ if (e.vars.has(name)) return true; e=e.parent; } return false; };
Env.prototype.set = function(name, v){ this.vars.set(name, v); };
Env.prototype.setExisting = function(name, v){
  let e=this; while(e){ if (e.vars.has(name)){ e.vars.set(name,v); return true; } e=e.parent; } return false;
};

function findMethod(cls, name){
  let c = cls;
  while (c){ if (c.methods.has(name)) return c.methods.get(name); c = c.base; }
  return null;
}

function truthy(v){
  if (v === null || v === false) return false;
  if (v === true) return true;
  if (typeof v === 'string') return v.length > 0;
  if (isNum(v)) return v.v !== 0;
  if (Array.isArray(v)) return v.length > 0;
  if (v.t === 'dict' || v.t === 'set') return v.m.size > 0;
  if (v.t === 'tuple') return v.items.length > 0;
  if (v.t === 'range') return rangeLen(v) > 0;
  return true;
}

function rangeLen(r){
  if (r.step > 0) return Math.max(0, Math.ceil((r.stop - r.start) / r.step));
  return Math.max(0, Math.ceil((r.start - r.stop) / -r.step));
}

function pyEq(a, b){
  a = pyBoolAsNum(a); b = pyBoolAsNum(b);
  if (a === null || b === null) return a === b;
  if (isNum(a) && isNum(b)) return a.v === b.v;
  if (typeof a === 'string' && typeof b === 'string') return a === b;
  if (Array.isArray(a) && Array.isArray(b)) return a.length === b.length && a.every((x,i)=>pyEq(x,b[i]));
  if (a.t === 'tuple' && b.t === 'tuple') return a.items.length === b.items.length && a.items.every((x,i)=>pyEq(x,b.items[i]));
  if (a.t === 'dict' && b.t === 'dict'){
    if (a.m.size !== b.m.size) return false;
    for (const [k, e] of a.m){ if (!b.m.has(k) || !pyEq(e.v, b.m.get(k).v)) return false; }
    return true;
  }
  if (a.t === 'set' && b.t === 'set'){
    if (a.m.size !== b.m.size) return false;
    for (const k of a.m.keys()) if (!b.m.has(k)) return false;
    return true;
  }
  return a === b;
}

function pyCmp(a, b, line){
  a = pyBoolAsNum(a); b = pyBoolAsNum(b);
  if (isNum(a) && isNum(b)) return a.v < b.v ? -1 : a.v > b.v ? 1 : 0;
  if (typeof a === 'string' && typeof b === 'string') return a < b ? -1 : a > b ? 1 : 0;
  if (Array.isArray(a) && Array.isArray(b)){
    for (let i=0;i<Math.min(a.length,b.length);i++){ const c = pyCmp(a[i],b[i],line); if (c!==0) return c; }
    return a.length - b.length;
  }
  if (a && b && a.t==='tuple' && b.t==='tuple') return pyCmp(a.items, b.items, line);
  perr('TypeError', "'<' not supported between instances of '" + pyTypeName(a) + "' and '" + pyTypeName(b) + "'", line);
}

function Interpreter(opts){
  opts = opts || {};
  this.out = [];
  this.steps = 0;
  this.maxSteps = opts.maxSteps || 200000;
  this.stdin = (opts.stdin || []).slice();
  this.vfs = new Map(Object.entries(opts.files || {}));
  this.events = []; // structured trace for visualizers
  this.globalEnv = new Env(null);
  this.installBuiltins();
}

Interpreter.prototype.tick = function(line){
  if (++this.steps > this.maxSteps) perr('RuntimeError', 'step limit exceeded — possible infinite loop', line);
};

Interpreter.prototype.write = function(s){ this.out.push(s); };

Interpreter.prototype.installBuiltins = function(){
  const self = this;
  const B = (name, fn) => self.globalEnv.set(name, {t:'builtin', name, fn});
  B('print', (args, kwargs, line) => {
    let sep = ' ', end = '\n';
    for (const kw of kwargs){
      if (kw.name === 'sep') sep = kw.v; else if (kw.name === 'end') end = kw.v;
      else perr('TypeError', "'" + kw.name + "' is an invalid keyword argument for print()", line);
    }
    self.write(args.map(a => self.toStr(a, line)).join(sep) + end);
    return null;
  });
  B('len', (a,k,line) => {
    const v = a[0];
    if (typeof v === 'string') return PyNum(v.length);
    if (Array.isArray(v)) return PyNum(v.length);
    if (v && v.t==='tuple') return PyNum(v.items.length);
    if (v && (v.t==='dict'||v.t==='set')) return PyNum(v.m.size);
    if (v && v.t==='range') return PyNum(rangeLen(v));
    perr('TypeError', "object of type '" + pyTypeName(v) + "' has no len()", line);
  });
  B('range', (a,k,line) => {
    const nums = a.map(x => { if (!isNum(x) || x.f) perr('TypeError', "'"+pyTypeName(x)+"' object cannot be interpreted as an integer", line); return x.v; });
    if (nums.length === 1) return mkRange(0, nums[0], 1);
    if (nums.length === 2) return mkRange(nums[0], nums[1], 1);
    if (nums.length === 3){ if (nums[2] === 0) perr('ValueError','range() arg 3 must not be zero', line); return mkRange(nums[0], nums[1], nums[2]); }
    perr('TypeError','range expected 1 to 3 arguments', line);
  });
  B('str', (a,k,line) => a.length ? this.toStr(a[0], line) : '');
  B('int', (a,k,line) => {
    const v = a[0];
    if (v === undefined) return PyNum(0);
    if (v === true) return PyNum(1); if (v === false) return PyNum(0);
    if (isNum(v)) return PyNum(Math.trunc(v.v), false);
    if (typeof v === 'string'){
      const s = v.trim();
      if (!/^[+-]?\d+$/.test(s)) perr('ValueError', "invalid literal for int() with base 10: '" + v + "'", line);
      return PyNum(parseInt(s,10), false);
    }
    perr('TypeError', "int() argument must be a string or a number, not '" + pyTypeName(v) + "'", line);
  });
  B('float', (a,k,line) => {
    const v = a[0];
    if (v === undefined) return PyNum(0, true);
    if (isNum(v)) return PyNum(v.v, true);
    if (typeof v === 'string'){
      const n = parseFloat(v.trim());
      if (isNaN(n) || !/^[+-]?(\d+\.?\d*|\.\d+)$/.test(v.trim())) perr('ValueError', "could not convert string to float: '" + v + "'", line);
      return PyNum(n, true);
    }
    perr('TypeError', "float() argument must be a string or a number", line);
  });
  B('bool', (a) => a.length ? truthy(a[0]) : false);
  B('list', (a,k,line) => a.length ? this.iterToArray(a[0], line).slice() : []);
  B('tuple', (a,k,line) => mkTuple(a.length ? this.iterToArray(a[0], line).slice() : []));
  B('set', (a,k,line) => {
    const s = mkSet();
    if (a.length) for (const v of this.iterToArray(a[0], line)) s.m.set(keyOf(v,line), {k:v});
    return s;
  });
  B('dict', (a,k,line) => {
    const d = mkDict();
    for (const kw of k) d.m.set('s:'+kw.name, {k: kw.name, v: kw.v});
    return d;
  });
  B('sum', (a,k,line) => {
    let total = 0, f = false;
    for (const v0 of this.iterToArray(a[0], line)){
      const v = pyBoolAsNum(v0);
      if (!isNum(v)) perr('TypeError', "unsupported operand type(s) for +: 'int' and '" + pyTypeName(v) + "'", line);
      total += v.v; f = f || v.f;
    }
    return PyNum(total, f);
  });
  const minmax = (name, sign) => B(name, (a,k,line) => {
    const items = a.length === 1 ? this.iterToArray(a[0], line) : a;
    if (!items.length) perr('ValueError', name+'() arg is an empty sequence', line);
    let best = items[0];
    for (const v of items.slice(1)) if (sign * pyCmp(v, best, line) > 0) best = v;
    return best;
  });
  minmax('min', -1); minmax('max', 1);
  B('sorted', (a,k,line) => {
    const arr = this.iterToArray(a[0], line).slice();
    let rev = false, keyFn = null;
    for (const kw of k){ if (kw.name==='reverse') rev = truthy(kw.v); else if (kw.name==='key') keyFn = kw.v; }
    const cmpVal = keyFn ? (x)=>this.callFunction(keyFn,[x],[],line) : (x)=>x;
    arr.sort((x,y)=>pyCmp(cmpVal(x), cmpVal(y), line));
    if (rev) arr.reverse();
    return arr;
  });
  B('reversed', (a,k,line) => this.iterToArray(a[0], line).slice().reverse());
  B('abs', (a,k,line) => { const v = pyBoolAsNum(a[0]); if (!isNum(v)) perr('TypeError', "bad operand type for abs(): '" + pyTypeName(v) + "'", line); return PyNum(Math.abs(v.v), v.f); });
  B('round', (a,k,line) => {
    const v = a[0];
    if (!isNum(v)) perr('TypeError', 'type ' + pyTypeName(v) + " doesn't define __round__ method", line);
    if (a.length > 1){
      const nd = a[1].v;
      const m = Math.pow(10, nd);
      return PyNum(Math.round((v.v + Number.EPSILON) * m) / m, true);
    }
    // banker's rounding approximation → use standard round-half-away for teaching clarity, note in docs
    return PyNum(Math.round(v.v), false);
  });
  B('type', (a) => "<class '" + pyTypeName(a[0]) + "'>");
  B('enumerate', (a,k,line) => {
    let start = 0;
    for (const kw of k) if (kw.name==='start') start = kw.v.v;
    if (a.length > 1) start = a[1].v;
    return this.iterToArray(a[0], line).map((v,i)=>mkTuple([PyNum(start+i), v]));
  });
  B('zip', (a,k,line) => {
    const arrays = a.map(x=>this.iterToArray(x, line));
    const n = Math.min(...arrays.map(x=>x.length), Infinity);
    const out=[];
    for (let i=0;i<(arrays.length?n:0);i++) out.push(mkTuple(arrays.map(x=>x[i])));
    return out;
  });
  B('input', (a,k,line) => {
    if (a.length) this.write(this.toStr(a[0], line));
    const v = this.stdin.length ? this.stdin.shift() : '';
    this.write(v + '\n');
    return v;
  });
  B('isinstance', (a,k,line) => {
    const [v, cls] = a;
    if (cls && cls.t === 'class'){
      if (!v || v.t !== 'inst') return false;
      let c = v.cls; while (c){ if (c === cls) return true; c = c.base; } return false;
    }
    if (cls && cls.t === 'builtin'){
      const map = {int:'int', float:'float', str:'str', bool:'bool', list:'list', dict:'dict', tuple:'tuple', set:'set'};
      const want = map[cls.name];
      if (!want) perr('TypeError','isinstance() arg 2 must be a type', line);
      if (want === 'int' && (v===true||v===false)) return true; // bool is int subclass
      return pyTypeName(v) === want;
    }
    perr('TypeError','isinstance() arg 2 must be a type', line);
  });
  B('chr', (a,k,line) => String.fromCharCode(a[0].v));
  B('ord', (a,k,line) => { if (typeof a[0]!=='string'||a[0].length!==1) perr('TypeError','ord() expected a character', line); return PyNum(a[0].charCodeAt(0)); });
  B('open', (a,k,line) => {
    const name = a[0], mode = a.length>1 ? a[1] : 'r';
    if (mode.includes('r') && !this.vfs.has(name)) perr('FileNotFoundError', "[Errno 2] No such file or directory: '" + name + "'", line);
    const file = {t:'file', name, mode, pos:0, buf: mode.includes('w') ? '' : (this.vfs.get(name)||''), closed:false, vfs:this.vfs};
    if (mode.includes('a')) file.buf = this.vfs.get(name) || '';
    return file;
  });
};

Interpreter.prototype.toStr = function(v, line){
  if (typeof v === 'string') return v;
  if (v && v.t === 'inst'){
    const m = findMethod(v.cls, '__str__');
    if (m){
      const r = this.callFunction({t:'bound', self:v, fn:m}, [], [], line);
      if (typeof r !== 'string') perr('TypeError','__str__ returned non-string', line);
      return r;
    }
    return '<' + v.cls.name + ' object>';
  }
  return pyRepr(v);
};

Interpreter.prototype.reprOf = function(v, line){
  if (v && v.t === 'inst') return this.toStr(v, line);
  return pyRepr(v);
};

Interpreter.prototype.iterToArray = function(v, line){
  if (typeof v === 'string') return v.split('');
  if (Array.isArray(v)) return v;
  if (v && v.t === 'tuple') return v.items;
  if (v && v.t === 'set') return [...v.m.values()].map(e=>e.k);
  if (v && v.t === 'dict') return [...v.m.values()].map(e=>e.k);
  if (v && v.t === 'range'){
    const n = rangeLen(v);
    if (n > 1000000) perr('RuntimeError','range too large for this simulator', line);
    const out = new Array(n);
    for (let i=0;i<n;i++) out[i] = PyNum(v.start + i*v.step, false);
    return out;
  }
  perr('TypeError', "'" + pyTypeName(v) + "' object is not iterable", line);
};

Interpreter.prototype.run = function(src, replMode){
  const tokens = tokenize(src);
  const ast = parse(tokens);
  let last = null;
  for (const stmt of ast.body){
    last = this.execStmt(stmt, this.globalEnv);
  }
  if (replMode && ast.body.length){
    const lastStmt = ast.body[ast.body.length-1];
    if (lastStmt.type === 'ExprStmt' && last !== null && last !== undefined){
      this.write(this.reprOf(last, lastStmt.line) + '\n');
    }
  }
};

Interpreter.prototype.execBlock = function(body, env){
  let last = null;
  for (const s of body) last = this.execStmt(s, env);
  return last;
};

Interpreter.prototype.execStmt = function(node, env){
  this.tick(node.line);
  switch(node.type){
    case 'ExprStmt': return this.evalExpr(node.expr, env);
    case 'Assign': { const v = this.evalExpr(node.value, env); this.assign(node.target, v, env); return null; }
    case 'AugAssign': {
      const cur = this.evalTarget(node.target, env);
      const v = this.binop(node.op, cur, this.evalExpr(node.value, env), node.line);
      this.assign(node.target, v, env);
      return null;
    }
    case 'If': {
      if (truthy(this.evalExpr(node.test, env))) return this.execBlock(node.body, env);
      return this.execBlock(node.orelse, env);
    }
    case 'While': {
      while (truthy(this.evalExpr(node.test, env))){
        this.tick(node.line);
        const r = this.execLoopBody(node.body, env);
        if (r === BREAK) break;
      }
      return null;
    }
    case 'For': {
      const items = this.iterToArray(this.evalExpr(node.iter, env), node.line);
      for (const item of items){
        this.tick(node.line);
        this.bindTargets(node.targets, item, env, node.line);
        const r = this.execLoopBody(node.body, env);
        if (r === BREAK) break;
      }
      return null;
    }
    case 'Def': {
      let fn = {t:'func', name: node.name, params: node.params, defaults: node.defaults.map(d=>({name:d.name, v:this.evalExpr(d.expr, env)})), body: node.body, env};
      for (let i = node.decorators.length-1; i >= 0; i--){
        const dec = this.evalExpr(node.decorators[i], env);
        fn = this.callFunction(dec, [fn], [], node.line);
      }
      env.set(node.name, fn);
      return null;
    }
    case 'ClassDef': {
      const base = node.base ? env.get(node.base, node.line) : null;
      if (base && base.t !== 'class') perr('TypeError','base must be a class', node.line);
      const cls = {t:'class', name: node.name, base, methods: new Map()};
      const clsEnv = new Env(env);
      for (const s of node.body){
        if (s.type === 'Def'){
          const fn = {t:'func', name: s.name, params: s.params, defaults: s.defaults.map(d=>({name:d.name, v:this.evalExpr(d.expr, clsEnv)})), body: s.body, env};
          cls.methods.set(s.name, fn);
        } else if (s.type === 'Pass') { /* ok */ }
        else if (s.type === 'Assign' && s.target.type === 'Name'){
          // class attribute → store as method-map value (simple)
          cls.methods.set(s.target.name, {t:'classattr', v: this.evalExpr(s.value, clsEnv)});
        } else if (s.type === 'ExprStmt' && s.expr.type === 'Str'){ /* docstring */ }
        else perr('SyntaxError','only methods, simple attributes, and pass are allowed in class bodies (simulator)', s.line);
      }
      env.set(node.name, cls);
      return null;
    }
    case 'Return': throw new ReturnSignal(node.arg ? this.evalExpr(node.arg, env) : null);
    case 'Break': return BREAK;
    case 'Continue': return CONTINUE;
    case 'Pass': return null;
    case 'Global': { (env.globalDecls || (env.globalDecls = new Set())); for (const n of node.names) env.globalDecls.add(n); return null; }
    case 'Raise': {
      if (!node.exc) perr('RuntimeError','No active exception to re-raise', node.line);
      const e = this.evalExpr(node.exc, env);
      if (e && e.t === 'excval') throw new PyError(e.name, e.msg, node.line);
      if (typeof e === 'string') throw new PyError('Exception', e, node.line);
      perr('TypeError','exceptions must derive from BaseException', node.line);
    }
    case 'Try': {
      try {
        this.execBlock(node.body, env);
      } catch (err){
        if (err instanceof ReturnSignal) { if (node.finallyBody) this.execBlock(node.finallyBody, env); throw err; }
        if (!(err instanceof PyError)) throw err;
        let handled = false;
        for (const h of node.handlers){
          if (h.exType === null || h.exType === err.pyType || h.exType === 'Exception'){
            if (h.varName) env.set(h.varName, err.pyMsg);
            this.execBlock(h.body, env);
            handled = true; break;
          }
        }
        if (!handled){ if (node.finallyBody) this.execBlock(node.finallyBody, env); throw err; }
      }
      if (node.finallyBody) this.execBlock(node.finallyBody, env);
      return null;
    }
    case 'With': {
      const ctx = this.evalExpr(node.ctx, env);
      if (!ctx || ctx.t !== 'file') perr('TypeError','with is only supported for open() file objects in this simulator', node.line);
      if (node.varName) env.set(node.varName, ctx);
      try { this.execBlock(node.body, env); }
      finally { this.closeFile(ctx); }
      return null;
    }
    case 'Import': {
      if (node.name !== 'math') perr('ModuleNotFoundError', "No module named '" + node.name + "' (this simulator only ships math)", node.line);
      env.set('math', this.mathModule(node.line));
      return null;
    }
    case 'FromImport': {
      if (node.mod !== 'math') perr('ModuleNotFoundError', "No module named '" + node.mod + "' (this simulator only ships math)", node.line);
      const m = this.mathModule(node.line);
      for (const n of node.names){
        if (!m.attrs.has(n)) perr('ImportError', "cannot import name '" + n + "' from 'math'", node.line);
        env.set(n, m.attrs.get(n));
      }
      return null;
    }
    case 'Del': {
      if (node.target.type === 'Index'){
        const obj = this.evalExpr(node.target.obj, env);
        const idx = this.evalExpr(node.target.index, env);
        if (Array.isArray(obj)){ const i = this.normIndex(idx, obj.length, node.line); obj.splice(i,1); return null; }
        if (obj && obj.t==='dict'){ const k = keyOf(idx, node.line); if (!obj.m.has(k)) perr('KeyError', pyRepr(idx), node.line); obj.m.delete(k); return null; }
      }
      if (node.target.type === 'Name'){ 
        if (!env.vars.has(node.target.name) && !env.setExisting) perr('NameError', "name '"+node.target.name+"' is not defined", node.line);
        env.vars.delete(node.target.name); return null;
      }
      perr('SyntaxError','del target not supported', node.line);
    }
  }
  perr('RuntimeError','unknown statement ' + node.type, node.line);
};

Interpreter.prototype.execLoopBody = function(body, env){
  for (const s of body){
    const r = this.execStmt(s, env);
    if (r === BREAK) return BREAK;
    if (r === CONTINUE) return CONTINUE;
    if (Array.isArray(body) && (r === BREAK || r === CONTINUE)) return r;
    // propagate from nested if-blocks:
    if (r && (r === BREAK || r === CONTINUE)) return r;
    if (r && r.__loopSignal) return r.__loopSignal;
  }
  return null;
};

// if/else blocks must propagate break/continue:
const _origExecStmt = Interpreter.prototype.execStmt;
Interpreter.prototype.execStmt = function(node, env){
  if (node.type === 'If'){
    this.tick(node.line);
    const branch = truthy(this.evalExpr(node.test, env)) ? node.body : node.orelse;
    for (const s of branch){
      const r = this.execStmt(s, env);
      if (r === BREAK || r === CONTINUE) return r;
    }
    return null;
  }
  return _origExecStmt.call(this, node, env);
};

Interpreter.prototype.mathModule = function(line){
  const wrap1 = (name, f) => [name, {t:'builtin', name:'math.'+name, fn:(a,k,l)=>{ const v = pyBoolAsNum(a[0]); if(!isNum(v)) perr('TypeError','must be real number', l); return PyNum(f(v.v), true); }}];
  const attrs = new Map([
    ['pi', PyNum(Math.PI, true)], ['e', PyNum(Math.E, true)],
    wrap1('sqrt', Math.sqrt), wrap1('fabs', Math.abs),
    ['floor', {t:'builtin', name:'math.floor', fn:(a,k,l)=>PyNum(Math.floor(a[0].v), false)}],
    ['ceil', {t:'builtin', name:'math.ceil', fn:(a,k,l)=>PyNum(Math.ceil(a[0].v), false)}],
    ['pow', {t:'builtin', name:'math.pow', fn:(a,k,l)=>PyNum(Math.pow(a[0].v, a[1].v), true)}],
  ]);
  return {t:'module', name:'math', attrs};
};

Interpreter.prototype.closeFile = function(f){
  if (f.closed) return;
  f.closed = true;
  if (f.mode.includes('w') || f.mode.includes('a')) this.vfs.set(f.name, f.buf);
};

Interpreter.prototype.bindTargets = function(targets, value, env, line){
  if (targets.length === 1){ this.setName(targets[0], value, env); return; }
  const items = this.iterToArray(value, line);
  if (items.length !== targets.length) perr('ValueError', items.length > targets.length ? 'too many values to unpack (expected ' + targets.length + ')' : 'not enough values to unpack (expected ' + targets.length + ', got ' + items.length + ')', line);
  targets.forEach((t,i)=>this.setName(t, items[i], env));
};

Interpreter.prototype.setName = function(name, v, env){
  if (env.globalDecls && env.globalDecls.has(name)){ env.globals.set(name, v); return; }
  env.set(name, v);
};

Interpreter.prototype.assign = function(target, value, env){
  switch(target.type){
    case 'Name': this.setName(target.name, value, env); return;
    case 'TupleExpr': case 'Tuple': {
      const tgts = target.items;
      const items = this.iterToArray(value, target.line);
      if (items.length !== tgts.length) perr('ValueError', items.length > tgts.length ? 'too many values to unpack (expected ' + tgts.length + ')' : 'not enough values to unpack (expected ' + tgts.length + ', got ' + items.length + ')', target.line);
      tgts.forEach((t,i)=>this.assign(t, items[i], env));
      return;
    }
    case 'Index': {
      const obj = this.evalExpr(target.obj, env);
      const idx = this.evalExpr(target.index, env);
      if (Array.isArray(obj)){
        const i = this.normIndex(idx, obj.length, target.line);
        obj[i] = value; return;
      }
      if (obj && obj.t === 'dict'){ obj.m.set(keyOf(idx, target.line), {k: idx, v: value}); return; }
      if (typeof obj === 'string') perr('TypeError', "'str' object does not support item assignment", target.line);
      if (obj && obj.t === 'tuple') perr('TypeError', "'tuple' object does not support item assignment", target.line);
      perr('TypeError', "'" + pyTypeName(obj) + "' object does not support item assignment", target.line);
    }
    case 'Attr': {
      const obj = this.evalExpr(target.obj, env);
      if (obj && obj.t === 'inst'){ obj.attrs.set(target.attr, value); return; }
      perr('AttributeError', "'" + pyTypeName(obj) + "' object has no attribute '" + target.attr + "'", target.line);
    }
  }
  perr('SyntaxError','cannot assign to this expression', target.line);
};

Interpreter.prototype.evalTarget = function(target, env){
  return this.evalExpr(target, env);
};

Interpreter.prototype.normIndex = function(idx, len, line){
  if (!isNum(idx) || idx.f) perr('TypeError','indices must be integers', line);
  let i = idx.v;
  if (i < 0) i += len;
  if (i < 0 || i >= len) perr('IndexError','index out of range', line);
  return i;
};

Interpreter.prototype.binop = function(op, a, b, line){
  a = pyBoolAsNum(a); b = pyBoolAsNum(b);
  if (op === '+'){
    if (isNum(a) && isNum(b)) return PyNum(a.v + b.v, a.f || b.f);
    if (typeof a === 'string' && typeof b === 'string') return a + b;
    if (Array.isArray(a) && Array.isArray(b)) return a.concat(b);
    if (a && b && a.t==='tuple' && b.t==='tuple') return mkTuple(a.items.concat(b.items));
    if (typeof a === 'string' || typeof b === 'string')
      perr('TypeError', 'can only concatenate str (not "' + pyTypeName(typeof a==='string'?b:a) + '") to str', line);
    perr('TypeError', "unsupported operand type(s) for +: '" + pyTypeName(a) + "' and '" + pyTypeName(b) + "'", line);
  }
  if (op === '*'){
    if (isNum(a) && isNum(b)) return PyNum(a.v * b.v, a.f || b.f);
    const rep = (s, n) => { if (n.f) perr('TypeError',"can't multiply sequence by non-int of type 'float'", line); let out = typeof s==='string' ? '' : []; for (let i=0;i<n.v;i++) out = typeof s==='string' ? out + s : out.concat(s); return out; };
    if (typeof a === 'string' && isNum(b)) return rep(a,b);
    if (typeof b === 'string' && isNum(a)) return rep(b,a);
    if (Array.isArray(a) && isNum(b)) return rep(a,b);
    if (Array.isArray(b) && isNum(a)) return rep(b,a);
    perr('TypeError', "can't multiply sequence by non-int of type '" + pyTypeName(isNum(a)?b:a) + "'", line);
  }
  if (['-','/','//','%','**'].includes(op)){
    if (!isNum(a) || !isNum(b))
      perr('TypeError', "unsupported operand type(s) for " + op + ": '" + pyTypeName(a) + "' and '" + pyTypeName(b) + "'", line);
    if (op === '-') return PyNum(a.v - b.v, a.f || b.f);
    if (op === '/'){ if (b.v === 0) perr('ZeroDivisionError','division by zero', line); return PyNum(a.v / b.v, true); }
    if (op === '//'){
      if (b.v === 0) perr('ZeroDivisionError', a.f||b.f ? 'float floor division by zero':'integer division or modulo by zero', line);
      return PyNum(Math.floor(a.v / b.v), a.f || b.f);
    }
    if (op === '%'){
      if (b.v === 0) perr('ZeroDivisionError', a.f||b.f ? 'float modulo':'integer division or modulo by zero', line);
      const m = a.v - Math.floor(a.v / b.v) * b.v;
      return PyNum(m, a.f || b.f);
    }
    if (op === '**') return PyNum(Math.pow(a.v, b.v), a.f || b.f || (b.v < 0));
  }
  perr('SyntaxError','unknown operator ' + op, line);
};

Interpreter.prototype.evalExpr = function(node, env){
  this.tick(node.line);
  switch(node.type){
    case 'Num': return PyNum(node.v, node.f);
    case 'Str': return node.isF ? this.evalFString(node.v, env, node.line) : node.v;
    case 'Const': return node.v;
    case 'Name': {
      // exception names resolve to excval factories
      const EXC = ['ValueError','TypeError','NameError','IndexError','KeyError','ZeroDivisionError','FileNotFoundError','Exception','RuntimeError','AttributeError'];
      if (!env.has(node.name) && EXC.includes(node.name)){
        const nm = node.name;
        return {t:'builtin', name:nm, isExc:true, fn:(a)=>({t:'excval', name:nm, msg: a.length ? (typeof a[0]==='string'? a[0] : pyRepr(a[0])) : ''})};
      }
      return env.get(node.name, node.line);
    }
    case 'List': return node.items.map(it=>this.evalExpr(it, env));
    case 'Tuple': return mkTuple(node.items.map(it=>this.evalExpr(it, env)));
    case 'TupleExpr': return mkTuple(node.items.map(it=>this.evalExpr(it, env)));
    case 'SetLit': { const s = mkSet(); for (const it of node.items){ const v = this.evalExpr(it, env); s.m.set(keyOf(v, node.line), {k:v}); } return s; }
    case 'Dict': { const d = mkDict(); for (const p of node.pairs){ const k = this.evalExpr(p.k, env); d.m.set(keyOf(k, node.line), {k, v: this.evalExpr(p.v, env)}); } return d; }
    case 'ListComp': {
      const out = [];
      const items = this.iterToArray(this.evalExpr(node.iter, env), node.line);
      const inner = new Env(env);
      for (const item of items){
        this.tick(node.line);
        this.bindTargets(node.targets, item, inner, node.line);
        if (node.cond && !truthy(this.evalExpr(node.cond, inner))) continue;
        out.push(this.evalExpr(node.expr, inner));
      }
      return out;
    }
    case 'BoolOp': {
      const l = this.evalExpr(node.left, env);
      if (node.op === 'and') return truthy(l) ? this.evalExpr(node.right, env) : l;
      return truthy(l) ? l : this.evalExpr(node.right, env);
    }
    case 'UnaryOp': {
      const v = this.evalExpr(node.operand, env);
      if (node.op === 'not') return !truthy(v);
      const n = pyBoolAsNum(v);
      if (!isNum(n)) perr('TypeError', "bad operand type for unary -: '" + pyTypeName(v) + "'", node.line);
      return PyNum(-n.v, n.f);
    }
    case 'BinOp': return this.binop(node.op, this.evalExpr(node.left, env), this.evalExpr(node.right, env), node.line);
    case 'Compare': {
      let left = this.evalExpr(node.left, env);
      for (let i=0;i<node.ops.length;i++){
        const right = this.evalExpr(node.rights[i], env);
        const op = node.ops[i];
        let ok;
        if (op === '==') ok = pyEq(left, right);
        else if (op === '!=') ok = !pyEq(left, right);
        else if (op === 'in') ok = this.contains(right, left, node.line);
        else if (op === 'not in') ok = !this.contains(right, left, node.line);
        else {
          const c = pyCmp(left, right, node.line);
          ok = op === '<' ? c < 0 : op === '>' ? c > 0 : op === '<=' ? c <= 0 : c >= 0;
        }
        if (!ok) return false;
        left = right;
      }
      return true;
    }
    case 'IfExp': return truthy(this.evalExpr(node.test, env)) ? this.evalExpr(node.body, env) : this.evalExpr(node.orelse, env);
    case 'Lambda': return {t:'func', name:'<lambda>', params: node.params, defaults: [], body: [{type:'Return', arg: node.body, line: node.line}], env};
    case 'Call': {
      const fn = this.evalExpr(node.func, env);
      const args = node.args.map(a=>this.evalExpr(a, env));
      const kwargs = node.kwargs.map(kw=>({name: kw.name, v: this.evalExpr(kw.expr, env)}));
      return this.callFunction(fn, args, kwargs, node.line);
    }
    case 'Index': {
      const obj = this.evalExpr(node.obj, env);
      const idx = this.evalExpr(node.index, env);
      if (typeof obj === 'string') return obj[this.normIndex(idx, obj.length, node.line)];
      if (Array.isArray(obj)) return obj[this.normIndex(idx, obj.length, node.line)];
      if (obj && obj.t === 'tuple') return obj.items[this.normIndex(idx, obj.items.length, node.line)];
      if (obj && obj.t === 'dict'){
        const k = keyOf(idx, node.line);
        if (!obj.m.has(k)) perr('KeyError', pyRepr(idx), node.line);
        return obj.m.get(k).v;
      }
      if (obj && obj.t === 'range'){ const arr = this.iterToArray(obj, node.line); return arr[this.normIndex(idx, arr.length, node.line)]; }
      perr('TypeError', "'" + pyTypeName(obj) + "' object is not subscriptable", node.line);
    }
    case 'Slice': {
      const obj = this.evalExpr(node.obj, env);
      const seq = typeof obj === 'string' ? obj : Array.isArray(obj) ? obj : (obj && obj.t==='tuple') ? obj.items : null;
      if (seq === null) perr('TypeError', "'" + pyTypeName(obj) + "' object is not subscriptable", node.line);
      const len = seq.length;
      let lo = node.lo ? this.evalExpr(node.lo, env).v : 0;
      let hi = node.hi ? this.evalExpr(node.hi, env).v : len;
      if (lo < 0) lo += len; if (hi < 0) hi += len;
      lo = Math.max(0, Math.min(len, lo)); hi = Math.max(0, Math.min(len, hi));
      const sliced = typeof obj === 'string' ? obj.slice(lo, hi) : seq.slice(lo, hi);
      if (obj && obj.t === 'tuple') return mkTuple(sliced);
      return sliced;
    }
    case 'Attr': {
      const obj = this.evalExpr(node.obj, env);
      return this.getAttr(obj, node.attr, node.line);
    }
  }
  perr('RuntimeError','unknown expression ' + node.type, node.line);
};

Interpreter.prototype.contains = function(container, item, line){
  if (typeof container === 'string'){
    if (typeof item !== 'string') perr('TypeError', "'in <string>' requires string as left operand, not " + pyTypeName(item), line);
    return container.includes(item);
  }
  if (Array.isArray(container)) return container.some(x=>pyEq(x,item));
  if (container && container.t==='tuple') return container.items.some(x=>pyEq(x,item));
  if (container && (container.t==='dict'||container.t==='set')) return container.m.has(keyOf(item, line));
  if (container && container.t==='range') return this.iterToArray(container, line).some(x=>pyEq(x,item));
  perr('TypeError', "argument of type '" + pyTypeName(container) + "' is not iterable", line);
};

Interpreter.prototype.evalFString = function(raw, env, line){
  let out = '', i = 0;
  while (i < raw.length){
    const c = raw[i];
    if (c === '{'){
      if (raw[i+1] === '{'){ out += '{'; i += 2; continue; }
      let depth = 1, j = i+1;
      while (j < raw.length && depth > 0){ if (raw[j]==='{') depth++; if (raw[j]==='}') depth--; j++; }
      if (depth !== 0) perr('SyntaxError', "f-string: expecting '}'", line);
      let inner = raw.slice(i+1, j-1);
      let spec = null;
      const specMatch = inner.match(/^(.*?):(\.\d+f)$/);
      if (specMatch){ inner = specMatch[1]; spec = specMatch[2]; }
      else if (/:[^=]/.test(inner) && !inner.includes('(')) {
        const idx = inner.lastIndexOf(':');
        perr('SyntaxError', 'f-string format spec "' + inner.slice(idx) + '" is not supported in this simulator (only :.Nf)', line);
      }
      const tokens = tokenize(inner);
      // strip trailing NEWLINE/EOF handled by parse of a single expr:
      const ast = parse(tokens);
      if (!ast.body.length || ast.body[0].type !== 'ExprStmt') perr('SyntaxError','invalid expression in f-string', line);
      let v = this.evalExpr(ast.body[0].expr, env);
      if (spec){
        const nd = parseInt(spec.slice(1,-1), 10);
        const n = pyBoolAsNum(v);
        if (!isNum(n)) perr('ValueError','Unknown format code f for object of type ' + pyTypeName(v), line);
        out += n.v.toFixed(nd);
      } else out += this.toStr(v, line);
      i = j; continue;
    }
    if (c === '}'){
      if (raw[i+1] === '}'){ out += '}'; i += 2; continue; }
      perr('SyntaxError', "f-string: single '}' is not allowed", line);
    }
    out += c; i++;
  }
  return out;
};

Interpreter.prototype.getAttr = function(obj, attr, line){
  const self = this;
  const method = (name, fn) => ({t:'builtin', name, fn});
  if (typeof obj === 'string'){
    const s = obj;
    const strMethods = {
      upper: () => s.toUpperCase(), lower: () => s.toLowerCase(),
      title: () => s.replace(/\b[a-z]/g, ch=>ch.toUpperCase()),
      capitalize: () => s.length ? s[0].toUpperCase() + s.slice(1).toLowerCase() : s,
      strip: (a) => a.length ? trimChars(s, a[0], true, true) : s.trim(),
      lstrip: (a) => a.length ? trimChars(s, a[0], true, false) : s.replace(/^\s+/,''),
      rstrip: (a) => a.length ? trimChars(s, a[0], false, true) : s.replace(/\s+$/,''),
      split: (a) => a.length ? s.split(a[0]) : s.split(/\s+/).filter(x=>x.length),
      join: (a, k, l) => self.iterToArray(a[0], l).map(x => { if (typeof x !== 'string') perr('TypeError','sequence item: expected str instance, ' + pyTypeName(x) + ' found', l); return x; }).join(s),
      replace: (a) => s.split(a[0]).join(a[1]),
      find: (a) => PyNum(s.indexOf(a[0])),
      count: (a) => PyNum(a[0].length === 0 ? s.length+1 : s.split(a[0]).length - 1),
      startswith: (a) => s.startsWith(a[0]),
      endswith: (a) => s.endsWith(a[0]),
      isdigit: () => s.length > 0 && /^[0-9]+$/.test(s),
      isalpha: () => s.length > 0 && /^[A-Za-z]+$/.test(s),
      index: (a,k,l) => { const i = s.indexOf(a[0]); if (i<0) perr('ValueError','substring not found', l); return PyNum(i); },
    };
    if (strMethods[attr]) return method('str.'+attr, (a,k,l)=>strMethods[attr](a,k,l));
    perr('AttributeError', "'str' object has no attribute '" + attr + "'", line);
  }
  if (Array.isArray(obj)){
    const L = obj;
    const listMethods = {
      append: (a) => { L.push(a[0]); return null; },
      pop: (a,k,l) => { if (!L.length) perr('IndexError','pop from empty list', l); const i = a.length ? self.normIndex(a[0], L.length, l) : L.length-1; return L.splice(i,1)[0]; },
      insert: (a) => { let i = a[0].v; if (i<0) i = Math.max(0, L.length+i); L.splice(Math.min(i, L.length), 0, a[1]); return null; },
      remove: (a,k,l) => { const i = L.findIndex(x=>pyEq(x,a[0])); if (i<0) perr('ValueError','list.remove(x): x not in list', l); L.splice(i,1); return null; },
      sort: (a,k,l) => { let rev=false, keyFn=null; for (const kw of k){ if(kw.name==='reverse') rev = truthy(kw.v); if (kw.name==='key') keyFn = kw.v; } const cv = keyFn ? (x)=>self.callFunction(keyFn,[x],[],l) : (x)=>x; L.sort((x,y)=>pyCmp(cv(x),cv(y),l)); if (rev) L.reverse(); return null; },
      reverse: () => { L.reverse(); return null; },
      index: (a,k,l) => { const i = L.findIndex(x=>pyEq(x,a[0])); if (i<0) perr('ValueError', pyRepr(a[0]) + ' is not in list', l); return PyNum(i); },
      count: (a) => PyNum(L.filter(x=>pyEq(x,a[0])).length),
      extend: (a,k,l) => { for (const v of self.iterToArray(a[0], l)) L.push(v); return null; },
      clear: () => { L.length = 0; return null; },
      copy: () => L.slice(),
    };
    if (listMethods[attr]) return method('list.'+attr, (a,k,l)=>listMethods[attr](a,k,l));
    perr('AttributeError', "'list' object has no attribute '" + attr + "'", line);
  }
  if (obj && obj.t === 'dict'){
    const D = obj;
    const dictMethods = {
      get: (a) => { const k = keyOf(a[0], line); return D.m.has(k) ? D.m.get(k).v : (a.length>1 ? a[1] : null); },
      keys: () => [...D.m.values()].map(e=>e.k),
      values: () => [...D.m.values()].map(e=>e.v),
      items: () => [...D.m.values()].map(e=>mkTuple([e.k, e.v])),
      pop: (a,k2,l) => { const k = keyOf(a[0], l); if (!D.m.has(k)){ if (a.length>1) return a[1]; perr('KeyError', pyRepr(a[0]), l); } const v = D.m.get(k).v; D.m.delete(k); return v; },
      update: (a) => { if (a.length && a[0].t==='dict') for (const [k,e] of a[0].m) D.m.set(k, e); return null; },
      clear: () => { D.m.clear(); return null; },
      copy: () => { const d = mkDict(); for (const [k,e] of D.m) d.m.set(k, {k:e.k, v:e.v}); return d; },
    };
    if (dictMethods[attr]) return method('dict.'+attr, (a,k,l)=>dictMethods[attr](a,k,l));
    perr('AttributeError', "'dict' object has no attribute '" + attr + "'", line);
  }
  if (obj && obj.t === 'set'){
    const S = obj;
    const setMethods = {
      add: (a,k,l) => { S.m.set(keyOf(a[0],l), {k:a[0]}); return null; },
      remove: (a,k,l) => { const key = keyOf(a[0],l); if (!S.m.has(key)) perr('KeyError', pyRepr(a[0]), l); S.m.delete(key); return null; },
      discard: (a,k,l) => { S.m.delete(keyOf(a[0],l)); return null; },
      union: (a,k,l) => { const s2 = mkSet(); for (const [key,e] of S.m) s2.m.set(key, e); for (const v of self.iterToArray(a[0],l)) s2.m.set(keyOf(v,l),{k:v}); return s2; },
      intersection: (a,k,l) => { const s2 = mkSet(); const other = new Set(self.iterToArray(a[0],l).map(v=>keyOf(v,l))); for (const [key,e] of S.m) if (other.has(key)) s2.m.set(key,e); return s2; },
      difference: (a,k,l) => { const s2 = mkSet(); const other = new Set(self.iterToArray(a[0],l).map(v=>keyOf(v,l))); for (const [key,e] of S.m) if (!other.has(key)) s2.m.set(key,e); return s2; },
    };
    if (setMethods[attr]) return method('set.'+attr, (a,k,l)=>setMethods[attr](a,k,l));
    perr('AttributeError', "'set' object has no attribute '" + attr + "'", line);
  }
  if (obj && obj.t === 'file'){
    const F = obj;
    const check = (l) => { if (F.closed) perr('ValueError','I/O operation on closed file.', l); };
    const fileMethods = {
      read: (a,k,l) => { check(l); if (!F.mode.includes('r')) perr('UnsupportedOperation','not readable', l); const r = F.buf.slice(F.pos); F.pos = F.buf.length; return r; },
      readline: (a,k,l) => { check(l); const nl = F.buf.indexOf('\n', F.pos); const end = nl<0 ? F.buf.length : nl+1; const r = F.buf.slice(F.pos, end); F.pos = end; return r; },
      readlines: (a,k,l) => { check(l); const r = F.buf.slice(F.pos); F.pos = F.buf.length; const lines = r.split('\n'); if (lines[lines.length-1]==='') lines.pop(); return lines.map((x,i,arr)=> x + (i<arr.length-1 || r.endsWith('\n') ? '\n':'')); },
      write: (a,k,l) => { check(l); if (!F.mode.includes('w') && !F.mode.includes('a')) perr('UnsupportedOperation','not writable', l); F.buf += a[0]; return PyNum(a[0].length); },
      close: (a,k,l) => { self.closeFile(F); return null; },
    };
    if (fileMethods[attr]) return method('file.'+attr, (a,k,l)=>fileMethods[attr](a,k,l));
    perr('AttributeError', "'_io.TextIOWrapper' object has no attribute '" + attr + "'", line);
  }
  if (obj && obj.t === 'module'){
    if (obj.attrs.has(attr)) return obj.attrs.get(attr);
    perr('AttributeError', "module '" + obj.name + "' has no attribute '" + attr + "'", line);
  }
  if (obj && obj.t === 'inst'){
    if (obj.attrs.has(attr)) return obj.attrs.get(attr);
    const m = findMethod(obj.cls, attr);
    if (m){
      if (m.t === 'classattr') return m.v;
      return {t:'bound', self: obj, fn: m};
    }
    perr('AttributeError', "'" + obj.cls.name + "' object has no attribute '" + attr + "'", line);
  }
  if (obj && obj.t === 'class'){
    const m = findMethod(obj, attr);
    if (m){ if (m.t === 'classattr') return m.v; return m; }
    perr('AttributeError', "type object '" + obj.name + "' has no attribute '" + attr + "'", line);
  }
  perr('AttributeError', "'" + pyTypeName(obj) + "' object has no attribute '" + attr + "'", line);
};

function trimChars(s, chars, left, right){
  let lo = 0, hi = s.length;
  if (left) while (lo < hi && chars.includes(s[lo])) lo++;
  if (right) while (hi > lo && chars.includes(s[hi-1])) hi--;
  return s.slice(lo, hi);
}

Interpreter.prototype.callFunction = function(fn, args, kwargs, line){
  this.tick(line);
  if (!fn) perr('TypeError', "'NoneType' object is not callable", line);
  if (fn.t === 'builtin') return fn.fn(args, kwargs, line) ?? null;
  if (fn.t === 'class'){
    const inst = {t:'inst', cls: fn, attrs: new Map()};
    const init = findMethod(fn, '__init__');
    if (init) this.callFunction({t:'bound', self: inst, fn: init}, args, kwargs, line);
    else if (args.length || kwargs.length) perr('TypeError', fn.name + '() takes no arguments', line);
    return inst;
  }
  let selfArg = null, f = fn;
  if (fn.t === 'bound'){ selfArg = fn.self; f = fn.fn; }
  if (f.t !== 'func') perr('TypeError', "'" + pyTypeName(fn) + "' object is not callable", line);
  const callEnv = new Env(f.env);
  const params = f.params.slice();
  const provided = new Map();
  if (selfArg !== null){
    if (!params.length) perr('TypeError', f.name + '() takes 0 positional arguments but 1 was given', line);
    provided.set(params[0], selfArg);
  }
  let pi = selfArg !== null ? 1 : 0;
  for (const a of args){
    if (pi >= params.length) perr('TypeError', f.name + '() takes ' + params.length + ' positional argument' + (params.length===1?'':'s') + ' but ' + (args.length + (selfArg!==null?1:0)) + (args.length+(selfArg!==null?1:0)===1?' was':' were') + ' given', line);
    provided.set(params[pi++], a);
  }
  for (const kw of kwargs){
    if (!params.includes(kw.name)) perr('TypeError', f.name + "() got an unexpected keyword argument '" + kw.name + "'", line);
    if (provided.has(kw.name)) perr('TypeError', f.name + "() got multiple values for argument '" + kw.name + "'", line);
    provided.set(kw.name, kw.v);
  }
  for (const d of f.defaults) if (!provided.has(d.name)) provided.set(d.name, d.v);
  for (const p of params) if (!provided.has(p))
    perr('TypeError', f.name + "() missing 1 required positional argument: '" + p + "'", line);
  for (const [k,v] of provided) callEnv.set(k, v);
  try {
    this.execBlock(f.body, callEnv);
  } catch (e){
    if (e instanceof ReturnSignal) return e.v;
    throw e;
  }
  return null;
};

/* public API */
function runPython(src, opts){
  const interp = new Interpreter(opts || {});
  const result = { output: '', error: null, files: null };
  try {
    interp.run(src, opts && opts.repl);
  } catch (e){
    if (e instanceof PyError){
      result.error = { type: e.pyType, msg: e.pyMsg, line: e.line };
      const tb = 'Traceback (most recent call last):\n  Line ' + (e.line || '?') + '\n' + e.pyType + ': ' + e.pyMsg;
      interp.write(tb + '\n');
    } else {
      result.error = { type: 'InternalError', msg: String(e.message || e), line: 0 };
      interp.write('InternalError: ' + (e.message || e) + '\n');
    }
  }
  result.output = interp.out.join('');
  result.files = Object.fromEntries(interp.vfs);
  return result;
}

/* ================= 2. SM-2 ================= */
function sm2Init(){ return { reps: 0, interval: 0, ef: 2.5, due: 0 }; }
function sm2Review(card, quality, now){
  // quality: 0..5. now: epoch ms.
  const c = { ...card };
  if (quality < 3){
    c.reps = 0; c.interval = 0;
    c.due = now + 60 * 1000; // relearn within the session
  } else {
    if (c.reps === 0) c.interval = 1;
    else if (c.reps === 1) c.interval = 6;
    else c.interval = Math.round(c.interval * c.ef);
    c.reps += 1;
    c.due = now + c.interval * 24 * 3600 * 1000;
  }
  c.ef = Math.max(1.3, c.ef + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02)));
  return c;
}

/* ================= 3. Coach FSM ================= */
/*
 States: idle → narrating → checkpoint → (gotit → quiz → result → idle-next) | (confused → altNarrating → checkpoint2 → quiz ...)
 Events: PLAY, PAUSE, RESUME, REPEAT, SEG_DONE, GOT_IT, CONFUSED, ALT_DONE, ANSWER(correct), NEXT, STOP, SKIP
*/
function coachInit(){
  return { state:'idle', chapter: null, seg: 0, usedAlt: false, lastAnswerCorrect: null, paused: false };
}
function coachReduce(s, ev){
  const c = { ...s };
  switch (ev.type){
    case 'PLAY':
      return { state:'narrating', chapter: ev.chapter, seg: 0, usedAlt: false, lastAnswerCorrect: null, paused: false };
    case 'PAUSE':
      if (c.state === 'narrating' || c.state === 'altNarrating') c.paused = true;
      return c;
    case 'RESUME':
      c.paused = false; return c;
    case 'REPEAT':
      if (c.state === 'narrating' || c.state === 'checkpoint'){ c.state = 'narrating'; c.paused = false; }
      if (c.state === 'altNarrating') c.paused = false;
      return c;
    case 'SEG_DONE':
      // A checkpoint follows EVERY narrated section (frequent mode).
      if (c.state === 'narrating'){ c.state = 'checkpoint'; }
      return c;
    case 'ALT_DONE':
      if (c.state === 'altNarrating'){ c.state = 'checkpoint'; }
      return c;
    case 'GOT_IT':
      if (c.state === 'checkpoint'){
        if (ev.hasMoreSegs){ c.state = 'narrating'; c.seg += 1; c.usedAlt = false; }
        else c.state = 'quiz';
      }
      return c;
    case 'CONFUSED':
      if (c.state === 'checkpoint'){ c.state = 'altNarrating'; c.usedAlt = true; }
      return c;
    case 'ANSWER':
      if (c.state === 'quiz'){ c.state = 'result'; c.lastAnswerCorrect = !!ev.correct; }
      return c;
    case 'NEXT':
      if (c.state === 'result' || c.state === 'checkpoint'){ 
        if (ev.hasMoreSegs){ c.state='narrating'; c.seg += 1; c.usedAlt = false; c.lastAnswerCorrect = null; }
        else c.state = 'idle';
      }
      return c;
    case 'SKIP':
      if (ev.hasMoreSegs){ c.state='narrating'; c.seg += 1; c.usedAlt=false; c.lastAnswerCorrect=null; c.paused=false; }
      else { c.state='idle'; }
      return c;
    case 'STOP':
      return coachInit();
  }
  return c;
}

/* ================= 5. Util ================= */
function seededRng(seed){
  let s = seed >>> 0;
  return function(){ s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}
function seededShuffle(arr, seed){
  const rng = seededRng(seed);
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
/* Shuffle a question's options deterministically; returns {options, correctIndex} */
function shuffleQuestion(q, seed){
  const idxs = seededShuffle(q.options.map((_,i)=>i), seed);
  return { options: idxs.map(i=>q.options[i]), correctIndex: idxs.indexOf(q.correct) };
}
/* Analysis helpers used by tests to catch answer-position/length tells */
function positionSpread(questions, seedBase){
  const counts = {};
  questions.forEach((q, qi) => {
    const s = shuffleQuestion(q, seedBase + qi * 7919);
    counts[s.correctIndex] = (counts[s.correctIndex] || 0) + 1;
  });
  return counts;
}
function longestAnswerBias(questions){
  let longestIsCorrect = 0;
  for (const q of questions){
    const lens = q.options.map(o=>o.length);
    const maxLen = Math.max(...lens);
    if (q.options[q.correct].length === maxLen && lens.filter(l=>l===maxLen).length === 1) longestIsCorrect++;
  }
  return longestIsCorrect / questions.length;
}

 {id:'definition', label:'The Definition', kind:'definition',
  html:'<p><strong>String (<code>str</code>):</strong> an immutable ordered sequence of characters, written between quotes (<code>"hi"</code> or <code>\'hi\'</code>).</p><p><strong>Index:</strong> a character\u2019s position, from 0. <code>s[0]</code> is the first character, <code>s[-1]</code> the last. <strong>Slice:</strong> <code>s[1:4]</code> copies positions 1, 2, 3 (the end is excluded). <strong>Immutable</strong> means the string itself never changes after creation.</p>',
  voice:'Formally: a string is an immutable ordered sequence of characters between quotes. Indexing starts at zero; minus one reaches the last character. A slice like s from one to four copies positions one, two, and three — the end position is excluded. Immutable means the string itself never changes after it is created.',
  alt:{html:'<p>The slice rule in one line: <code>s[start:stop]</code> means "from bead <em>start</em>, up to but <strong>not including</strong> bead <em>stop</em>". Like a hotel stay: check-in day 1, check-out day 4 — you slept nights 1, 2, 3.</p>',
       voice:'One more way to hold the slice rule. Start colon stop means from the start bead, up to but not including the stop bead. Like a hotel: check in day one, check out day four — you actually slept nights one, two, and three.'}},
 {id:'syntax', label:'The Syntax', kind:'syntax',
  code:'word = "Python"\nprint(word[0], word[-1])      # P n\nprint(word[0:3])              # Pyt\nprint(len(word))              # 6\ngreet = "Hello, " + word + "!"\nprint(greet.upper())\nprint(greet.replace("Hello", "Namaste"))\nfav = "snakes"\nprint(f"I study {word} and like {fav}.")',
  html:'<p>Index with <code>[ ]</code>, measure with <code>len()</code>, join with <code>+</code>. Methods like <code>.upper()</code> and <code>.replace()</code> return <em>new</em> strings — the original is untouched. An <strong>f-string</strong> (<code>f"..."</code>) lets you drop variables straight into text with <code>{braces}</code>: the cleanest way to build messages.</p>',
  voice:'Square brackets pick a bead, len measures the thread, plus couples strings together. Methods like upper and replace hand you a brand new string; the original stays intact. And notice the f string on the last line: put an f before the quote, and anything in curly braces is filled in from your variables. It is the cleanest way to build messages.',
  alt:{html:'<p>Why did <code>greet</code> not change after <code>.upper()</code>? Because methods on a sealed thread can only hand you a <em>copy</em> with the change applied. If you want to keep the shouty version: <code>loud = greet.upper()</code>.</p>',
       voice:'Wondering why greet itself did not change after calling upper? Because on a sealed thread, a method can only hand you a modified copy. If you want to keep the shouty version, store it: loud equals greet dot upper.'}},
 {id:'realworld', label:'In the Real World', kind:'realworld',
  html:'<p>Strings are everywhere data meets humans: usernames, chat messages, file names, URLs. Form validation ("does this email contain an @?"), search ("find <em>invoice</em> in this text"), and every notification your phone shows are string operations.</p>',
  voice:'Strings appear wherever software meets humans: usernames, messages, file names, web addresses. Checking that an email contains an at sign, searching a document, building a notification — all string operations, using exactly the tools you just met.',
  alt:{html:'<p>Concrete case: when a site greets you "Welcome back, Priya!", that\u2019s an f-string with your stored name dropped into a template. You now know precisely how that line of code looks.</p>',
       voice:'A concrete case. When a website greets you, welcome back Priya, that is an f string: a template with your stored name dropped into the braces. You now know exactly what that code looks like.'}}],
quiz:[
 {id:'strings-q1', prompt:'For  s = "workshop" , what is  s[0] ?', options:[
   '"o", because counting starts at one',
   '"p", the final character of it',
   '"w", because indexing starts at zero',
   'The whole word, since 0 means all'], correct:2,
  explain:'Index 0 is always the first character: the beads are numbered from zero.'},
 {id:'strings-q2', prompt:'What does  "abcdef"[1:4]  give?', options:[
   '"bcd" — start included, end excluded',
   '"bcde" — both the start and end are included',
   '"abcd" — the first four letters',
   '"cd" — strictly between the two'], correct:0,
  explain:'A slice runs from the start index up to but not including the stop index: positions 1, 2, 3.'},
 {id:'strings-q3', prompt:'After  t = "hi".upper() , what is true?', options:[
   'The string "hi" itself became "HI"',
   't is "HI" and "hi" is unchanged',
   'Both t and "hi" are still lowercase',
   'An error: strings have no methods'], correct:1,
