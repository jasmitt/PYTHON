{ id:'modules', station:14, title:'Modules — Borrowed Toolboxes', advanced:false,
svg:'<svg viewBox="0 0 120 90" role="img" aria-label="Toolbox emblem"><rect x="24" y="38" width="72" height="36" rx="5" fill="var(--panel2)" stroke="var(--brass)" stroke-width="2"/><path d="M44 38 L44 30 Q44 24 50 24 L70 24 Q76 24 76 30 L76 38" fill="none" stroke="var(--brass)" stroke-width="3"/><rect x="24" y="50" width="72" height="4" fill="var(--brass)" opacity="0.5"/><text x="38" y="68" font-family="monospace" font-size="10" fill="var(--py-blue)">math</text><circle cx="86" cy="66" r="5" fill="var(--py-gold)"/></svg>',
sections:[
 {id:'analogy', label:'The Analogy', kind:'analogy',
  html:'<p>A module is a <strong>specialist\u2019s toolbox</strong> you carry to your bench. Your workshop doesn\u2019t forge every tool from scratch: need trig, roots, and π? Borrow the <code>math</code> toolbox. <code>import math</code> carries it over; <code>math.sqrt(16)</code> reaches in — <em>toolbox dot tool</em>.</p>',
  voice:'A module is a specialist\u2019s toolbox that you carry over to your bench. You do not forge every tool from scratch. Need roots and pi? Borrow the math toolbox: import math carries it over, and math dot square root reaches inside. Toolbox, dot, tool.',
  alt:{html:'<p>Different picture: <strong>calling in a consultant</strong>. <code>import math</code> is the consultant walking in; <code>math.floor(3.7)</code> is asking them, by name, to apply a skill. The prefix isn\u2019t bureaucracy — it tells every reader exactly whose expertise each call uses.</p>',
       voice:'Or think of calling in a consultant. Import math is the consultant walking in. Math dot floor is asking them by name to apply a skill. The prefix is not bureaucracy. It tells every reader exactly whose expertise each call uses.'}},
 {id:'definition', label:'The Definition', kind:'definition',
  html:'<p><strong>Module:</strong> a file of reusable Python — functions, constants, classes — brought into your program with <code>import</code>.</p><p>After <code>import math</code>, access members with the prefix: <code>math.pi</code>, <code>math.sqrt(x)</code>, <code>math.floor(x)</code>, <code>math.ceil(x)</code>. Python ships a large <em>standard library</em> of such toolboxes; beyond it, hundreds of thousands of community toolboxes are an install away.</p>',
  voice:'Formally: a module is a file of reusable Python — functions, constants, classes — brought in with import. After import math, you access members through the prefix: math dot pi, math dot square root, floor, ceiling. Python ships a large standard library of these toolboxes, and beyond it, hundreds of thousands of community toolboxes are one install away.',
  alt:{html:'<p>Why the ecosystem matters: "Python is popular" mostly means <em>the toolboxes already exist</em>. Web servers, Excel readers, chart painters, AI trainers — your job becomes composing proven toolboxes, not forging every tool alone.</p>',
       voice:'Here is why this matters strategically. When people say Python is popular, they mostly mean the toolboxes already exist. Web servers, spreadsheet readers, chart painters, A I trainers. Your job becomes composing proven toolboxes — not forging every tool alone.'}},
 {id:'syntax', label:'The Syntax', kind:'syntax',
  code:'import math\n\nprint(math.pi)\nprint(math.sqrt(1225))\nprint(math.floor(3.9), math.ceil(3.1))\n\ndef circle_area(radius):\n    return round(math.pi * radius ** 2, 2)\n\nprint(circle_area(5))\nprint(math.pow(2, 8))',
  html:'<p>One import at the top serves the whole file. Note <code>circle_area</code>: your own machine using a borrowed constant — mixing your tools with the toolbox\u2019s is the everyday texture of Python. (This sandbox ships the <code>math</code> toolbox; on a real machine, thousands more await.)</p>',
  voice:'One import at the top of the file serves everything below it. And look at circle area: your own vending machine, using a borrowed constant inside. Mixing your tools with the toolbox\u2019s tools is the everyday texture of Python. This sandbox ships math; a real machine offers thousands more.',
  alt:{html:'<p>Why write <code>math.pi</code> and not just <code>pi</code>? Namespaces: your file might already have a jar named <code>pi</code> (or <code>floor</code>!). The prefix keeps the consultant\u2019s tools in the consultant\u2019s box — no collisions, clear provenance.</p>',
       voice:'Why say math dot pi instead of just pi? Namespaces. Your file might already have its own jar called pi, or floor. The prefix keeps the consultant\u2019s tools in the consultant\u2019s box. No collisions, and every reader sees the provenance.'}},
 {id:'realworld', label:'In the Real World', kind:'realworld',
  html:'<p>Real projects open with a stack of imports: <code>json</code> for data files, <code>datetime</code> for calendars, <code>random</code> for shuffles, and community giants like <code>pandas</code> (spreadsheet-scale data) or <code>flask</code> (websites). Reading a file\u2019s imports is reading its ingredient list.</p>',
  voice:'Open any real project and the first lines are imports. Jason for data. Date time for calendars. Random for shuffles. Community giants like pandas for spreadsheet scale data, or flask for websites. Reading a file\u2019s imports is reading its ingredient list.',
  alt:{html:'<p>That "ingredient list" habit works in reverse too: before building anything substantial, professionals search for the toolbox first. The best line of code is often the one a well-tested module lets you not write.</p>',
       voice:'And the ingredient list habit runs in reverse. Before building anything substantial, professionals search for the toolbox first. The best line of code is often the one a well tested module lets you not write.'}}],
quiz:[
 {id:'modules-q1', prompt:'After  import math , how do you use its square root tool?', options:[
   'sqrt(16), since import unpacks it',
   'math.sqrt(16) — toolbox dot tool',
   'import math.sqrt(16) each time',
   'math("sqrt", 16) with the name'], correct:1,
  explain:'import math brings the toolbox; members are reached with the prefix: math.sqrt, math.pi, math.floor.'},
 {id:'modules-q2', prompt:'What is the standard library?', options:[
   'A physical printed book documenting the Python language',
   'The folder holding your own programs',
   'A paid add-on for professional users',
   'The toolboxes that ship with Python itself'], correct:3,
  explain:'Python ships with many built-in modules (math, json, datetime, random, ...) — the standard library.'},
 {id:'modules-q3', prompt:'Why is the  math.  prefix considered a feature, not noise?', options:[
   'It doubles the execution speed of every single call',
   'Python cannot parse calls without it',
   'It hides the function from other files',
   'It prevents name clashes and shows provenance'], correct:3,
  explain:'Namespacing keeps the toolbox\u2019s names separate from yours and tells readers where each tool came from.'}],
lab:{type:'pylite',
 starter:'import math\n# Fencing a circular kiln yard\nradius = 7.5\n# 1. Compute the circumference (2 * math.pi * radius), rounded to 2 places.\n# 2. Fence panels are 2m: use math.ceil to find how many panels to buy.\n# 3. Print both with clear labels.\nprint(radius)\n',
 hint:'c = round(2 * math.pi * radius, 2); panels = math.ceil(c / 2); print with f-strings.'},
deck:[
 {id:'modules-c1', front:'What does  import math  actually do?', back:'Loads the math toolbox once for the file; you then reach tools with the prefix: math.sqrt, math.pi, math.ceil.'},
 {id:'modules-c2', front:'Why  math.floor  rather than a bare  floor ?', back:'Namespacing: no clashes with your own names, and every reader sees which toolbox the tool came from.'}]},

/* ── Station 15 ──────────────────────────────────────────── */
{ id:'oop', station:15, title:'Classes — The Cookie Cutter', advanced:false,
svg:'<svg viewBox="0 0 120 90" role="img" aria-label="Cookie cutter and cookies emblem"><path d="M40 14 L80 14 L86 34 L74 34 L74 26 L46 26 L46 34 L34 34 Z" fill="var(--brass)" opacity="0.85"/><circle cx="36" cy="58" r="13" fill="var(--py-gold)" stroke="var(--brass)" stroke-width="2"/><circle cx="66" cy="62" r="13" fill="var(--py-gold)" stroke="var(--brass)" stroke-width="2"/><circle cx="94" cy="56" r="13" fill="var(--py-gold)" stroke="var(--brass)" stroke-width="2"/><circle cx="32" cy="55" r="2" fill="#333"/><circle cx="40" cy="61" r="2" fill="#333"/><circle cx="63" cy="59" r="2" fill="#333"/><circle cx="70" cy="66" r="2" fill="#333"/><circle cx="90" cy="53" r="2" fill="#333"/><circle cx="98" cy="59" r="2" fill="#333"/></svg>',
sections:[
 {id:'analogy', label:'The Analogy', kind:'analogy',
  html:'<p>A class is a <strong>cookie cutter</strong>; objects are the <strong>cookies</strong>. The cutter defines the shape every cookie shares — what data each one carries (<strong>attributes</strong>) and what each one can do (<strong>methods</strong>). Stamp it three times, get three separate cookies: same shape, each decorated with its own values.</p>',
  voice:'A class is a cookie cutter, and objects are the cookies. The cutter defines the shape every cookie will share: what data each carries, called attributes, and what each can do, called methods. Stamp the cutter three times and you get three separate cookies. Same shape. Each with its own decorations.',
  alt:{html:'<p>Different picture: an <strong>architect\u2019s blueprint</strong> vs the actual houses. One blueprint (class), many houses built from it (objects). Every house has rooms and a doorbell (same structure), but your paint color and furniture are yours alone (instance data).</p>',
       voice:'Or think blueprint versus houses. One blueprint — the class. Many houses built from it — the objects. Every house has rooms and a doorbell, the shared structure. But your paint color and furniture are yours alone. That is instance data.'}},
 {id:'definition', label:'The Definition', kind:'definition',
  html:'<p><strong>class Name:</strong> defines a new type. <strong>__init__(self, ...)</strong> is the setup method that runs at each stamping (<code>Name(args)</code>), storing data on the new object via <code>self.attr = value</code>.</p><p><strong>self</strong> is <em>this particular cookie</em> — Python passes it automatically. Methods are functions defined in the class whose first parameter is <code>self</code>. <strong>__str__</strong> tells <code>print</code> how to describe the object.</p>',
  voice:'Formally. Class, a name, a colon: a new type. Double underscore init is the setup method that runs at each stamping, storing data onto the new object through self dot attribute. Self simply means this particular cookie, and Python passes it automatically. Methods are functions defined inside the class, first parameter self. And double underscore s t r tells print how to describe your object.',
  alt:{html:'<p><code>self</code> demystified: when you write <code>mug.fill()</code>, Python quietly rewrites it as <code>Mug.fill(mug)</code> — the cookie is handed to its own method as <code>self</code>. That\u2019s the entire trick; no magic remains.</p>',
       voice:'Let me fully demystify self. When you write mug dot fill, Python quietly rewrites it as: the class\u2019s fill method, called with your mug as the first argument. The cookie is handed to its own method. That is the entire trick. No magic remains.'}},
 {id:'syntax', label:'The Syntax', kind:'syntax',
  code:'class Mug:\n    def __init__(self, owner, size):\n        self.owner = owner\n        self.size = size\n        self.level = 0\n\n    def fill(self):\n        self.level = self.size\n\n    def sip(self, amount):\n        self.level = max(0, self.level - amount)\n\n    def __str__(self):\n        return f"{self.owner}\'s mug: {self.level}/{self.size}ml"\n\na = Mug("Ada", 300)\nb = Mug("Lin", 250)\na.fill()\na.sip(120)\nprint(a)\nprint(b)',
  html:'<p>One cutter, two cookies. Watch the output: filling and sipping <code>a</code> never touches <code>b</code> — each object carries its own <code>level</code>. And <code>print(a)</code> reads beautifully because <code>__str__</code> defined how a Mug describes itself.</p>',
  voice:'One cutter, two cookies. Trace it: Ada\u2019s mug is filled to three hundred, then sipped down by one twenty. Lin\u2019s mug never moves — each object carries its own level. And print of a reads like a sentence, because double underscore s t r taught Mugs to describe themselves.',
  alt:{html:'<p>Why bundle at all? Before classes: <code>owner1, size1, level1, owner2, size2, level2...</code> and functions juggling six loose jars. After: each mug carries its own jars <em>and</em> the verbs that act on them. Data + behavior, shrink-wrapped together — that\u2019s the whole point of OOP.</p>',
       voice:'Why bundle data and behavior at all? Picture life without classes: owner one, size one, level one, owner two, size two — six loose jars and functions juggling all of them. With a class, each mug carries its own jars and its own verbs, shrink wrapped together. That is the entire point of object oriented programming.'}},
 {id:'realworld', label:'In the Real World', kind:'realworld',
  html:'<p>Look around any codebase: <code>User</code>, <code>Order</code>, <code>Invoice</code>, <code>GameCharacter</code> — nouns become classes. Your email app holds thousands of <code>Message</code> objects, each with its own <code>sender</code>, <code>subject</code>, and a <code>.mark_read()</code> method. Even Python\u2019s own strings and lists are classes — you\u2019ve been calling methods on objects since Station 3.</p>',
  voice:'Look around any codebase and the nouns become classes. User. Order. Invoice. Game character. Your email app holds thousands of message objects, each with its own sender and subject and a mark as read method. In fact Python\u2019s own strings and lists are classes. You have been calling methods on objects since station three.',
  alt:{html:'<p>That last point deserves a spotlight: <code>"hi".upper()</code> was <em>always</em> object-oriented Python — a str object, its method, dot syntax. Classes aren\u2019t a new land; they\u2019re the deed to the land you\u2019ve been living on.</p>',
       voice:'Let me spotlight that last point. Quote hi unquote dot upper was always object oriented Python. A string object. Its method. The dot syntax. Classes are not a new land. They are the deed to the land you have been living on all along.'}}],
quiz:[
 {id:'oop-q1', prompt:'Class vs object — which analogy fits?', options:[
   'Class: cookie cutter; object: a stamped cookie',
   'Class: the oven; object: the recipe card',
   'Class: one cookie; object: many cutters',
   'They are simply two different names for the same thing'], correct:0,
  explain:'The class defines the shared shape; each object is one stamped instance with its own attribute values.'},
 {id:'oop-q2', prompt:'What is  self  inside a method?', options:[
   'A keyword that makes methods private',
   'The particular object the method was called on',
   'A copy of the class shared by all objects',
   'The module file in which the class was originally defined'], correct:1,
  explain:'mug.fill() becomes Mug.fill(mug): the object itself arrives as self, so the method can read and write its attributes.'},
 {id:'oop-q3', prompt:'When does  __init__  run?', options:[
   'Once, when Python first reads the class',
   'Every time any method is called',
   'Each time a new object is created',
   'Only when you call it by name'], correct:2,
  explain:'__init__ is the stamping setup: Mug("Ada", 300) creates the object and immediately runs __init__ on it.'}],
lab:{type:'pylite',
 starter:'# Design a Tool class for the workshop\n# 1. class Tool with __init__(self, name, condition) storing both\n#    (condition is 0-100).\n# 2. A method  use(self)  lowering condition by 10 (not below 0).\n# 3. A method  sharpen(self)  restoring condition to 100.\n# 4. __str__ returning f"{self.name} [{self.condition}%]".\n# 5. Make two tools, use one three times, sharpen it, print both.\nprint("forge your class above")\n',
 hint:'self.condition = max(0, self.condition - 10) inside use(). Create t1 = Tool("chisel", 100), call t1.use() thrice, t1.sharpen(), print(t1).'},
deck:[
 {id:'oop-c1', front:'What is  self ?', back:'The particular object a method was called on: mug.fill() is really Mug.fill(mug). It lets methods read/write that object\u2019s attributes.'},
 {id:'oop-c2', front:'What does  __init__  do?', back:'Runs automatically at each object creation, storing starting data via self.attr = value — the stamping setup.'},
 {id:'oop-c3', front:'What is  __str__  for?', back:'Defines the text print() shows for your object — how a cookie describes itself.'}]},

/* ── Station 16 ──────────────────────────────────────────── */
{ id:'inheritance', station:16, title:'Inheritance — Family Traits', advanced:false,
svg:'<svg viewBox="0 0 120 90" role="img" aria-label="Family tree of classes emblem"><rect x="44" y="10" width="32" height="18" rx="4" fill="var(--py-blue)"/><rect x="16" y="56" width="32" height="18" rx="4" fill="var(--py-gold)"/><rect x="72" y="56" width="32" height="18" rx="4" fill="var(--py-gold)"/><path d="M60 28 L60 42 M60 42 L32 42 L32 56 M60 42 L88 42 L88 56" fill="none" stroke="var(--brass)" stroke-width="2"/><text x="49" y="23" font-family="monospace" font-size="9" fill="var(--panel)">Tool</text><text x="21" y="69" font-family="monospace" font-size="8" fill="#333">Saw</text><text x="77" y="69" font-family="monospace" font-size="8" fill="#333">File</text></svg>',
sections:[
 {id:'analogy', label:'The Analogy', kind:'analogy',
  html:'<p>Inheritance is <strong>family traits</strong>. A child class automatically receives everything its parent has — attributes, methods, the lot — then adds its own or does some things its own way. <code>class Dog(Animal)</code> reads: "a Dog is an Animal, plus dog-specific extras." Shared traits live once, in the parent; specialties live in each child.</p>',
  voice:'Inheritance is family traits. A child class automatically receives everything its parent has — the attributes, the methods, all of it — and then adds its own, or does some things its own way. Class Dog, parentheses Animal, reads: a dog is an animal, plus dog specific extras. Shared traits live once, in the parent. Specialties live in each child.',
  alt:{html:'<p>Different picture: a bakery\u2019s <strong>base dough</strong>. One master recipe (parent) defines mixing and proofing; each variant — cinnamon roll, focaccia — <em>starts from it</em> and changes only the finishing steps (overriding). Fix the base recipe once; every variant improves.</p>',
       voice:'Or think of a bakery\u2019s base dough. One master recipe, the parent, defines the mixing and the proofing. Each variant — cinnamon roll, focaccia — starts from it, and changes only the finishing steps. That is overriding. Fix the base recipe once, and every variant improves.'}},
 {id:'definition', label:'The Definition', kind:'definition',
  html:'<p><strong>class Child(Parent):</strong> Child inherits all of Parent\u2019s methods and attributes.</p><p><strong>Override:</strong> redefine a method in the child; the child\u2019s version wins for child objects. A child <code>__init__</code> can invoke the parent\u2019s setup explicitly — <code>Parent.__init__(self, ...)</code> — then add its own attributes. Method lookup: Python checks the object\u2019s own class first, then walks up to the parent. (Full Python also offers <code>super()</code>, a shorthand for reaching the parent.)</p>',
  voice:'Formally. Class Child, parentheses Parent: the child inherits every method and attribute. Overriding means redefining a method in the child, and the child\u2019s version wins for child objects. A child\u2019s init can invoke the parent\u2019s setup explicitly — Parent dot init with self — then add its own attributes. And lookup order: Python checks the object\u2019s own class first, then walks up to the parent. Full Python also offers super, a shorthand for the same reach upward.',
  alt:{html:'<p>Dunder methods (<code>__init__</code>, <code>__str__</code>, and friends) are the family\u2019s <strong>hooks into Python itself</strong>: <code>print(x)</code> secretly asks <code>x.__str__()</code>; <code>len(x)</code> asks <code>__len__</code>. Define them, and your objects plug into built-in machinery like natives.</p>',
       voice:'A word on those double underscore methods — the dunders. They are your family\u2019s hooks into Python itself. Print secretly asks your object\u2019s s t r method. Len asks len. Define the hooks, and your objects plug into Python\u2019s built in machinery like natives.'}},
 {id:'syntax', label:'The Syntax', kind:'syntax',
  code:'class Instrument:\n    def __init__(self, name):\n        self.name = name\n    def tune(self):\n        return self.name + " is tuned"\n    def play(self):\n        return "..."\n\nclass Sitar(Instrument):\n    def __init__(self, name, strings):\n        Instrument.__init__(self, name)\n        self.strings = strings\n    def play(self):                    # override\n        return f"{self.name} rings across {self.strings} strings"\n\ns = Sitar("Ravi\'s sitar", 18)\nprint(s.tune())      # inherited, untouched\nprint(s.play())      # the override wins\nprint(isinstance(s, Instrument))',
  html:'<p>Three behaviors in one demo: <code>tune</code> is pure inheritance (defined only in the parent, works on the child); <code>play</code> is overridden (child\u2019s version wins); and <code>isinstance</code> confirms a Sitar <em>is an</em> Instrument. Note the explicit <code>Instrument.__init__(self, name)</code> — the child borrows the parent\u2019s setup, then adds <code>strings</code>.</p>',
  voice:'Three behaviors in one demo. Tune is pure inheritance: defined only in the parent, yet it works on the child. Play is overridden, so the child\u2019s version wins. And is instance confirms that a sitar is an instrument. Note the explicit call to the parent\u2019s init: the child borrows the parent\u2019s setup, then adds its string count.',
  alt:{html:'<p>When to inherit? Say it aloud: "a Sitar <strong>is an</strong> Instrument" — natural, so inherit. "A Mug <em>is a</em> Kitchen"? Nonsense — a mug is <em>in</em> a kitchen, so the kitchen should <em>contain</em> mugs (an attribute holding a list), not parent them. Is-a → inherit; has-a → attribute.</p>',
       voice:'When should you inherit? Say the sentence aloud. A sitar is an instrument — natural, so inherit. A mug is a kitchen? Nonsense. A mug is in a kitchen, so the kitchen should contain mugs as an attribute, not parent them. Is a: inherit. Has a: attribute.'}},
 {id:'realworld', label:'In the Real World', kind:'realworld',
  html:'<p>Frameworks are built on this handshake: a web framework ships a <code>View</code> parent that handles the plumbing; you subclass it and override one method with your page\u2019s logic. Game engines ship <code>Entity</code>; every character, crate, and cloud inherits movement and drawing for free. You write the difference, not the whole.</p>',
  voice:'Frameworks are built on this handshake. A web framework ships a View parent that handles all the plumbing. You subclass it and override one method with your page\u2019s logic. Game engines ship Entity, and every character, crate, and cloud inherits movement and drawing for free. You write only the difference — never the whole.',
  alt:{html:'<p>That\u2019s the professional contract in one line: <em>the parent does the boring 90%, your override supplies the interesting 10%</em>. Recognizing that pattern is what makes unfamiliar codebases readable.</p>',
       voice:'That is the professional contract in one line. The parent does the boring ninety percent. Your override supplies the interesting ten. Recognizing that pattern is what makes unfamiliar codebases suddenly readable.'}}],
quiz:[
 {id:'inheritance-q1', prompt:'What does  class Saw(Tool):  mean?', options:[
   'Saw and Tool become the same class',
   'Saw inherits Tool\u2019s methods and attributes',
   'Tool gains everything defined on Saw',
   'Saw objects may only ever be created inside Tool methods'], correct:1,
  explain:'Child(Parent) syntax: the child receives all the parent\u2019s traits, then may add or override.'},
 {id:'inheritance-q2', prompt:'A child redefines a method its parent also has. Calls on a child object run...', options:[
   'The child\u2019s version — the override wins',
   'The parent\u2019s version, always first',
   'Both versions run in sequence, parent first then child',
   'Neither; Python reports a conflict'], correct:0,
  explain:'Lookup starts at the object\u2019s own class: the child\u2019s definition shadows the parent\u2019s for child objects.'},
 {id:'inheritance-q3', prompt:'Which relationship justifies inheritance?', options:[
   'A Library HAS Books on its shelves',
   'A Car HAS an Engine inside it',
   'An Ebook IS A Book with a file size',
   'A Kitchen CONTAINS several Mugs'], correct:2,
  explain:'Inherit for is-a relationships. Has-a / contains relationships call for attributes holding other objects.'}],
lab:{type:'pylite',
 starter:'# A small class family\n# 1. class Shape with __init__(self, name) and a method\n#    describe(self) returning f"{self.name} with area {self.area()}".\n# 2. class Square(Shape): __init__(self, side) calling\n#    Shape.__init__(self, "square") and storing side;\n#    plus  def area(self): return self.side * self.side\n# 3. Create Square(6) and print .describe() — inherited method,\n#    child\'s area() found automatically!\nprint("grow your family tree above")\n',
 hint:'describe lives only in Shape yet calls self.area() — defined only in Square. Lookup on the object\u2019s own class makes it work: print(Square(6).describe()).'},
deck:[
 {id:'inheritance-c1', front:'What does a child class receive from its parent?', back:'All methods and attributes automatically. It can add new ones or override existing ones (child\u2019s version wins).'},
 {id:'inheritance-c2', front:'Is-a vs has-a — which one means inherit?', back:'Is-a → inheritance (Ebook is a Book). Has-a → attribute (Car has an Engine: store it, don\u2019t subclass it).'},
 {id:'inheritance-c3', front:'What are dunder methods like __str__?', back:'Hooks into Python\u2019s machinery: print() calls __str__, len() calls __len__. Define them and built-ins understand your objects.'}]},

/* ── Station 17 ──────────────────────────────────────────── */
{ id:'generators', station:17, title:'Generators — The Fresh-Batch Bakery', advanced:true,
svg:'<svg viewBox="0 0 120 90" role="img" aria-label="One-at-a-time bakery counter emblem"><rect x="14" y="46" width="92" height="10" rx="4" fill="var(--brass)"/><circle cx="34" cy="38" r="9" fill="var(--py-gold)" stroke="var(--brass)" stroke-width="2"/><path d="M58 38 L74 38 M70 34 L74 38 L70 42" fill="none" stroke="var(--py-blue)" stroke-width="2.5"/><circle cx="92" cy="38" r="9" fill="var(--panel2)" stroke="var(--brass)" stroke-width="2" stroke-dasharray="3 3"/><text x="26" y="74" font-family="monospace" font-size="9" fill="var(--ink)">one at a time</text></svg>',
sections:[
 {id:'analogy', label:'The Analogy', kind:'analogy',
  html:'<p>A list is a bakery that bakes <strong>every loaf before opening</strong> — all of them on the shelf, warm or not, filling the whole shop. A <strong>generator</strong> is a <strong>bake-to-order counter</strong>: the recipe stands ready, and each time you ask ("next!"), it bakes exactly one loaf, hands it over, and <em>pauses mid-recipe</em>, remembering where it stopped.</p><p>A million-loaf order? The bake-to-order counter needs one tray, ever.</p>',
  voice:'A list is a bakery that bakes every loaf before opening. All of them, on the shelf, filling the whole shop. A generator is a bake to order counter. The recipe stands ready, and each time you say next, it bakes exactly one loaf, hands it over, and pauses mid recipe, remembering exactly where it stopped. A million loaf order? The bake to order counter needs one tray. Ever.',
  alt:{html:'<p>Different picture: a <strong>deli ticket dispenser</strong>. It doesn\u2019t print all ten thousand tickets at dawn; it prints number 47 when you pull, then <em>holds</em> at 48. Pull again tomorrow — it remembers. That held position, mid-count, is the whole magic: a function that can pause.</p>',
       voice:'Or a deli ticket dispenser. It does not print ten thousand tickets at dawn. It prints number forty seven when you pull, then holds at forty eight. Pull again tomorrow: it remembers. That held position, mid count, is the entire magic. A function that can pause.'}},
 {id:'definition', label:'The Definition', kind:'definition',
  html:'<p><strong>Generator function:</strong> a function containing <code>yield</code>. Calling it runs <em>no code</em>; it returns a <strong>generator object</strong>. Each <code>next()</code> runs the body <em>until the next yield</em>, hands out that value, and freezes all local state in place. After the final yield, the generator raises <code>StopIteration</code> — which is precisely how <code>for</code> loops know to stop.</p><p><strong>Lazy evaluation:</strong> values are produced on demand, never stored as a whole collection.</p>',
  voice:'Formally. A generator function is any function containing the yield keyword. Calling it runs no code at all — it hands you a generator object. Each call to next runs the body until the next yield, delivers that value, and freezes every local variable in place. After the last yield, it raises Stop Iteration, which is exactly how for loops know when to stop. The principle is lazy evaluation: values on demand, never the whole collection in memory.',
  alt:{html:'<p><code>return</code> vs <code>yield</code> in one line: <code>return</code> is the machine <strong>shutting down</strong> and handing over its final product; <code>yield</code> is the machine <strong>passing one item through the hatch and waiting</strong>, engine still warm, for the next request.</p>',
       voice:'Return versus yield, in one line. Return is the machine shutting down and handing over its final product. Yield is the machine passing one item through the hatch, and waiting — engine still warm — for the next request.'}},
 {id:'syntax', label:'The Syntax', kind:'syntax', codeStatic:true,
  code:'def fresh_loaves(n):\n    batch = 1\n    while batch <= n:\n        yield f"loaf #{batch}"\n        batch = batch + 1     # resumes HERE on the next next()\n\ncounter = fresh_loaves(3)\nprint(next(counter))   # loaf #1  (runs until first yield)\nprint(next(counter))   # loaf #2  (resumed after the yield)\nfor loaf in fresh_loaves(2):\n    print("for-loop got", loaf)',
  html:'<p>Read the comment: after each <code>yield</code>, the function is <em>frozen at that line</em>; the next <code>next()</code> resumes exactly there, with <code>batch</code> intact. The lab below is a <strong>step-visualizer</strong> — you\u2019ll pump <code>next()</code> by hand and watch the pause/resume happen. <em>(Generators run in real Python; this workshop\u2019s mini-interpreter visualizes rather than executes them — see Simulator Notes.)</em></p>',
  voice:'Read the marked comment. After each yield, the function is frozen at that exact line. The next call to next resumes right there, with batch intact. In the lab below you will pump next by hand and watch the pause and resume happen, step by step. One honest note: generators run in real Python, but this workshop\u2019s mini interpreter visualizes them rather than executing them.',
  alt:{html:'<p>Mental model upgrade: an ordinary function call is a <strong>phone call</strong> — one question, one answer, line closed. A generator is a <strong>text thread</strong> — it answers, stays open, and picks up with full context every time you ping it. Local variables are the chat history.</p>',
       voice:'One more mental model. An ordinary function call is a phone call: one question, one answer, line closed. A generator is a text thread. It answers, stays open, and picks up with full context every time you ping it. The local variables are the chat history.'}},
 {id:'realworld', label:'In the Real World', kind:'realworld',
  html:'<p>Generators shine wherever "all at once" would drown you: reading a 40 GB log file line by line, streaming rows from a database, paging through an API. Python\u2019s own <code>range(1_000_000_000)</code> is lazy — it never builds a billion-slot list. When data is bigger than memory, lazy isn\u2019t an optimization; it\u2019s the only way.</p>',
  voice:'Generators shine wherever all at once would drown you. Reading a forty gigabyte log file line by line. Streaming rows from a database. Paging through an A P I. Python\u2019s own range of a billion is lazy — it never builds a billion slot list. When the data is bigger than your memory, lazy is not an optimization. It is the only way.',
  alt:{html:'<p>You\u2019ve used lazy streams all day: an infinite social feed doesn\u2019t load every post ever written — it yields the next screenful when you scroll. Scroll = <code>next()</code>. The feed is a generator wearing makeup.</p>',
       voice:'You have used lazy streams all day. An infinite social feed does not load every post ever written. It yields the next screenful when you scroll. Scrolling is calling next. The feed is a generator wearing makeup.'}}],
quiz:[
 {id:'generators-q1', prompt:'What happens the moment you CALL a generator function?', options:[
   'Its body runs completely and returns a finished list',
   'The first yielded value is returned',
   'No body code runs; you get a generator object',
   'It starts a background baking thread'], correct:2,
  explain:'The call itself is lazy: you receive a paused machine. Code runs only when next() (or a for loop) demands a value.'},
 {id:'generators-q2', prompt:'What does  yield  do that  return  cannot?', options:[
   'Send back several separate values bundled into one tuple',
   'Run the function noticeably faster',
   'Skip the rest of the current line',
   'Pause the function, resuming later with state intact'], correct:3,
  explain:'yield hands out a value and freezes the function mid-body; the next demand resumes at that exact line. return ends the call for good.'},
 {id:'generators-q3', prompt:'Why choose a generator over a list for 100 million records?', options:[
   'Generators sort the records automatically',
   'One record in memory at a time, not all of them',
   'Lists cannot hold more than one million items',
   'Generators store records compressed on disk'], correct:1,
  explain:'Lazy production means constant memory: each record exists only while being handled. A list would materialize all 100 million at once.'}],
lab:{type:'generator_viz',
 starter:'def fresh_loaves(n):\n    batch = 1\n    while batch <= n:\n        yield f"loaf #{batch}"\n        batch = batch + 1',
 hint:'Press next() repeatedly. Watch the highlight freeze on the yield line, and the batch variable survive between calls. The final press raises StopIteration — that\u2019s the for-loop\u2019s stop signal.'},
deck:[
 {id:'generators-c1', front:'What does calling a generator function do?', back:'Runs nothing; returns a paused generator object. Each next() runs the body to the next yield, then freezes.'},
 {id:'generators-c2', front:'yield vs return?', back:'return ends the call and delivers a final value. yield delivers one value and pauses, all locals intact, resumable.'},
 {id:'generators-c3', front:'What is lazy evaluation, and when is it essential?', back:'Producing values on demand instead of storing them all. Essential when data exceeds memory: huge files, streams, infinite sequences.'}]},

/* ── Station 18 ──────────────────────────────────────────── */
{ id:'decorators', station:18, title:'Decorators — The Gift Wrap', advanced:true,
svg:'<svg viewBox="0 0 120 90" role="img" aria-label="Gift-wrapped box emblem"><rect x="34" y="34" width="52" height="42" rx="5" fill="var(--py-gold)" stroke="var(--brass)" stroke-width="2"/><rect x="56" y="34" width="8" height="42" fill="var(--py-blue)"/><rect x="34" y="50" width="52" height="8" fill="var(--py-blue)"/><path d="M60 34 Q48 18 40 26 Q46 34 60 34 Q72 18 80 26 Q74 34 60 34" fill="var(--py-blue)" stroke="var(--brass)" stroke-width="1.5"/></svg>',
sections:[
 {id:'analogy', label:'The Analogy', kind:'analogy',
  html:'<p>A decorator is <strong>gift wrap for a function</strong>. The gift inside — your original function — is untouched. The wrapping adds something around it: a ribbon before (log the call), a bow after (time it, announce completion). Same gift, upgraded presentation, and you can wrap <em>any</em> function in the same paper.</p>',
  voice:'A decorator is gift wrap for a function. The gift inside — your original function — is untouched. The wrapping adds something around it. A ribbon before: log the call. A bow after: time it, or announce completion. Same gift, upgraded presentation. And the same paper wraps any function you like.',
  alt:{html:'<p>Different picture: a <strong>phone case</strong>. Your phone (the function) still does everything it did; the case around it adds protection and grip — behavior before and after every use — without opening the phone up. Swap cases freely; the phone never changes.</p>',
       voice:'Or think of a phone case. The phone — your function — still does everything it did. The case adds protection and grip around every use, without ever opening the phone up. Swap cases freely. The phone never changes.'}},
 {id:'definition', label:'The Definition', kind:'definition',
  html:'<p><strong>Decorator:</strong> a function that takes a function and returns a new function wrapped around it.</p><p>The wrapper typically does something, calls the original (<code>fn(...)</code>), does something after, and returns the original\u2019s result. <strong>@name</strong> above a <code>def</code> is pure shorthand for <code>func = name(func)</code> — sugar, not magic. This works because in Python, functions are values: storable in jars, passable into machines, returnable from them.</p>',
  voice:'Formally. A decorator is a function that takes a function, and returns a new function wrapped around it. The wrapper does something, calls the original, does something after, and passes the original\u2019s result through. The at sign above a def is pure shorthand for: name equals decorator of name. Sugar, not magic. And it all works because in Python, functions are values. They can sit in jars, ride into machines, and come back out.',
  alt:{html:'<p>Unroll the sugar once and the mystery dies: <code>@announce</code> over <code>def double</code> is exactly <code>double = announce(double)</code> — the jar named <code>double</code> now holds the wrapped version. Every future call knocks on the wrapper first.</p>',
       voice:'Unroll the sugar once, and the mystery dies. At announce above def double is exactly: double equals announce of double. The jar named double now holds the wrapped version. Every future call knocks on the wrapper first.'}},
 {id:'syntax', label:'The Syntax', kind:'syntax',
  code:'def announce(fn):\n    def wrapper(x):\n        print("\u25b6 starting", "work")\n        result = fn(x)\n        print("\u25a0 finished, got", result)\n        return result\n    return wrapper\n\n@announce\ndef double(n):\n    return n * 2\n\n@announce\ndef shout(word):\n    return word.upper() + "!"\n\nprint(double(21))\nprint(shout("hurrah"))',
  html:'<p>One wrapper, two very different gifts — that\u2019s the payoff: the announcing behavior is written <em>once</em> and applied with one <code>@</code> line each. Trace a call: <code>double(21)</code> → wrapper prints, runs the real <code>double</code>, prints again, passes 42 through. The lab\u2019s animation shows the call travelling through the wrapping layers.</p>',
  voice:'One wrapper, two very different gifts. That is the payoff: the announcing behavior is written once, and applied with a single at sign per function. Trace the call. Double of twenty one enters the wrapper. It prints, runs the real double, prints again, and passes forty two through. The lab animation will show a call travelling through the wrapping layers.',
  alt:{html:'<p>Why not just paste the prints into each function? Because next month there\u2019ll be ten functions and a request to add timing too. With decorators: edit one wrapper, done. Cross-cutting concerns — logging, timing, permission checks — live in one place instead of leaking into every function body.</p>',
       voice:'Why not just paste the print lines into each function? Because next month there will be ten functions, and a request to add timing too. With decorators, you edit one wrapper, and you are done. Cross cutting concerns — logging, timing, permission checks — live in one place, instead of leaking into every body.'}},
 {id:'realworld', label:'In the Real World', kind:'realworld',
  html:'<p>Decorators are how Python frameworks read like English: <code>@app.route("/home")</code> registers a webpage; <code>@login_required</code> guards it; <code>@cache</code> memorizes slow results; <code>@retry(3)</code> re-attempts flaky network calls. You\u2019ll meet them constantly as a <em>user</em> long before writing many yourself — and now the <code>@</code> won\u2019t be a mystery.</p>',
  voice:'Decorators are how Python frameworks read like English. At app dot route registers a webpage. At login required guards it. At cache memorizes slow results. At retry re attempts flaky network calls. You will meet decorators constantly as a user, long before you write many yourself. And now the at sign holds no mystery.',
  alt:{html:'<p>Spot the pattern in the wild: whenever a single <code>@word</code> grants a function a whole superpower — appearing on a website, surviving crashes, requiring admin rights — you\u2019re watching one function being handed to another, wrapped, and handed back. Every time.</p>',
       voice:'Here is how to spot it in the wild. Whenever one at sign grants a function a whole superpower — appearing on a website, surviving crashes, requiring admin rights — you are watching one function being handed to another, wrapped, and handed back. Every single time.'}}],
quiz:[
 {id:'decorators-q1', prompt:'What is  @announce  above  def double  shorthand for?', options:[
   'announce.attach(double) at import',
   'double = announce(double)',
   'announce = double(announce)',
   'A comment linking the two names'], correct:1,
  explain:'The @ syntax is sugar: the function is passed to the decorator and the jar is refilled with the wrapped version.'},
 {id:'decorators-q2', prompt:'After decorating, what happens to the original function\u2019s code?', options:[
   'Unchanged — the wrapper calls it inside',
   'It is edited to include the new lines',
   'It is deleted once wrapping succeeds',
   'It runs only when called via .inner()'], correct:0,
  explain:'The gift is untouched: the wrapper adds behavior around it and delegates to it with fn(...).'},
 {id:'decorators-q3', prompt:'Which language feature makes decorators possible at all?', options:[
   'Python files always being read strictly top to bottom',
   'The existence of the print function',
   'Functions being values you can pass and return',
   'Classes inheriting from their parents'], correct:2,
  explain:'A decorator receives a function as an argument and returns one — only possible because functions are first-class values.'}],
lab:{type:'pylite',
 starter:'# Wrap your own gifts\n# 1. Write  def excited(fn):  whose inner  wrapper(text)  calls fn(text)\n#    and returns the result + "!!!"\n# 2. Apply @excited to  def greet(name): return "Hello " + name\n# 3. Print greet("Ada")  ->  Hello Ada!!!\n# 4. Bonus: stack a second decorator @loud that upper-cases the result,\n#    and predict the order the wrappers apply.\nprint("wrap something above")\n',
 hint:'Inside excited: def wrapper(text): return fn(text) + "!!!" then return wrapper. Stacked decorators apply bottom-up: the one closest to def wraps first.'},
deck:[
 {id:'decorators-c1', front:'What is a decorator, in one sentence?', back:'A function that takes a function and returns a wrapped version — behavior added around, original untouched.'},
 {id:'decorators-c2', front:'What does  @name  literally do?', back:'Shorthand for  func = name(func)  right after the def: the jar is refilled with the wrapped function.'},
 {id:'decorators-c3', front:'Name three real decorator uses.', back:'Routing (@app.route), access control (@login_required), caching (@cache), retries, timing, logging — cross-cutting concerns written once.'}]},

/* ── Station 19 ──────────────────────────────────────────── */
{ id:'async', station:19, title:'Async & the GIL — One Chef, Many Pots', advanced:true,
svg:'<svg viewBox="0 0 120 90" role="img" aria-label="One chef with several pots emblem"><circle cx="60" cy="24" r="9" fill="var(--py-gold)" stroke="var(--brass)" stroke-width="2"/><rect x="52" y="33" width="16" height="16" rx="4" fill="var(--py-blue)"/><rect x="16" y="58" width="22" height="14" rx="3" fill="var(--panel2)" stroke="var(--brass)" stroke-width="2"/><rect x="49" y="58" width="22" height="14" rx="3" fill="var(--panel2)" stroke="var(--brass)" stroke-width="2"/><rect x="82" y="58" width="22" height="14" rx="3" fill="var(--panel2)" stroke="var(--brass)" stroke-width="2"/><path d="M22 54 Q24 48 22 44 M60 54 Q62 48 60 44 M96 54 Q98 48 96 44" fill="none" stroke="var(--ink)" opacity="0.5" stroke-width="2"/></svg>',
sections:[
 {id:'analogy', label:'The Analogy', kind:'analogy',
  html:'<p>Picture <strong>one chef, three pots</strong>. Rice needs 20 minutes of <em>waiting</em>, not stirring. A bad chef stands staring at the rice; a good chef starts the rice, moves to the dal while it simmers, preps the salad while <em>that</em> simmers, and swings back exactly when each pot needs hands.</p><p>That\u2019s <strong>async</strong>: one worker, never idle, because waiting time (for water to boil — or for a website to reply) is spent on other tasks.</p>',
  voice:'Picture one chef and three pots. Rice needs twenty minutes of waiting, not stirring. A bad chef stands staring at the rice. A good chef starts the rice, moves to the dal while it simmers, preps the salad while that simmers, and swings back exactly when each pot needs hands. That is async. One worker, never idle, because waiting time is spent on other tasks.',
  alt:{html:'<p>Different picture: a <strong>bank teller and three customers</strong> who each keep pausing to dig for documents. A synchronous teller serves one fully, digging-pauses included, before greeting the next. An async teller says "wave when you\u2019ve found it," and serves whoever is <em>ready</em>. Total work is identical — total <em>elapsed time</em> collapses.</p>',
       voice:'Or a bank teller with three customers who keep pausing to dig for documents. A synchronous teller serves one completely, pauses included, before the next. An async teller says: wave when you have found it — and serves whoever is ready. The total work is identical. The elapsed time collapses.'}},
 {id:'definition', label:'The Definition', kind:'definition',
  html:'<p><strong>async def</strong> declares a coroutine — a pausable task. <strong>await</strong> marks a waiting point ("pot is simmering"): the chef parks this task and serves another. An <em>event loop</em> is the kitchen manager deciding who gets the chef next.</p><p><strong>The GIL</strong> (Global Interpreter Lock): classic Python allows only <em>one</em> thread to execute Python instructions at a time — one chef, even on a 16-burner stove. Async doesn\u2019t fight this: it makes the single chef <em>maximally busy</em>. (Great for waiting-heavy work; heavy <em>computation</em> instead uses multiple processes — separate kitchens.)</p>',
  voice:'Formally. Async def declares a coroutine, a pausable task. Await marks a waiting point: the pot is simmering, so the chef parks this task and serves another. The event loop is the kitchen manager, deciding who gets the chef next. Now, the G I L — the global interpreter lock. Classic Python allows only one thread to execute Python instructions at a time. One chef, even on a sixteen burner stove. Async does not fight this. It makes the single chef maximally busy. For heavy computation, Python instead uses multiple processes. Separate kitchens entirely.',
  alt:{html:'<p>The crisp division: is your program mostly <strong>waiting</strong> (network, disk, timers)? Async shines — one clever chef. Mostly <strong>computing</strong> (crunching pixels, training models)? The GIL bites; hire real parallel kitchens (processes) or libraries that step outside the GIL. Diagnose the bottleneck first; pick the tool second.</p>',
       voice:'Here is the crisp division. Mostly waiting — network, disk, timers? Async shines. One clever chef. Mostly computing — crunching pixels, training models? The G I L bites, and you hire real parallel kitchens: separate processes, or libraries that step outside the lock. Diagnose the bottleneck first. Pick the tool second.'}},
 {id:'syntax', label:'The Syntax', kind:'syntax', codeStatic:true,
  code:'import asyncio\n\nasync def brew(name, seconds):\n    print(f"start {name}")\n    await asyncio.sleep(seconds)   # chef walks away here\n    print(f"done  {name}")\n\nasync def kitchen():\n    await asyncio.gather(\n        brew("chai", 2),\n        brew("coffee", 3),\n        brew("soup", 1),\n    )\n\nasyncio.run(kitchen())\n# All three "start" lines print immediately;\n# total time \u2248 3s (the longest), not 2+3+1 = 6s.',
  html:'<p>Read the comments: <code>gather</code> hands three pots to one chef; every <code>await</code> is a walk-away point. Elapsed time equals the <em>longest</em> pot, not the sum — that\u2019s the entire business case for async in one number. The lab is an <strong>animated kitchen</strong>: watch the chef hop between pots on a timeline. <em>(async runs in real Python; here it\u2019s animated rather than executed — see Simulator Notes.)</em></p>',
  voice:'Read the closing comment — it is the entire business case in one number. Gather hands three pots to one chef, every await is a walk away point, and the elapsed time equals the longest pot, not the sum. Three seconds, not six. The lab below is an animated kitchen: watch the chef hop between pots along a timeline. And one honest note: async runs in real Python, but here it is animated rather than executed.',
  alt:{html:'<p>What <code>await</code> is <em>not</em>: it\u2019s not "go faster" — no pot boils sooner. It\u2019s a <strong>politeness marker</strong>: "I\u2019ll be waiting here; chef, feel free to serve others." Sprinkling <code>await</code> on compute-heavy code does nothing — there\u2019s no waiting to donate.</p>',
       voice:'Also worth naming what await is not. It is not go faster. No pot boils sooner. Await is a politeness marker: I will be waiting here, chef — feel free to serve others. Sprinkling await onto compute heavy code does nothing. There is no waiting to donate.'}},
 {id:'realworld', label:'In the Real World', kind:'realworld',
  html:'<p>A chat server holds 10,000 open connections, nearly all silent at any instant — async lets one modest process nurse them all. Web scrapers fire 200 page requests concurrently and collect answers as they land. Every modern Python web framework (FastAPI most famously) is async at the core. Meanwhile, the GIL explains a classic gotcha: threads won\u2019t speed up pure number-crunching — processes will.</p>',
  voice:'A chat server holds ten thousand open connections, nearly all silent at any instant. Async lets one modest process nurse them all. Web scrapers fire two hundred requests concurrently and collect answers as they land. Every modern Python web framework is async at the core. And the G I L explains a classic gotcha: threads will not speed up pure number crunching. Processes will.',
  alt:{html:'<p>Interview-classic, now yours: "Why didn\u2019t threads make my Python math faster?" — the GIL admits one instruction-executing thread at a time. "When is async the wrong tool?" — when nothing waits. Two questions, one chef, fully explained.</p>',
       voice:'Two interview classics are now yours. Why did threads not make my Python math faster? Because the G I L admits one instruction executing thread at a time. And when is async the wrong tool? When nothing waits. Two questions. One chef. Fully explained.'}}],
quiz:[
 {id:'async-q1', prompt:'What happens at an  await  point inside a coroutine?', options:[
   'The task pauses; the chef serves other ready tasks',
   'The awaited operation is skipped entirely',
   'Python spawns a new CPU core for the task',
   'The whole program halts completely until that operation finishes'], correct:0,
  explain:'await parks the current task at its simmering pot; the event loop hands the chef to whichever task is ready.'},
 {id:'async-q2', prompt:'Three async tasks wait 2s, 3s, and 1s. Run with gather, elapsed time is about...', options:[
   '6 seconds — waits always add up',
   '1 second — the shortest sets the pace',
   '3 seconds — the longest single wait',
   '2 seconds — the average of the three'], correct:2,
  explain:'Waits overlap: the chef starts all three pots, and the clock is set by the slowest one alone.'},
 {id:'async-q3', prompt:'What does the GIL actually restrict?', options:[
   'Programs may not open several files simultaneously',
   'One thread executes Python instructions at a time',
   'Python may use at most one gigabyte of RAM',
   'Only one function may be defined per file'], correct:1,
  explain:'The Global Interpreter Lock serializes Python instruction execution across threads — one chef, however many burners. Waiting-heavy work suits async; compute-heavy work suits processes.'}],
lab:{type:'async_viz',
 starter:'tasks:\n  chai   2s\n  coffee 3s\n  soup   1s',
 hint:'Press Run and watch the timeline: three starts fire immediately, the chef hops to whichever pot is ready, and the finish line lands at the longest task — 3s, not 6s. Toggle "synchronous" to see the same pots served one-by-one for contrast.'},
deck:[
 {id:'async-c1', front:'What is async best at?', back:'Waiting-heavy work (network, disk, timers): one worker overlaps many waits, so elapsed time ≈ the longest wait, not the sum.'},
 {id:'async-c2', front:'What does  await  actually mean?', back:'"This task is now waiting — serve someone else." A yield point for the event loop, not a speed boost.'},
 {id:'async-c3', front:'What is the GIL, and its consequence?', back:'The Global Interpreter Lock: one thread runs Python instructions at a time. Threads don\u2019t speed up computation — use processes for that; async for waiting.'}]}
],

conceptMap:{
